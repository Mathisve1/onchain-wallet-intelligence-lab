name: R10 Data Workflow Implementation Finalizer

on:
  push:
    branches: [research/r10-data-workflow-implementation]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10-data-workflow-implementation
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Remove transient finalizer
        run: git rm .github/workflows/r10-data-workflow-finalizer.yml
      - name: Make historical R10 validators later-stage aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int | None = None) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              expected = count if count is not None else 1
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, observed {actual}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # The preflight workflow remains installed as an exact historical, fail-closed route.
          # Its single-use preflight release is already consumed; the new data workflow is a
          # separate later stage and remains inert until its own execution release exists.
          contract_path = Path('research/archive_inventory/r10_data_execution/R10_DATA_WORKFLOW_IMPLEMENTATION_CONTRACT.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['consumed_preflight_workflow_retired'] = False
          contract['consumed_preflight_workflow_retained_fail_closed'] = True
          contract['retained_consumed_preflight_workflow_path'] = contract.pop('retired_consumed_preflight_workflow_path')
          contract_path.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          replace(
              'research/archive_inventory/r10_data_execution/README.md',
              'The consumed STS-only preflight workflow is retired from `.github/workflows/` so there is only one active R10 OIDC workflow route. The installed data workflow keeps the same trust-bound workflow name, a 900-second role session, exact-six `s3:GetObject` session scope, one request per object, zero S3 retries, exact Requester Pays/integrity checks in the collector, and the approved six-hour compressed/decompressed byte caps.',
              'The consumed STS-only preflight workflow remains installed byte-for-byte as historical evidence, but its single-use release is consumed and its own history gate prevents another OIDC assumption. The installed data workflow is a separate later route using the same trust-bound workflow name, a 900-second role session, exact-six `s3:GetObject` session scope, one request per object, zero S3 retries, exact Requester Pays/integrity checks in the collector, and the approved six-hour compressed/decompressed byte caps.'
          )

          # Current-state validators may observe the later data workflow while immutable
          # preregistration/approval/attestation documents retain their original false fields.
          replacements = {
              'governance/validate_r10_implementation.py': [
                  ('    assert not DATA_INSTALLED.exists()\n', '    assert DATA_INSTALLED.is_file()\n'),
              ],
              'governance/validate_r10_preregistration.py': [
                  ('    assert not (ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").exists()\n', '    assert (ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").is_file()\n'),
              ],
              'governance/validate_r10_role_attestation.py': [
                  ('    assert not DATA_WORKFLOW.exists()\n', '    assert DATA_WORKFLOW.is_file()\n'),
              ],
              'governance/validate_r10_role_preflight.py': [
                  ('    assert not DATA_WORKFLOW.exists()\n', '    assert DATA_WORKFLOW.is_file()\n'),
              ],
              'governance/validate_r10_role_preflight_evidence.py': [
                  ('    assert not DATA_WORKFLOW.exists()\n', '    assert DATA_WORKFLOW.is_file()\n'),
              ],
              'governance/validate_r10_sts_preflight_release.py': [
                  ('    assert not DATA_WORKFLOW.exists()\n', '    assert DATA_WORKFLOW.is_file()\n'),
              ],
              'governance/validate_r10_sts_preflight_release_candidate.py': [
                  ('    assert not DATA_WORKFLOW.exists()\n', '    assert DATA_WORKFLOW.is_file()\n'),
              ],
              'tests/test_archive_inventory_r10_implementation.py': [
                  ('    def test_frozen_preflight_candidate_is_installed_byte_exact_but_data_candidate_is_not(self) -> None:\n', '    def test_frozen_preflight_candidate_remains_installed_and_later_data_workflow_is_present(self) -> None:\n'),
                  ('        self.assertFalse(data_installed.exists())\n', '        self.assertTrue(data_installed.is_file())\n'),
              ],
              'tests/test_archive_inventory_r10_preregistration.py': [
                  ('        self.assertFalse((ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").exists())\n', '        self.assertTrue((ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").is_file())\n'),
              ],
              'tests/test_archive_inventory_r10_role_attestation.py': [
                  ('        self.assertFalse((ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").exists())\n', '        self.assertTrue((ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").is_file())\n'),
              ],
              'tests/test_archive_inventory_r10_role_preflight.py': [
                  ('        self.assertFalse(DATA_WORKFLOW.exists())\n', '        self.assertTrue(DATA_WORKFLOW.is_file())\n'),
              ],
              'tests/test_archive_inventory_r10_role_preflight_evidence.py': [
                  ('        self.assertFalse((ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").exists())\n', '        self.assertTrue((ROOT / ".github/workflows/hyperliquid-archive-post-boundary-multihour-feature-r10.yml").is_file())\n'),
              ],
              'tests/test_archive_inventory_r10_sts_preflight_release.py': [
                  ('        self.assertFalse(DATA_WORKFLOW.exists())\n', '        self.assertTrue(DATA_WORKFLOW.is_file())\n'),
              ],
              'tests/test_archive_inventory_r10_sts_preflight_release_candidate.py': [
                  ('        self.assertFalse(DATA_WORKFLOW.exists())\n', '        self.assertTrue(DATA_WORKFLOW.is_file())\n'),
              ],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace(path, old, new)

          # New data-stage validator/test: the historical preflight route is retained, not retired.
          replace(
              'governance/validate_r10_data_workflow.py',
              '    assert c["consumed_preflight_workflow_retired"] is True\n',
              '    assert c["consumed_preflight_workflow_retired"] is False\n    assert c["consumed_preflight_workflow_retained_fail_closed"] is True\n'
          )
          replace(
              'governance/validate_r10_data_workflow.py',
              '    assert not PREFLIGHT_WORKFLOW.exists()\n',
              '    assert PREFLIGHT_WORKFLOW.is_file()\n    assert sha256(PREFLIGHT_WORKFLOW) == "fefef8a7bb40e965c9ed77e9892057ac8e0a64dcfa60d7f3e7dba8f1651b5f4d"\n'
          )
          replace(
              'tests/test_archive_inventory_r10_data_workflow.py',
              '    def test_consumed_preflight_route_is_retired_and_data_route_is_single_exact_oidc_lane(self) -> None:\n',
              '    def test_consumed_preflight_route_is_retained_fail_closed_and_data_route_is_installed(self) -> None:\n'
          )
          replace(
              'tests/test_archive_inventory_r10_data_workflow.py',
              '        self.assertFalse(PREFLIGHT.exists())\n',
              '        self.assertTrue(PREFLIGHT.is_file())\n        self.assertEqual(hashlib.sha256(PREFLIGHT.read_bytes()).hexdigest(), "fefef8a7bb40e965c9ed77e9892057ac8e0a64dcfa60d7f3e7dba8f1651b5f4d")\n'
          )

          # OIDC allowlist contains both reviewed R10 files. The historical preflight route
          # cannot pass its already-consumed single-use history gate.
          replace(
              'tests/test_archive_inventory_aws_oidc_access.py',
              '        allowed = {identity, r0, region, r2, r3, r4, r4_preflight, r5, r6a, r6a_successor, r7, r8a, r9, r10_data}\n',
              '        allowed = {identity, r0, region, r2, r3, r4, r4_preflight, r5, r6a, r6a_successor, r7, r8a, r9, r10_preflight, r10_data}\n'
          )
          replace(
              'tests/test_archive_inventory_aws_oidc_access.py',
              '        self.assertFalse(r10_preflight.exists())\n',
              ''
          )
          PY
      - name: Regenerate canonical repository manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate R10 data workflow stage
        run: python governance/validate_r10_data_workflow.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py
      - name: Commit finalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: freeze inert R10 data workflow implementation"
          git push origin HEAD:research/r10-data-workflow-implementation
