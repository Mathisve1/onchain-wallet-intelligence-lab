name: R10 Data Execution Release Finalizer

on:
  push:
    branches: [research/r10-data-execution-release]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10-data-execution-release
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Remove transient finalizer
        run: git rm .github/workflows/r10-data-execution-release-finalizer.yml
      - name: Finalize release bindings and later-stage validators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          release_path = Path('research/archive_inventory/r10_runtime/R10_EXECUTION_RELEASE_CANONICALIZATION.json')
          release = json.loads(release_path.read_text(encoding='utf-8'))
          release['role_arn'] = 'arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-multihour-r10'
          release_path.write_text(json.dumps(release, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          old_files = '["R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"]'
          new_files = '["R10_EXECUTION_RELEASE_CANONICALIZATION.json", "R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"]'
          for root in ('governance', 'tests'):
              for p in Path(root).glob('*r10*.py'):
                  text = p.read_text(encoding='utf-8')
                  if old_files in text:
                      text = text.replace(old_files, new_files)
                      p.write_text(text, encoding='utf-8')

          candidate_validator = Path('governance/validate_r10_data_execution_release_candidate.py')
          text = candidate_validator.read_text(encoding='utf-8')
          old = '    assert not RUNTIME_RELEASE.exists()\n'
          new = '''    if RUNTIME_RELEASE.exists():\n        later = load(RUNTIME_RELEASE)\n        assert later["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R10_RUN"\n        assert later["release_candidate_merge_commit"] == "9b4862ac8ea5499da81d5e4ab40090b077dd9357"\n        assert later["role_arn"] == ROLE_ARN\n        assert later["single_workflow_dispatch_authorized"] is True\n        assert later["rerun_authorized"] is False\n        assert later["release_consumed"] is False\n        assert all(value is False for value in later["downstream_authorizations"].values())\n        assert all(value is False for value in later["trading_authorizations"].values())\n'''
          if text.count(old) != 1:
              raise SystemExit('candidate validator runtime absence assertion not found exactly once')
          candidate_validator.write_text(text.replace(old, new), encoding='utf-8')

          candidate_test = Path('tests/test_archive_inventory_r10_data_execution_release_candidate.py')
          text = candidate_test.read_text(encoding='utf-8')
          old = '        self.assertFalse(RUNTIME_RELEASE.exists())\n'
          new = '        self.assertTrue(RUNTIME_RELEASE.is_file())\n'
          if text.count(old) != 1:
              raise SystemExit('candidate test runtime absence assertion not found exactly once')
          candidate_test.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Regenerate repository manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate single-use R10 data release
        run: python governance/validate_r10_data_execution_release.py
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py
      - name: Commit finalized release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: freeze single-use R10 data execution release"
          git push origin HEAD:research/r10-data-execution-release
