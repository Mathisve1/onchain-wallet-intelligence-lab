name: R7 Activation Finalizer

on:
  push:
    branches:
      - research/r7-wallet-index-activation

permissions:
  contents: write

concurrency:
  group: r7-activation-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out R7 activation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r7-wallet-index-activation
          fetch-depth: 0
          persist-credentials: true

      - name: Make candidate validator activation-aware, self-delete, regenerate and verify
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r7-wallet-index-activation"
          python - <<'PY'
          from pathlib import Path
          path = Path('governance/validate_r7_release.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert not ACTIVATION.exists()\n    print("R7_RELEASE_CANDIDATE_VALID")\n'''
          new = '''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["release_id"] == release["release_id"]\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R7_RUN"\n        assert activation["candidate_sha256"] == sha(RELEASE)\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["release_consumed"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["wallet_addresses_retained"] == 0\n        assert activation["empirical_result"] is None\n    print("R7_RELEASE_CANDIDATE_VALID")\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git rm .github/workflows/r7-activation-finalizer.yml
          git add governance/validate_r7_release.py tests/test_archive_inventory_r7_release.py
          python governance/regenerate_manifest.py --write
          python -m unittest discover -s tests -v
          python governance/validate_r7_preregistration.py
          python governance/validate_r7_approval.py
          python governance/validate_r7_implementation.py
          python governance/validate_r7_release.py
          python governance/validate_r7_activation.py
          python governance/validate_repository.py
          test ! -e .github/workflows/r7-activation-finalizer.yml
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'activation: finalize exact R7 single-use tree'
          git push origin HEAD:research/r7-wallet-index-activation
