name: R11A D1 Restore Canonical CI

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  restore:
    if: >-
      github.event.pull_request.number == 142 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11a-d1-closure-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Restore canonical CI and remove this transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/r11a-d1-restore-canonical-ci.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python governance/validate_r11a_preregistration.py
          python governance/validate_r11a_implementation.py
          python governance/validate_r11a_d1_closure.py
          git add -A
          git diff --cached --check
      - name: Commit canonical CI restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: restore canonical Research CI after R11A D1 closure seal'
          git push origin HEAD:research/r11a-d1-closure-repair
