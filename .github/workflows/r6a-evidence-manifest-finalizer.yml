name: R6A Evidence Manifest Finalizer

on:
  push:
    branches:
      - research/r6a-successor-evidence

permissions:
  contents: write

concurrency:
  group: r6a-evidence-manifest-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r6a-successor-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Remove builder, regenerate exact manifest, validate and push
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r6a-successor-evidence"
          git rm .github/workflows/r6a-evidence-manifest-finalizer.yml
          python governance/regenerate_manifest.py --write
          git add governance/REPOSITORY_MANIFEST.sha256
          python governance/validate_r6a_evidence.py
          python -m unittest tests.test_archive_inventory_r6a_evidence -v
          python governance/regenerate_manifest.py --check
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evidence: finalize exact R6A successor manifest'
          git push origin HEAD:research/r6a-successor-evidence
