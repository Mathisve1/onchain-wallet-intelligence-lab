name: Hyperliquid Archive Region Probe R1

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact current canonical main commit SHA to execute
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-region-probe-r1
  cancel-in-progress: false

env:
  EXACT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  EXPECTED_AWS_ACCOUNT_ID: '630956766927'
  EXPECTED_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-metadata-canary
  PREREGISTRATION_COMMIT: 910997423f5e008f3c7bca65fd739d6aa14d25a7
  APPROVAL_MERGE_COMMIT: b86156d71ef438441e6d3903a8bbc2da564a2046
  APPROVAL_ID: APPROVE_HL_ARCHIVE_REGION_PROBE_R1_001
  APPROVAL_TEXT_SHA256: 56c8d01396b12d0dd783dbc1646ebbca947e51a024bb5c8f091cd0b7a889c541
  EXPECTED_IMPLEMENTATION_COMMIT: 91687b4c803e331d4b2ef8493df731c99e25a0e5
  EXECUTION_RELEASE_PATH: research/archive_inventory/region_probe_r1/REGION_PROBE_EXECUTION_RELEASE.json
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  region-probe-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact reviewed commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_REVIEWED_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical main dispatch and exact reviewed identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXACT_REVIEWED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "${DISPATCH_REF}" = "refs/heads/main"
          test "${EXACT_REVIEWED_COMMIT}" = "${DISPATCH_SHA}"
          test "$(git rev-parse HEAD)" = "${EXACT_REVIEWED_COMMIT}"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Prove canonical implementation and single-use release before AWS OIDC
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep -F 'Python 3.12.13'
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_region_probe_r1_implementation.py
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.')
          base = root / 'research/archive_inventory/region_probe_r1'
          approval_text = base / 'approvals/APPROVE_HL_ARCHIVE_REGION_PROBE_R1_001.txt'
          approval = json.loads((base / 'approvals/APPROVE_HL_ARCHIVE_REGION_PROBE_R1_001.json').read_text())
          impl = json.loads((base / 'REGION_PROBE_IMPLEMENTATION_CONTRACT.json').read_text())
          release = json.loads((root / os.environ['EXECUTION_RELEASE_PATH']).read_text())
          assert hashlib.sha256(approval_text.read_bytes()).hexdigest() == os.environ['APPROVAL_TEXT_SHA256']
          assert approval['approval_id'] == os.environ['APPROVAL_ID']
          assert approval['reviewed_commit'] == os.environ['PREREGISTRATION_COMMIT']
          assert approval['maximum_one_time_budget_eur'] == 0.10
          assert approval['maximum_head_bucket_requests'] == 1
          assert impl['approval_merge_commit'] == os.environ['APPROVAL_MERGE_COMMIT']
          assert impl['session_s3_policy'] == 'EXPLICIT_DENY_ALL_S3'
          assert release['release_id'] == 'RELEASE_HL_ARCHIVE_REGION_PROBE_R1_001'
          assert release['status'] == 'RELEASED_FOR_EXACTLY_ONE_CANONICAL_REGION_PROBE_RUN'
          assert release['implementation_commit'] == os.environ['EXPECTED_IMPLEMENTATION_COMMIT']
          assert release['approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert release['target_bucket'] == 'hl-mainnet-node-data'
          assert release['maximum_one_time_budget_eur'] == 0.10
          assert release['maximum_monthly_budget_eur'] == 0
          assert release['maximum_head_bucket_requests'] == 1
          assert release['maximum_s3_http_requests'] == 1
          assert release['maximum_runtime_seconds'] == 30
          assert release['maximum_retries'] == 0
          assert release['http_redirect_following_authorized'] is False
          assert release['single_workflow_dispatch_authorized'] is True
          assert release['rerun_authorized'] is False
          assert release['head_bucket_authorized'] is True
          assert release['session_s3_policy'] == 'EXPLICIT_DENY_ALL_S3'
          for key in ('list_objects_v2_authorized','get_object_authorized','head_object_authorized','get_object_attributes_authorized','range_get_authorized','object_body_download_authorized','market_data_ingestion_authorized','larger_300_request_inventory_authorized'):
              assert release[key] is False
          assert release['s3_request_executed'] is False
          assert release['exact_bucket_region'] is None
          assert release['empirical_result'] is None
          assert all(v is False for v in release['trading_authorizations'].values())
          PY

      - name: Enforce single-use release before AWS OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${CURRENT_RUN_ATTEMPT}" = '1'
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          release = json.loads(Path(os.environ['EXECUTION_RELEASE_PATH']).read_text())
          start = datetime.fromisoformat(release['single_use_window_start_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
          url = f"https://api.github.com/repos/{os.environ['CURRENT_REPOSITORY']}/actions/workflows/hyperliquid-archive-region-probe-r1.yml/runs?event=workflow_dispatch&branch=main&per_page=100"
          req = urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'hl-region-probe-r1-single-use-check'})
          with urllib.request.urlopen(req, timeout=10) as response:
              runs = json.load(response).get('workflow_runs')
          assert isinstance(runs, list) and len(runs) < 100
          eligible = [r for r in runs if datetime.fromisoformat(r['created_at'].replace('Z','+00:00')).astimezone(timezone.utc) >= start]
          assert len(eligible) == 1, 'Region probe execution release is not single-use within the release window'
          assert int(eligible[0]['id']) == int(os.environ['CURRENT_RUN_ID']), 'a previous Region probe dispatch already consumed this release'
          assert eligible[0]['event'] == 'workflow_dispatch' and eligible[0]['head_branch'] == 'main'
          PY

      - name: Assume exact AWS role with explicit deny-all-S3 session policy
        id: configure
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-metadata-canary
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: HLArchiveRegionProbeR1
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"DenyAllS3DuringRegionProbe","Effect":"Deny","Action":"s3:*","Resource":"*"}]}

      - name: Execute exactly one bounded Region probe transport
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python research/archive_inventory/region_probe_r1/probe.py "${RUNNER_TEMP}/region-probe-r1-result.json" >/dev/null
          rc=$?
          set -e
          printf '%s\n' "${rc}" >"${RUNNER_TEMP}/region-probe-r1.rc"

      - name: Finalize minimized Region probe evidence
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          result_path = root / 'region-probe-r1-result.json'
          if result_path.is_file():
              result = json.loads(result_path.read_text())
          else:
              result = {'schema_version':'1.0','probe_id':'HL-ARCHIVE-REGION-PROBE-R1-001','target_bucket':'hl-mainnet-node-data','terminal_status':'REGION_PROBE_R1_NOT_EXECUTED','request_attempt_count':0,'s3_http_request_count':0,'http_method':'HEAD','http_status':None,'http_status_class':None,'x_amz_bucket_region':None,'x_amz_request_charged':None,'observed_at_utc':None,'runtime_seconds':0.0,'retries_used':0,'http_redirects_followed':False,'requester_pays_requested':False,'request_body_requested':False,'response_body_read':False,'list_objects_v2_requested':False,'object_body_requested':False,'market_data_ingested':False,'empirical_result':None,'technical_result':None,'failure_class':'PRE_OIDC_OR_OIDC_GATE_FAILED'}
              result_path.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          release = json.loads(Path(os.environ['EXECUTION_RELEASE_PATH']).read_text())
          context = {'schema_version':'1.0','probe_id':'HL-ARCHIVE-REGION-PROBE-R1-001','dispatch_ref':os.environ['DISPATCH_REF'],'dispatch_sha':os.environ['DISPATCH_SHA'],'reviewed_commit':os.environ['EXACT_REVIEWED_COMMIT'],'checked_out_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflow_run_id':int(os.environ['WORKFLOW_RUN_ID']),'workflow_run_attempt':int(os.environ['WORKFLOW_RUN_ATTEMPT']),'execution_release_id':release['release_id'],'implementation_commit':release['implementation_commit'],'configure_aws_outcome':os.environ.get('CONFIGURE_OUTCOME'),'terminal_status':result['terminal_status'],'request_attempt_count':result['request_attempt_count'],'s3_http_request_count':result['s3_http_request_count'],'http_status':result['http_status'],'http_status_class':result['http_status_class'],'x_amz_bucket_region':result['x_amz_bucket_region'],'x_amz_request_charged':result['x_amz_request_charged'],'runtime_seconds':result['runtime_seconds'],'retries_used':result['retries_used'],'http_redirects_followed':result['http_redirects_followed'],'requester_pays_requested':result['requester_pays_requested'],'response_body_read':result['response_body_read'],'list_objects_v2_requested':result['list_objects_v2_requested'],'object_body_requested':result['object_body_requested'],'market_data_ingested':result['market_data_ingested'],'technical_result':result['technical_result'],'failure_class':result['failure_class']}
          (root/'region-probe-r1-context.json').write_text(json.dumps(context,indent=2,sort_keys=True)+'\n')
          rc = root/'region-probe-r1.rc'
          if not rc.exists(): rc.write_text('NOT_RUN\n')
          PY
          cd "${RUNNER_TEMP}"
          sha256sum region-probe-r1-context.json region-probe-r1-result.json region-probe-r1.rc >REGION_PROBE_R1_FILES.sha256

      - name: Upload minimized Region probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperliquid-archive-region-probe-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/region-probe-r1-context.json
            ${{ runner.temp }}/region-probe-r1-result.json
            ${{ runner.temp }}/region-probe-r1.rc
            ${{ runner.temp }}/REGION_PROBE_R1_FILES.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

      - name: Enforce exact successful Region probe result
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          set -euo pipefail
          test "${CONFIGURE_OUTCOME}" = 'success'
          test "$(cat "${RUNNER_TEMP}/region-probe-r1.rc")" = '0'
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'region-probe-r1-result.json').read_text())
          assert r['terminal_status']=='REGION_PROBE_R1_PASS'
          assert r['request_attempt_count']==1 and r['s3_http_request_count']==1
          assert r['http_method']=='HEAD' and isinstance(r['http_status'],int)
          assert re.fullmatch(r'[a-z0-9-]{1,20}',r['x_amz_bucket_region'])
          assert r['runtime_seconds']<=30 and r['retries_used']==0 and r['http_redirects_followed'] is False
          assert r['requester_pays_requested'] is True
          assert r['response_body_read'] is False and r['list_objects_v2_requested'] is False
          assert r['object_body_requested'] is False and r['market_data_ingested'] is False
          assert r['empirical_result'] is None and r['technical_result']=='BUCKET_REGION_OBSERVED'
          PY
