name: R8 Static Design Finalizer

on:
  push:
    branches:
      - research/r8-performance-copyability-design

permissions:
  contents: write

concurrency:
  group: r8-static-design-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out R8 static design branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r8-performance-copyability-design
          fetch-depth: 0
          persist-credentials: true

      - name: Self-delete, regenerate exact manifest, validate and push
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r8-performance-copyability-design"
          git rm .github/workflows/r8-design-finalizer.yml
          python governance/regenerate_manifest.py --write
          python -m unittest discover -s tests -v
          python governance/validate_r8_design.py
          python governance/validate_repository.py
          test ! -e .github/workflows/r8-design-finalizer.yml
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: finalize exact inert R8 design tree'
          git push origin HEAD:research/r8-performance-copyability-design
