name: Hyperliquid Archive Hourly Body Schema Pilot R4
run-name: R6A successor legacy user-key lexical confirmation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-legacy-user-key-lexical-r6a-successor
  cancel-in-progress: false

env:
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  EXPECTED_AWS_ACCOUNT_ID: '630956766927'
  R6A_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-body-schema-r4
  PREREGISTRATION_COMMIT: 870fdf3e10a761d6c4589d43def8e436f3a129b5
  APPROVAL_MERGE_COMMIT: 06c0086f80cdbc3d058bdeea64b618da276e95ec
  APPROVAL_ID: APPROVE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_001
  APPROVAL_TEXT_SHA256: b24c67f527a320e533408fd821d10b5e2ea01d020c837e87ae5e5bbd386c94ed
  EXPECTED_IMPLEMENTATION_COMMIT: 806a054129de1f7d2480373be739ba7eea13258d
  PREDECESSOR_CONSUMPTION_PATH: research/archive_inventory/r6a/R6A_EXECUTION_RELEASE_001_CONSUMPTION.json
  EXECUTION_RELEASE_PATH: research/archive_inventory/r6a/R6A_EXECUTION_RELEASE_002_CANONICALIZATION.json
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  legacy-user-key-lexical-r6a-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out canonical successor dispatch SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DISPATCH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical manual main successor dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          observed_head="$(git rev-parse HEAD)"
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error title=R6A successor identity gate 41::Expected workflow_dispatch"
            exit 41
          fi
          if [[ "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "::error title=R6A successor identity gate 42::Expected refs/heads/main"
            exit 42
          fi
          if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=R6A successor identity gate 43::github.sha is not exact 40-hex"
            exit 43
          fi
          if [[ "${observed_head}" != "${DISPATCH_SHA}" ]]; then
            echo "::error title=R6A successor identity gate 44::Checked-out HEAD differs from github.sha"
            exit 44
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Prove successor release before AWS OIDC
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep -F 'Python 3.12.13'
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_r6a_preregistration.py
          python governance/validate_r6a_approval.py
          python governance/validate_r6a_implementation.py
          python governance/validate_r6a_successor_release.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.')
          base = root / 'research/archive_inventory/r6a'
          approval_text = base / 'approvals/APPROVE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_001.txt'
          approval = json.loads((base / 'approvals/APPROVE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_001.json').read_text(encoding='utf-8'))
          impl = json.loads((base / 'R6A_IMPLEMENTATION_CONTRACT.json').read_text(encoding='utf-8'))
          predecessor = json.loads((root / os.environ['PREDECESSOR_CONSUMPTION_PATH']).read_text(encoding='utf-8'))
          release = json.loads((root / os.environ['EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))

          assert hashlib.sha256(approval_text.read_bytes()).hexdigest() == os.environ['APPROVAL_TEXT_SHA256']
          assert approval['approval_id'] == os.environ['APPROVAL_ID']
          assert approval['reviewed_commit'] == os.environ['PREREGISTRATION_COMMIT']
          assert approval['exact_approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert approval['maximum_one_time_budget_eur'] == 0.10
          assert approval['maximum_monthly_budget_eur'] == 0
          assert approval['maximum_get_object_requests'] == 1
          assert approval['maximum_requests_per_object'] == 1
          assert approval['maximum_retries_per_request'] == 0
          assert all(value is False for value in approval['retention_authorizations'].values())
          assert all(value is False for value in approval['downstream_authorizations'].values())
          assert all(value is False for value in approval['trading_authorizations'].values())

          assert impl['approval_merge_commit'] == os.environ['APPROVAL_MERGE_COMMIT']
          assert impl['approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert impl['reused_dedicated_role_arn'] == os.environ['R6A_ROLE_ARN']
          assert impl['aws_role_mutation_required'] is False
          assert impl['aws_role_mutation_authorized'] is False

          assert predecessor['release_id'] == 'RELEASE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_001'
          assert predecessor['workflow_run_id'] == 31327463448
          assert predecessor['dispatch_consumed_release'] is True
          assert predecessor['pre_oidc_gate_failed'] is True
          assert predecessor['aws_oidc_role_assumption_attempted'] is False
          assert predecessor['collector_executed'] is False
          assert predecessor['s3_requests_executed'] == 0
          assert predecessor['get_object_requests_executed'] == 0
          assert predecessor['network_budget_consumed'] is False
          assert predecessor['remaining_approved_get_object_budget'] == 1
          assert predecessor['rerun_authorized'] is False

          assert release['release_id'] == 'RELEASE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_002'
          assert release['status'] == 'RELEASED_FOR_EXACTLY_ONE_CANONICAL_R6A_SUCCESSOR_RUN'
          assert release['predecessor_release_id'] == predecessor['release_id']
          assert release['predecessor_workflow_run_id'] == predecessor['workflow_run_id']
          assert release['predecessor_s3_requests_executed'] == 0
          assert release['maximum_aggregate_get_object_requests_across_r6a_chain'] == 1
          assert release['remaining_get_object_request_budget'] == 1
          assert release['canonical_implementation_commit'] == os.environ['EXPECTED_IMPLEMENTATION_COMMIT']
          assert release['preregistration_commit'] == os.environ['PREREGISTRATION_COMMIT']
          assert release['approval_merge_commit'] == os.environ['APPROVAL_MERGE_COMMIT']
          assert release['approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert release['github_event_required'] == 'workflow_dispatch'
          assert release['canonical_dispatch_ref_required'] == 'refs/heads/main'
          assert release['canonical_dispatch_sha_source'] == 'github.sha'
          assert release['dedicated_role_arn'] == os.environ['R6A_ROLE_ARN']
          assert release['aws_role_mutation_performed'] is False
          assert release['target_bucket'] == 'hl-mainnet-node-data'
          assert release['signing_region'] == 'ap-northeast-1'
          assert release['object_key'] == 'node_fills/hourly/20250727/8.lz4'
          assert release['object_size_bytes'] == 12726384
          assert release['object_etag'] == '"b21cdc16a4ec69d9c5b72c0c27ff148d-2"'
          assert release['expected_compressed_sha256'] == 'f12d33da9733dbb71f02f9910fc187b9dd4b8f9dae1102b7dfe7690094542622'
          assert release['expected_decompressed_byte_count'] == 62169139
          assert release['maximum_one_time_budget_eur'] == 0.10
          assert release['maximum_monthly_budget_eur'] == 0
          assert release['maximum_get_object_requests_this_successor'] == 1
          assert release['maximum_requests_per_object'] == 1
          assert release['maximum_total_compressed_bytes'] == 12726384
          assert release['maximum_total_decompressed_bytes'] == 134217728
          assert release['maximum_runtime_seconds'] == 120
          assert release['maximum_retries_per_request'] == 0
          assert release['requester_pays_authorized'] is True
          assert release['get_object_authorized'] is True
          assert release['decompression_authorized'] is True
          assert release['lexical_classification_authorized'] is True
          assert release['single_workflow_dispatch_authorized'] is True
          assert release['rerun_authorized'] is False
          assert release['release_consumed'] is False
          for key in (
              'head_object_authorized', 'range_get_authorized', 'list_objects_v2_authorized',
              'list_object_versions_authorized', 'list_all_my_buckets_authorized',
              'http_redirect_following_authorized', 'raw_compressed_object_retention_authorized',
              'raw_decompressed_payload_retention_authorized', 'record_payload_retention_authorized',
              'payload_values_in_evidence_authorized', 'string_values_in_evidence_authorized',
              'numeric_values_in_evidence_authorized', 'leading_string_retention_authorized',
              'wallet_address_retention_authorized', 'leading_string_hash_retention_authorized',
              'distinct_address_set_retention_authorized', 'wallet_reconstruction_authorized',
              'entity_clustering_authorized', 'copyability_analysis_authorized',
              'pnl_or_alpha_analysis_authorized', 'market_data_ingestion_authorized',
              'scope_expansion_authorized', 'new_human_budget_authority_created',
          ):
              assert release[key] is False, key
          assert all(value is False for value in release['trading_authorizations'].values())
          assert release['s3_requests_executed'] == 0
          assert release['compressed_bytes_downloaded'] == 0
          assert release['decompressed_bytes_processed'] == 0
          assert release['empirical_result'] is None
          PY

      - name: Enforce successor single-use release before AWS OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${CURRENT_RUN_ATTEMPT}" != '1' ]]; then
            echo "::error title=R6A successor single-use gate::Run attempt must be 1; re-runs are forbidden"
            exit 51
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          release = json.loads(Path(os.environ['EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))
          start = datetime.fromisoformat(release['single_use_window_start_utc'].replace('Z', '+00:00')).astimezone(timezone.utc)
          repo = os.environ['CURRENT_REPOSITORY']
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'hyperliquid-archive-legacy-user-key-lexical-r6a-successor.yml/runs'
              '?event=workflow_dispatch&branch=main&per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hl-r6a-successor-single-use-check',
              },
              method='GET',
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              runs = json.load(response).get('workflow_runs')
          assert isinstance(runs, list) and len(runs) < 100
          eligible = [
              row for row in runs
              if datetime.fromisoformat(row['created_at'].replace('Z', '+00:00')).astimezone(timezone.utc) >= start
          ]
          assert len(eligible) == 1, 'R6A successor release is not single-use within its release window'
          assert int(eligible[0]['id']) == current_run_id, 'a previous successor dispatch already consumed release-002'
          assert eligible[0]['event'] == 'workflow_dispatch'
          assert eligible[0]['head_branch'] == 'main'
          PY

      - name: Freeze pending successor context before AWS authentication
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          release = json.loads(Path(os.environ['EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))
          context = {
              'schema_version': '1.0',
              'pilot_id': 'HL-ARCHIVE-LEGACY-USER-KEY-LEXICAL-R6A-001',
              'release_id': release['release_id'],
              'terminal_status': 'PENDING_AWS_OIDC',
              'event_name': os.environ['EVENT_NAME'],
              'dispatch_ref': os.environ['DISPATCH_REF'],
              'dispatch_sha': os.environ['DISPATCH_SHA'],
              'checked_out_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
              'predecessor_run_id': 31327463448,
              'predecessor_s3_requests_executed': 0,
              'approval_id': os.environ['APPROVAL_ID'],
              'approval_text_sha256': os.environ['APPROVAL_TEXT_SHA256'],
              'implementation_commit': release['canonical_implementation_commit'],
              'expected_account_id': os.environ['EXPECTED_AWS_ACCOUNT_ID'],
              'expected_role_arn': os.environ['R6A_ROLE_ARN'],
              'configure_aws_outcome': None,
              'target_bucket': 'hl-mainnet-node-data',
              'signing_region': 'ap-northeast-1',
              'object_key': 'node_fills/hourly/20250727/8.lz4',
              'maximum_get_object_requests': 1,
              'maximum_total_compressed_bytes': 12726384,
              'maximum_total_decompressed_bytes': 134217728,
              'maximum_runtime_seconds': 120,
              'maximum_retries_per_request': 0,
              'leading_string_retention_authorized': False,
              'wallet_address_retention_authorized': False,
              'payload_retention_authorized': False,
              'wallet_reconstruction_authorized': False,
              'entity_clustering_authorized': False,
              'copyability_analysis_authorized': False,
              'market_data_ingestion_authorized': False,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'r6a-successor-context.json').write_text(
              json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Assume unchanged dedicated AWS role with exact-one-object successor session
        id: configure
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-body-schema-r4
          aws-region: ap-northeast-1
          role-duration-seconds: 900
          role-session-name: HLArchiveUserKeyR6ASuccessor
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"R6ASuccessorExactLegacyObjectOnly","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::hl-mainnet-node-data/node_fills/hourly/20250727/8.lz4"}]}

      - name: Execute bounded R6A successor lexical collector
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set +e
          python research/archive_inventory/r6a/collector.py --output "${RUNNER_TEMP}/r6a-successor-result.json"
          rc=$?
          set -e
          printf '%s\n' "${rc}" > "${RUNNER_TEMP}/r6a-successor.rc"

      - name: Record successor pre-collector AWS failure without network fallback
        if: steps.configure.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '81' > "${RUNNER_TEMP}/r6a-successor.rc"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = {
              'schema_version': '1.0',
              'pilot_id': 'HL-ARCHIVE-LEGACY-USER-KEY-LEXICAL-R6A-001',
              'release_id': 'RELEASE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_002',
              'terminal_status': 'R6A_TRANSPORT_OR_INTEGRITY_FAIL',
              'technical_result': 'R6A_TRANSPORT_OR_INTEGRITY_FAIL',
              'research_conclusion': 'R6A_TRANSPORT_OR_INTEGRITY_FAIL',
              'failure_class': 'AWS_OIDC_ROLE_ASSUMPTION_FAILED',
              'request_attempt_count': 0,
              's3_http_request_count': 0,
              'successful_request_count': 0,
              'failed_request_count': 0,
              'compressed_bytes': 0,
              'decompressed_bytes': 0,
              'lexical_aggregates': None,
              'raw_compressed_object_persisted': False,
              'raw_decompressed_payload_retained': False,
              'record_payload_retained': False,
              'payload_values_retained': False,
              'string_values_retained': False,
              'numeric_values_retained': False,
              'leading_string_values_retained': False,
              'wallet_addresses_retained': False,
              'leading_string_hashes_retained': False,
              'distinct_address_set_retained': False,
              'wallet_reconstruction_performed': False,
              'entity_clustering_performed': False,
              'copyability_analysis_performed': False,
              'pnl_or_alpha_analysis_performed': False,
              'market_data_ingested': False,
          }
          Path(os.environ['RUNNER_TEMP'], 'r6a-successor-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Finalize minimized successor context and evidence ledger
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          context_path = temp / 'r6a-successor-context.json'
          result_path = temp / 'r6a-successor-result.json'
          rc_path = temp / 'r6a-successor.rc'
          if not context_path.exists():
              context_path.write_text(json.dumps({
                  'schema_version': '1.0',
                  'pilot_id': 'HL-ARCHIVE-LEGACY-USER-KEY-LEXICAL-R6A-001',
                  'release_id': 'RELEASE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_002',
                  'terminal_status': 'PRE_OIDC_GATE_FAILED',
                  'event_name': os.environ['EVENT_NAME'],
                  'dispatch_ref': os.environ['DISPATCH_REF'],
                  'dispatch_sha': os.environ['DISPATCH_SHA'],
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          context = json.loads(context_path.read_text(encoding='utf-8'))
          context['configure_aws_outcome'] = os.environ.get('CONFIGURE_OUTCOME')
          context_path.write_text(json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          if not result_path.exists():
              result_path.write_text(json.dumps({
                  'schema_version': '1.0',
                  'pilot_id': 'HL-ARCHIVE-LEGACY-USER-KEY-LEXICAL-R6A-001',
                  'release_id': 'RELEASE_HL_ARCHIVE_LEGACY_USER_KEY_LEXICAL_R6A_002',
                  'terminal_status': 'R6A_TRANSPORT_OR_INTEGRITY_FAIL',
                  'technical_result': 'R6A_TRANSPORT_OR_INTEGRITY_FAIL',
                  'research_conclusion': 'R6A_TRANSPORT_OR_INTEGRITY_FAIL',
                  'failure_class': 'PRE_OIDC_OR_COLLECTOR_EVIDENCE_MISSING',
                  'request_attempt_count': 0,
                  's3_http_request_count': 0,
                  'successful_request_count': 0,
                  'failed_request_count': 0,
                  'compressed_bytes': 0,
                  'decompressed_bytes': 0,
                  'lexical_aggregates': None,
                  'leading_string_values_retained': False,
                  'wallet_addresses_retained': False,
                  'payload_values_retained': False,
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          if not rc_path.exists():
              rc_path.write_text('82\n', encoding='utf-8')
          lines = []
          for path in (context_path, result_path, rc_path):
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (temp / 'R6A_SUCCESSOR_FILES.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload minimized R6A successor evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r6a-successor-legacy-user-key-lexical-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r6a-successor-context.json
            ${{ runner.temp }}/r6a-successor-result.json
            ${{ runner.temp }}/r6a-successor.rc
            ${{ runner.temp }}/R6A_SUCCESSOR_FILES.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exact R6A successor terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          result = json.loads((temp / 'r6a-successor-result.json').read_text(encoding='utf-8'))
          rc = int((temp / 'r6a-successor.rc').read_text(encoding='utf-8').strip())
          allowed = {
              'ALL_LEADING_STRINGS_MATCH_HYPERLIQUID_ADDRESS_SHAPE',
              'SOME_LEADING_STRINGS_DO_NOT_MATCH_HYPERLIQUID_ADDRESS_SHAPE',
              'R6A_LEXICAL_SHAPE_UNRESOLVED',
          }
          for key in (
              'raw_compressed_object_persisted', 'raw_decompressed_payload_retained',
              'record_payload_retained', 'payload_values_retained', 'string_values_retained',
              'numeric_values_retained', 'leading_string_values_retained', 'wallet_addresses_retained',
              'leading_string_hashes_retained', 'distinct_address_set_retained',
              'wallet_reconstruction_performed', 'entity_clustering_performed',
              'copyability_analysis_performed', 'pnl_or_alpha_analysis_performed', 'market_data_ingested',
          ):
              if key in result:
                  assert result[key] is False, key
          if rc != 0 or result.get('terminal_status') == 'R6A_TRANSPORT_OR_INTEGRITY_FAIL':
              raise SystemExit(1)
          assert result.get('terminal_status') == 'R6A_LEXICAL_CONFIRMATION_COMPLETE'
          assert result.get('research_conclusion') in allowed
          assert result.get('request_attempt_count') == 1
          assert result.get('s3_http_request_count') == 1
          assert result.get('successful_request_count') == 1
          assert result.get('failed_request_count') == 0
          assert result.get('retries_used') == 0
          assert result.get('http_redirects_followed') is False
          assert result.get('compressed_bytes') == 12726384
          assert result.get('decompressed_bytes') == 62169139
          evidence = result.get('lexical_aggregates')
          if result.get('research_conclusion') != 'R6A_LEXICAL_SHAPE_UNRESOLVED':
              assert isinstance(evidence, dict)
              assert evidence['nonempty_record_count'] == 162815
              assert evidence['pair_string_object_record_count'] == 162815
              assert evidence['leading_string_count'] == 162815
          PY
