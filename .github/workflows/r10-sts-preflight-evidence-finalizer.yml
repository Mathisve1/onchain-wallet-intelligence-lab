name: R10 STS Preflight Evidence One-Shot Finalizer

on:
  push:
    branches: [research/r10-sts-preflight-evidence]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10-sts-preflight-evidence
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Remove transient workflow and reconcile immutable snapshots with consumption overlay
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r10-sts-preflight-evidence-finalizer.yml
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "governance/validate_r10_implementation.py": [
                  (
                      'assert sorted(path.name for path in PREFLIGHT_RUNTIME_DIR.iterdir() if path.is_file()) == ["R10_STS_PREFLIGHT_RELEASE.json"]',
                      'assert sorted(path.name for path in PREFLIGHT_RUNTIME_DIR.iterdir() if path.is_file()) == ["R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"]',
                  ),
              ],
              "governance/validate_r10_role_preflight.py": [
                  (
                      'assert sorted(path.name for path in RUNTIME.iterdir() if path.is_file()) == ["R10_STS_PREFLIGHT_RELEASE.json"]',
                      'assert sorted(path.name for path in RUNTIME.iterdir() if path.is_file()) == ["R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"]',
                  ),
              ],
              "governance/validate_r10_sts_preflight_release.py": [
                  (
                      'assert runtime_files == ["R10_STS_PREFLIGHT_RELEASE.json"]',
                      'assert runtime_files == ["R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"]',
                  ),
              ],
              "governance/validate_r10_sts_preflight_release_candidate.py": [
                  (
                      'assert sorted(path.name for path in RUNTIME_DIR.iterdir() if path.is_file()) == ["R10_STS_PREFLIGHT_RELEASE.json"]',
                      'assert sorted(path.name for path in RUNTIME_DIR.iterdir() if path.is_file()) == ["R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"]',
                  ),
              ],
              "tests/test_archive_inventory_r10_role_attestation.py": [
                  (
                      'self.assertEqual(sorted(path.name for path in RUNTIME.iterdir() if path.is_file()), ["R10_STS_PREFLIGHT_RELEASE.json"])',
                      'self.assertEqual(sorted(path.name for path in RUNTIME.iterdir() if path.is_file()), ["R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"])',
                  ),
              ],
              "tests/test_archive_inventory_r10_sts_preflight_release_candidate.py": [
                  (
                      'self.assertEqual(sorted(path.name for path in RUNTIME.iterdir() if path.is_file()), ["R10_STS_PREFLIGHT_RELEASE.json"])',
                      'self.assertEqual(sorted(path.name for path in RUNTIME.iterdir() if path.is_file()), ["R10_STS_PREFLIGHT_RELEASE.json", "R10_STS_PREFLIGHT_RELEASE_CONSUMPTION.json"])',
                  ),
              ],
          }

          for raw_path, pairs in replacements.items():
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one replacement in {raw_path}, found {count}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate canonical repository manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate exact R10 STS preflight evidence
        run: python governance/validate_r10_role_preflight_evidence.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py
      - name: Commit finalized evidence and self-deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: freeze exact R10 STS preflight evidence"
          git push origin HEAD:research/r10-sts-preflight-evidence
