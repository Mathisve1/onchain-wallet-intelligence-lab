name: Hyperliquid Archive Hourly Body Schema Pilot R4

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-hourly-body-schema-pilot-r4
  cancel-in-progress: false

env:
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  EXPECTED_AWS_ACCOUNT_ID: '630956766927'
  R4_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-body-schema-r4
  PREREGISTRATION_COMMIT: 25a1f621d15cb708a485893025f03b991628aae1
  APPROVAL_MERGE_COMMIT: 0191350683c6c943d3538c8c51db176cd1d58211
  APPROVAL_ID: APPROVE_HL_ARCHIVE_HOURLY_BODY_SCHEMA_PILOT_R4_001
  APPROVAL_TEXT_SHA256: e52399feb7a0d36959089f556dd9f55062eb91d52feaa4c5af680d3c4e557264
  EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE
  EXECUTION_RELEASE_PATH: research/archive_inventory/r4/R4_EXECUTION_RELEASE_CANONICALIZATION.json
  RELEASE_CANDIDATE_PATH: research/archive_inventory/r4/R4_EXECUTION_RELEASE.json
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  body-schema-pilot-r4:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out canonical dispatch SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DISPATCH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical manual main dispatch and checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          observed_head="$(git rev-parse HEAD)"
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error title=R4 identity gate 41::Expected workflow_dispatch"
            exit 41
          fi
          if [[ "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "::error title=R4 identity gate 42::Expected refs/heads/main"
            exit 42
          fi
          if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=R4 identity gate 43::github.sha is not exact 40-hex"
            exit 43
          fi
          if [[ "${observed_head}" != "${DISPATCH_SHA}" ]]; then
            echo "::error title=R4 identity gate 44::Checked-out HEAD differs from github.sha"
            exit 44
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Prove canonical R4 implementation and release before AWS OIDC
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep -F 'Python 3.12.13'
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_r4_implementation.py
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path('.')
          base = root / 'research/archive_inventory/r4'
          approval_text = base / 'approvals/APPROVE_HL_ARCHIVE_HOURLY_BODY_SCHEMA_PILOT_R4_001.txt'
          approval = json.loads((base / 'approvals/APPROVE_HL_ARCHIVE_HOURLY_BODY_SCHEMA_PILOT_R4_001.json').read_text(encoding='utf-8'))
          impl = json.loads((base / 'R4_IMPLEMENTATION_CONTRACT.json').read_text(encoding='utf-8'))
          expected = os.environ['EXPECTED_IMPLEMENTATION_COMMIT']
          release_path = root / os.environ['EXECUTION_RELEASE_PATH']

          assert hashlib.sha256(approval_text.read_bytes()).hexdigest() == os.environ['APPROVAL_TEXT_SHA256']
          assert approval['approval_id'] == os.environ['APPROVAL_ID']
          assert approval['reviewed_commit'] == os.environ['PREREGISTRATION_COMMIT']
          assert approval['exact_approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert approval['maximum_one_time_budget_eur'] == 0.10
          assert approval['maximum_monthly_budget_eur'] == 0
          assert approval['maximum_get_object_requests'] == 2
          assert approval['maximum_requests_per_object'] == 1
          assert approval['maximum_total_compressed_bytes'] == 14243987
          assert approval['maximum_total_decompressed_bytes'] == 536870912
          assert approval['maximum_decompressed_bytes_per_object'] == 268435456
          assert approval['maximum_runtime_seconds'] == 180
          assert approval['maximum_retries_per_request'] == 0
          assert approval['maximum_record_bytes'] == 16777216
          assert approval['maximum_records_parsed_per_object'] == 5000000
          assert approval['maximum_schema_nesting_depth'] == 16
          assert approval['maximum_unique_field_paths'] == 4096
          assert approval['target_bucket'] == 'hl-mainnet-node-data'
          assert approval['signing_region'] == 'ap-northeast-1'
          assert approval['requester_pays_scope_approved'] is True
          assert approval['get_object_scope_approved'] is True
          assert approval['decompression_scope_approved'] is True

          assert impl['approval_merge_commit'] == os.environ['APPROVAL_MERGE_COMMIT']
          assert impl['approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert impl['target_bucket'] == 'hl-mainnet-node-data'
          assert impl['signing_region'] == 'ap-northeast-1'
          assert impl['regional_virtual_hosted_endpoint'] == 'hl-mainnet-node-data.s3.ap-northeast-1.amazonaws.com'
          assert impl['expected_dedicated_r4_role_arn'] == os.environ['R4_ROLE_ARN']
          assert impl['session_s3_policy'] == 'ALLOW_GETOBJECT_EXACT_TWO_BOUNDARY_OBJECTS_ONLY'
          assert impl['execution_release_required'] is True
          assert impl['execution_release_present'] is False
          assert impl['execution_authorized'] is False
          assert impl['current_metadata_role_usable_for_r4'] is False
          assert impl['dedicated_r4_role_required'] is True

          if expected == 'PENDING_CANONICAL_IMPLEMENTATION_MERGE':
              print('::error title=R4 release gate 45::Implementation is not yet canonical; no AWS authentication is allowed')
              sys.exit(45)
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          assert release_path.is_file(), 'R4 execution release canonicalization is absent'
          release = json.loads(release_path.read_text(encoding='utf-8'))
          assert release['release_id'] == 'RELEASE_HL_ARCHIVE_HOURLY_BODY_SCHEMA_PILOT_R4_001'
          assert release['status'] == 'RELEASED_FOR_EXACTLY_ONE_CANONICAL_R4_RUN'
          assert release['implementation_commit'] == expected
          assert release['preregistration_commit'] == os.environ['PREREGISTRATION_COMMIT']
          assert release['approval_merge_commit'] == os.environ['APPROVAL_MERGE_COMMIT']
          assert release['approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert release['github_event_required'] == 'workflow_dispatch'
          assert release['canonical_dispatch_ref_required'] == 'refs/heads/main'
          assert release['canonical_dispatch_sha_source'] == 'github.sha'
          assert release['dedicated_r4_role_arn'] == os.environ['R4_ROLE_ARN']
          assert release['dedicated_r4_role_operator_attested'] is True
          assert release['target_bucket'] == 'hl-mainnet-node-data'
          assert release['signing_region'] == 'ap-northeast-1'
          assert release['object_keys'] == [
              'node_fills/hourly/20250727/8.lz4',
              'node_fills_by_block/hourly/20250727/8.lz4',
          ]
          assert release['maximum_one_time_budget_eur'] == 0.10
          assert release['maximum_monthly_budget_eur'] == 0
          assert release['maximum_get_object_requests'] == 2
          assert release['maximum_requests_per_object'] == 1
          assert release['maximum_total_compressed_bytes'] == 14243987
          assert release['maximum_total_decompressed_bytes'] == 536870912
          assert release['maximum_decompressed_bytes_per_object'] == 268435456
          assert release['maximum_runtime_seconds'] == 180
          assert release['maximum_retries_per_request'] == 0
          assert release['requester_pays_authorized'] is True
          assert release['get_object_authorized'] is True
          assert release['decompression_authorized'] is True
          assert release['single_workflow_dispatch_authorized'] is True
          assert release['rerun_authorized'] is False
          for key in (
              'head_object_authorized', 'range_get_authorized', 'list_objects_v2_authorized',
              'list_object_versions_authorized', 'list_all_my_buckets_authorized',
              'raw_compressed_object_retention_authorized', 'raw_decompressed_payload_retention_authorized',
              'record_payload_retention_authorized', 'wallet_address_retention_from_body_authorized',
              'payload_values_in_schema_evidence_authorized', 'semantic_equivalence_inference_authorized',
              'wallet_reconstruction_authorized', 'entity_clustering_authorized',
              'copyability_analysis_authorized', 'pnl_or_alpha_analysis_authorized',
              'market_data_ingestion_authorized',
          ):
              assert release[key] is False
          assert all(value is False for value in release['trading_authorizations'].values())
          assert release['s3_requests_executed'] == 0
          assert release['compressed_bytes_downloaded'] == 0
          assert release['decompressed_bytes_processed'] == 0
          assert release['empirical_result'] is None
          PY

      - name: Enforce R4 single-use release before AWS OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${CURRENT_RUN_ATTEMPT}" != '1' ]]; then
            echo "::error title=R4 single-use gate::Run attempt must be 1; re-runs are forbidden"
            exit 51
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          release = json.loads(Path(os.environ['EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))
          start = datetime.fromisoformat(release['single_use_window_start_utc'].replace('Z', '+00:00')).astimezone(timezone.utc)
          repo = os.environ['CURRENT_REPOSITORY']
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'hyperliquid-archive-hourly-body-schema-pilot-r4.yml/runs'
              '?event=workflow_dispatch&branch=main&per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hl-body-schema-r4-single-use-check',
              },
              method='GET',
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              runs = json.load(response).get('workflow_runs')
          assert isinstance(runs, list) and len(runs) < 100
          eligible = [
              row for row in runs
              if datetime.fromisoformat(row['created_at'].replace('Z', '+00:00')).astimezone(timezone.utc) >= start
          ]
          assert len(eligible) == 1, 'R4 release is not single-use within its release window'
          assert int(eligible[0]['id']) == current_run_id, 'a previous dispatch already consumed the R4 release'
          assert eligible[0]['event'] == 'workflow_dispatch'
          assert eligible[0]['head_branch'] == 'main'
          PY

      - name: Freeze pending R4 run context before AWS authentication
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          release = json.loads(Path(os.environ['EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))
          context = {
              'schema_version': '1.0',
              'pilot_id': 'HL-ARCHIVE-HOURLY-BODY-SCHEMA-PILOT-R4-001',
              'terminal_status': 'PENDING_AWS_OIDC',
              'event_name': os.environ['EVENT_NAME'],
              'dispatch_ref': os.environ['DISPATCH_REF'],
              'dispatch_sha': os.environ['DISPATCH_SHA'],
              'checked_out_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
              'approval_id': os.environ['APPROVAL_ID'],
              'approval_text_sha256': os.environ['APPROVAL_TEXT_SHA256'],
              'execution_release_id': release['release_id'],
              'implementation_commit': release['implementation_commit'],
              'expected_account_id': os.environ['EXPECTED_AWS_ACCOUNT_ID'],
              'expected_role_arn': os.environ['R4_ROLE_ARN'],
              'configure_aws_outcome': None,
              'target_bucket': 'hl-mainnet-node-data',
              'signing_region': 'ap-northeast-1',
              'object_keys': release['object_keys'],
              'maximum_get_object_requests': 2,
              'maximum_total_compressed_bytes': 14243987,
              'maximum_total_decompressed_bytes': 536870912,
              'maximum_runtime_seconds': 180,
              'maximum_retries_per_request': 0,
              'requester_pays_authorized_for_r4': True,
              'get_object_authorized_for_r4': True,
              'decompression_authorized_for_r4': True,
              'payload_retention_authorized': False,
              'market_data_ingestion_authorized': False,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'r4-body-context.json').write_text(
              json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Assume dedicated R4 AWS role with exact-two-object session permissions
        id: configure
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-body-schema-r4
          aws-region: ap-northeast-1
          role-duration-seconds: 900
          role-session-name: HLArchiveBodySchemaR4
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"R4ExactTwoBoundaryObjects","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::hl-mainnet-node-data/node_fills/hourly/20250727/8.lz4","arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250727/8.lz4"]}]}

      - name: Execute bounded R4 body schema collector
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/r4-body-result.json"
          set +e
          python research/archive_inventory/r4/collector.py "${result}" >/dev/null
          rc=$?
          set -e
          printf '%s\n' "${rc}" >"${RUNNER_TEMP}/r4-body.rc"

      - name: Record non-execution when AWS role assumption fails
        if: steps.configure.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'NOT_RUN' >"${RUNNER_TEMP}/r4-body.rc"

      - name: Finalize minimized R4 evidence
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          context_path = root / 'r4-body-context.json'
          result_path = root / 'r4-body-result.json'
          if context_path.is_file():
              context = json.loads(context_path.read_text(encoding='utf-8'))
              context['configure_aws_outcome'] = os.environ.get('CONFIGURE_OUTCOME')
              context_path.write_text(json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          else:
              context = {
                  'schema_version': '1.0',
                  'pilot_id': 'HL-ARCHIVE-HOURLY-BODY-SCHEMA-PILOT-R4-001',
                  'terminal_status': 'R4_PRE_OIDC_GATE_FAILED',
                  'event_name': os.environ.get('EVENT_NAME'),
                  'dispatch_ref': os.environ.get('DISPATCH_REF'),
                  'dispatch_sha': os.environ.get('DISPATCH_SHA'),
                  'checked_out_commit': None,
                  'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
                  'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
                  'approval_id': os.environ.get('APPROVAL_ID'),
                  'approval_text_sha256': os.environ.get('APPROVAL_TEXT_SHA256'),
                  'execution_release_id': None,
                  'implementation_commit': os.environ.get('EXPECTED_IMPLEMENTATION_COMMIT'),
                  'expected_account_id': os.environ.get('EXPECTED_AWS_ACCOUNT_ID'),
                  'expected_role_arn': os.environ.get('R4_ROLE_ARN'),
                  'configure_aws_outcome': os.environ.get('CONFIGURE_OUTCOME'),
                  'target_bucket': 'hl-mainnet-node-data',
                  'signing_region': 'ap-northeast-1',
                  'object_keys': [
                      'node_fills/hourly/20250727/8.lz4',
                      'node_fills_by_block/hourly/20250727/8.lz4',
                  ],
                  'maximum_get_object_requests': 2,
                  'maximum_total_compressed_bytes': 14243987,
                  'maximum_total_decompressed_bytes': 536870912,
                  'maximum_runtime_seconds': 180,
                  'maximum_retries_per_request': 0,
                  'requester_pays_authorized_for_r4': False,
                  'get_object_authorized_for_r4': False,
                  'decompression_authorized_for_r4': False,
                  'payload_retention_authorized': False,
                  'market_data_ingestion_authorized': False,
              }
              context_path.write_text(json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          if not result_path.is_file():
              result = {
                  'schema_version': '1.0',
                  'pilot_id': 'HL-ARCHIVE-HOURLY-BODY-SCHEMA-PILOT-R4-001',
                  'terminal_status': 'R4_NOT_EXECUTED',
                  'technical_result': 'PRE_OIDC_OR_AWS_AUTHENTICATION_FAILURE',
                  'schema_comparison_class': 'SCHEMA_UNRESOLVED',
                  'request_attempt_count': 0,
                  's3_http_request_count': 0,
                  'successful_request_count': 0,
                  'failed_request_count': 0,
                  'total_compressed_bytes': 0,
                  'total_decompressed_bytes': 0,
                  'runtime_seconds': 0.0,
                  'retries_used': 0,
                  'http_redirects_followed': False,
                  'requester_pays_requested': False,
                  'if_match_etag_required': True,
                  'exact_content_length_required': True,
                  'raw_compressed_object_persisted': False,
                  'raw_decompressed_payload_retained': False,
                  'record_payload_retained': False,
                  'wallet_addresses_retained_from_body': False,
                  'payload_values_retained': False,
                  'semantic_equivalence_inferred': False,
                  'wallet_reconstruction_performed': False,
                  'entity_clustering_performed': False,
                  'copyability_analysis_performed': False,
                  'pnl_or_alpha_analysis_performed': False,
                  'market_data_ingested': False,
                  'observations': [],
                  'empirical_result': None,
              }
              result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          rc_path = root / 'r4-body.rc'
          if not rc_path.exists():
              rc_path.write_text('NOT_RUN\n', encoding='utf-8')
          PY
          cd "${RUNNER_TEMP}"
          sha256sum r4-body-context.json r4-body-result.json r4-body.rc >R4_BODY_FILES.sha256

      - name: Upload minimized R4 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperliquid-archive-body-schema-r4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r4-body-context.json
            ${{ runner.temp }}/r4-body-result.json
            ${{ runner.temp }}/r4-body.rc
            ${{ runner.temp }}/R4_BODY_FILES.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false

      - name: Enforce exact completed R4 research result
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          set -euo pipefail
          test "${CONFIGURE_OUTCOME}" = 'success'
          test "$(cat "${RUNNER_TEMP}/r4-body.rc")" = '0'
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'r4-body-result.json').read_text(encoding='utf-8'))
          assert result['terminal_status'] == 'R4_BODY_SCHEMA_PILOT_COMPLETE'
          assert result['technical_result'] in {
              'TWO_OBJECT_SCHEMA_COMPARISON_RESOLVED',
              'TWO_OBJECT_SCHEMA_CENSORED',
              'TWO_OBJECT_BODY_FORMAT_UNRESOLVED',
          }
          assert result['schema_comparison_class'] in {
              'IDENTICAL_OBSERVED_SCHEMA',
              'LEGACY_SCHEMA_SUBSET_OF_MODERN',
              'MODERN_SCHEMA_SUBSET_OF_LEGACY',
              'OVERLAPPING_BUT_DIFFERENT_SCHEMA',
              'DISJOINT_OR_INCOMPATIBLE_SCHEMA',
              'SCHEMA_UNRESOLVED',
          }
          assert result['request_attempt_count'] == 2
          assert result['s3_http_request_count'] == 2
          assert result['successful_request_count'] == 2
          assert result['failed_request_count'] == 0
          assert result['total_compressed_bytes'] == 14243987
          assert result['total_decompressed_bytes'] <= 536870912
          assert result['runtime_seconds'] <= 180
          assert result['retries_used'] == 0
          assert result['http_redirects_followed'] is False
          assert result['requester_pays_requested'] is True
          assert result['if_match_etag_required'] is True
          assert result['exact_content_length_required'] is True
          assert result['raw_compressed_object_persisted'] is False
          assert result['raw_decompressed_payload_retained'] is False
          assert result['record_payload_retained'] is False
          assert result['wallet_addresses_retained_from_body'] is False
          assert result['payload_values_retained'] is False
          assert result['semantic_equivalence_inferred'] is False
          assert result['wallet_reconstruction_performed'] is False
          assert result['entity_clustering_performed'] is False
          assert result['copyability_analysis_performed'] is False
          assert result['pnl_or_alpha_analysis_performed'] is False
          assert result['market_data_ingested'] is False
          assert result['empirical_result'] is None
          assert len(result['observations']) == 2
          expected = [
              ('node_fills/hourly/20250727/8.lz4', 12726384, '"b21cdc16a4ec69d9c5b72c0c27ff148d-2"'),
              ('node_fills_by_block/hourly/20250727/8.lz4', 1517603, '"60d4c1277f76651b5f04666bbe8d7594"'),
          ]
          for row, (key, size, etag) in zip(result['observations'], expected):
              assert row['key'] == key
              assert row['status'] == 'OBJECT_PROCESSED'
              assert row['http_status'] == 200
              assert row['request_charged'] == 'requester'
              assert row['expected_etag'] == etag
              assert row['observed_etag'] == etag
              assert row['expected_content_length'] == size
              assert row['observed_content_length'] == size
              assert row['compressed_object_size_bytes'] == size
              assert re.fullmatch(r'[0-9a-f]{64}', row['compressed_object_sha256'])
              assert row['decompressed_byte_count'] <= 268435456
              assert row['record_count'] <= 5000000
