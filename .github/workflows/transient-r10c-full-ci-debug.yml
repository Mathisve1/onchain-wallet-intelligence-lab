name: Transient R10C Full CI Debug

on:
  push:
    branches:
      - research/r10c-implementation

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10c-implementation
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Run full tests with concise failure output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-tests.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '=== FAILURE MARKERS ==='
            grep -nE '^(FAIL|ERROR):|^FAILED|^Traceback|AssertionError|FileNotFoundError|REPOSITORY_MANIFEST_OUT_OF_DATE' /tmp/full-tests.log | tail -n 120 || true
            echo '=== LOG TAIL ==='
            tail -n 220 /tmp/full-tests.log
            exit "$rc"
          fi
          tail -n 30 /tmp/full-tests.log
          echo FULL_TEST_SUITE_PASS
