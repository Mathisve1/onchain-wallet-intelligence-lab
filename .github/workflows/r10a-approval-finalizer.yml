name: R10A Approval Finalizer

on:
  push:
    branches: [research/r10a-approval]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10a-approval
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Remove transient workflow
        run: git rm .github/workflows/r10a-approval-finalizer.yml
      - name: Regenerate manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate R10A approval
        run: python governance/validate_r10a_approval.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: python governance/validate_repository.py
      - name: Commit finalized snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: freeze exact R10A approval"
          git push origin HEAD:research/r10a-approval
