name: R11A V2 Preregistration Seal

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  seal:
    if: >-
      github.event.pull_request.number == 144 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11a-corrective-implementation-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact amendment head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Seal amendment bytes and repository manifest
        shell: bash
        run: |
          set -euo pipefail
          python governance/seal_r11a_v2_preregistration.py --write
          python governance/seal_r11a_v2_preregistration.py --check
          python governance/validate_r11a_v2_preregistration.py
          python governance/validate_r11a_v2_bindings.py
          python -m unittest \
            tests.test_archive_inventory_r11a_v2_preregistration \
            tests.test_archive_inventory_r11a_v2_bindings -v
          rm .github/workflows/r11a-v2-preregistration-seal.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          git add -A
          git diff --cached --check
      - name: Commit exact amendment seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'R11A V2 preregistration already sealed'
            exit 0
          fi
          git commit -m 'ci: seal R11A V2 preregistration and manifest'
          git push origin HEAD:research/r11a-corrective-implementation-v2
