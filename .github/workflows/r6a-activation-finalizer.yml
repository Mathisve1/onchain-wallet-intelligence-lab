name: R6A Activation Finalizer

on:
  push:
    branches:
      - research/r6a-lexical-activation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out activation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r6a-lexical-activation
          fetch-depth: 0
          persist-credentials: true

      - name: Repair, verify, self-delete and push exact activation tree
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r6a-lexical-activation"
          python - <<'PY'
          import json
          from pathlib import Path

          marker = 'CANONICAL_PR_66_BYTE_EXACT_BINDING'
          activation_path = Path('research/archive_inventory/r6a/R6A_EXECUTION_RELEASE_CANONICALIZATION.json')
          assert activation_path.is_file()
          activation = json.loads(activation_path.read_text(encoding='utf-8'))
          activation['implementation_commit'] = marker
          activation['single_use_window_start_utc'] = '2026-08-09T16:36:00Z'
          activation_path.write_text(json.dumps(activation, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          workflow_path = Path('.github/workflows/hyperliquid-archive-legacy-user-key-lexical-r6a.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_env = '  EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE\n'
          active_env = f'  EXPECTED_IMPLEMENTATION_COMMIT: {marker}\n'
          if old_env in workflow:
              assert workflow.count(old_env) == 1
              workflow = workflow.replace(old_env, active_env)
          else:
              assert workflow.count(active_env) == 1
          old_guard = """          if expected == 'PENDING_CANONICAL_IMPLEMENTATION_MERGE':
              print('::error title=R6A release gate 45::Implementation is not yet canonical; no AWS authentication is allowed')
              sys.exit(45)
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
"""
          if old_guard in workflow:
              assert workflow.count(old_guard) == 1
              workflow = workflow.replace(old_guard, '')
          assert 'PENDING_CANONICAL_IMPLEMENTATION_MERGE' not in workflow
          workflow_path.write_text(workflow, encoding='utf-8')

          impl_test = Path('tests/test_archive_inventory_r6a_implementation.py')
          text = impl_test.read_text(encoding='utf-8')
          old = '        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", text)\n'
          new = f'        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: {marker}", text)\n'
          if old in text:
              text = text.replace(old, new)
          assert new in text
          old = '        self.assertIn("Implementation is not yet canonical; no AWS authentication is allowed", text)\n'
          new = '        self.assertNotIn("Implementation is not yet canonical; no AWS authentication is allowed", text)\n'
          if old in text:
              text = text.replace(old, new)
          assert new in text
          impl_test.write_text(text, encoding='utf-8')

          workflow_test = Path('tests/test_archive_inventory_r6a_workflow.py')
          text = workflow_test.read_text(encoding='utf-8')
          old = '        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", self.text)\n'
          new = f'        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: {marker}", self.text)\n'
          if old in text:
              text = text.replace(old, new)
          assert new in text
          workflow_test.write_text(text, encoding='utf-8')
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/r6a-activation-tree-builder.yml \
            .github/workflows/r6a-activation-verifier-merger.yml \
            .github/workflows/r6a-activation-finalizer.yml
          git add \
            .github/workflows/hyperliquid-archive-legacy-user-key-lexical-r6a.yml \
            research/archive_inventory/r6a/R6A_EXECUTION_RELEASE_CANONICALIZATION.json \
            tests/test_archive_inventory_r6a_implementation.py \
            tests/test_archive_inventory_r6a_workflow.py

          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          manifest = Path('governance/REPOSITORY_MANIFEST.sha256')
          tracked = sorted(
              p.decode('utf-8')
              for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
              if p and p.decode('utf-8') != manifest.as_posix()
          )
          manifest.write_text(''.join(
              f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n"
              for name in tracked
          ), encoding='utf-8')
          PY
          git add governance/REPOSITORY_MANIFEST.sha256

          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_r6a_preregistration.py
          python governance/validate_r6a_approval.py
          python governance/validate_r6a_implementation.py
          test ! -e .github/workflows/r6a-activation-tree-builder.yml
          test ! -e .github/workflows/r6a-activation-verifier-merger.yml
          test ! -e .github/workflows/r6a-activation-finalizer.yml
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'release: finalize verified R6A activation tree'
            git push origin HEAD:research/r6a-lexical-activation
          fi
