name: Transient R10D Activation Manifest Seal

on:
  push:
    branches:
      - release/r10d-canonical-activation

permissions:
  contents: write

jobs:
  seal:
    if: github.repository == 'Mathisve1/onchain-wallet-intelligence-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact activation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/r10d-canonical-activation
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Remove transient workflow and regenerate exact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/transient-r10d-activation-manifest.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python governance/validate_r10d_execution_release.py
          git add -A
          git diff --cached --check
      - name: Commit sealed activation manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: seal R10D activation manifest'
          git push origin HEAD:release/r10d-canonical-activation
