name: R11A Corrective Draft Finalizer V4

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha }}

concurrency:
  group: r11a-corrective-draft-finalizer-v4
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 148 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11a-corrective-r3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact corrective draft head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact draft head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Generate final R6 files and exact inert successor-role policies
        shell: bash
        run: |
          set -euo pipefail
          python governance/generate_r11a_corrective_final_files_v4.py
          python - <<'PY'
          import ast
          from pathlib import Path

          def replace_function(path: Path, function_name: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              tree = ast.parse(text, filename=str(path))
              target = next(
                  (
                      node
                      for node in tree.body
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name == function_name
                  ),
                  None,
              )
              if target is None or target.end_lineno is None:
                  raise SystemExit(f'function not found: {path}:{function_name}')
              lines = text.splitlines(keepends=True)
              lines[target.lineno - 1 : target.end_lineno] = [replacement.rstrip() + '\n\n']
              path.write_text(''.join(lines), encoding='utf-8')

          canonical = Path('research/archive_inventory/r11a_corrective/canonical.py')
          text = canonical.read_text(encoding='utf-8')
          old_alias = 'FrozenValue: TypeAlias = FrozenScalar | "FrozenObject" | tuple["FrozenValue", ...]'
          new_alias = 'FrozenValue: TypeAlias = "FrozenScalar | FrozenObject | tuple[FrozenValue, ...]"'
          if old_alias in text:
              text = text.replace(old_alias, new_alias, 1)
              canonical.write_text(text, encoding='utf-8')
          elif new_alias not in text:
              raise SystemExit('recursive FrozenValue alias has unexpected bytes')

          replace_function(
              canonical,
              'mathematically_integral_number',
              '''def mathematically_integral_number(token: NumberToken) -> str | None:
              """Return an exact context-independent base-10 integer string when integral.

              The implementation never calls ``quantize()`` and therefore does not depend on
              the active Decimal precision. Very large exponent expansions remain bounded.
              """

              if token.is_integer_token:
                  return str(int(token.token, 10))
              try:
                  decimal_value = Decimal(token.token)
              except InvalidOperation:
                  return None
              if not decimal_value.is_finite():
                  return None
              sign, digits_tuple, exponent = decimal_value.as_tuple()
              digits = "".join(str(digit) for digit in digits_tuple) or "0"
              if exponent >= 0:
                  expanded = digits + ("0" * exponent)
              else:
                  fractional_digits = -exponent
                  if fractional_digits > len(digits):
                      return None
                  split = len(digits) - fractional_digits
                  fractional = digits[split:]
                  if any(character != "0" for character in fractional):
                      return None
                  expanded = digits[:split] or "0"
              expanded = expanded.lstrip("0") or "0"
              if len(expanded) > _MAX_NORMALIZED_INTEGER_DIGITS:
                  raise CanonicalJSONError("integral JSON number expansion exceeds the frozen bound")
              if sign and expanded != "0":
                  return "-" + expanded
              return expanded''',
          )

          taxonomy = Path('research/archive_inventory/r11a_corrective/taxonomy_r4.py')
          taxonomy_text = taxonomy.read_text(encoding='utf-8')
          old_protocol_import = 'from collections.abc import Iterator, Mapping, Protocol'
          new_protocol_import = 'from collections.abc import Iterator, Mapping\nfrom typing import Protocol'
          if old_protocol_import in taxonomy_text:
              taxonomy_text = taxonomy_text.replace(old_protocol_import, new_protocol_import, 1)
              taxonomy.write_text(taxonomy_text, encoding='utf-8')
          elif new_protocol_import not in taxonomy_text:
              raise SystemExit('taxonomy Protocol import has unexpected bytes')

          artifact = Path('research/archive_inventory/r11a_corrective/artifact_r3.py')
          artifact_text = artifact.read_text(encoding='utf-8')
          old_import = 'from .taxonomy_r3 import EvidenceEmitter, TaxonomyResult'
          new_import = 'from .taxonomy_r4 import EvidenceEmitter, TaxonomyResult'
          if old_import in artifact_text:
              artifact_text = artifact_text.replace(old_import, new_import, 1)
              artifact.write_text(artifact_text, encoding='utf-8')
          elif new_import not in artifact_text:
              raise SystemExit('artifact taxonomy import has unexpected bytes')
          PY
          python governance/generate_r11a_corrective_policies.py --write

      - name: Remove superseded draft modules validators and candidates
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            research/archive_inventory/r11a_corrective/artifact.py \
            research/archive_inventory/r11a_corrective/entrypoint.py \
            research/archive_inventory/r11a_corrective/entrypoint_r3.py \
            research/archive_inventory/r11a_corrective/entrypoint_r4.py \
            research/archive_inventory/r11a_corrective/index.py \
            research/archive_inventory/r11a_corrective/lz4frame.py \
            research/archive_inventory/r11a_corrective/materialize.py \
            research/archive_inventory/r11a_corrective/runner.py \
            research/archive_inventory/r11a_corrective/runner_r3.py \
            research/archive_inventory/r11a_corrective/taxonomy.py \
            research/archive_inventory/r11a_corrective/taxonomy_r3.py \
            research/archive_inventory/r11a_corrective/workflows/hyperliquid-archive-r11a-identity-boundary-diagnostic.yml \
            research/archive_inventory/r11a_corrective/workflows/hyperliquid-archive-r11a-identity-boundary-diagnostic-r3.yml \
            research/archive_inventory/r11a_corrective/workflows/hyperliquid-archive-r11a-identity-boundary-diagnostic-r4.yml \
            research/archive_inventory/r11a_corrective/workflows/hyperliquid-archive-r11a-identity-boundary-diagnostic-r5.yml \
            governance/r11a_stage_common.py \
            governance/validate_r11a_corrective_implementation.py \
            governance/validate_r11a_corrective_implementation_r3.py \
            governance/validate_r11a_corrective_implementation_r4.py \
            governance/validate_r11a_execution_artifact.py \
            governance/validate_r11a_execution_artifact_r3.py \
            governance/validate_r11a_approval.py \
            governance/validate_r11a_role_attestation.py \
            governance/validate_r11a_role_preflight_evidence.py \
            governance/validate_r11a_workflow_installation.py \
            governance/validate_r11a_execution_release.py \
            governance/validate_r11a_execution_release_r3.py \
            governance/validate_r11a_activation.py \
            governance/validate_r11a_activation_r3.py \
            governance/generate_r11a_corrective_final_files.py \
            governance/generate_r11a_corrective_final_files_v2.py \
            governance/generate_r11a_corrective_final_files_v3.py \
            governance/generate_r11a_corrective_final_files_v4.py

      - name: Restore canonical read-only CI and remove every transient write workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f \
            .github/workflows/r11a-corrective-finalize-dev.yml \
            .github/workflows/r11a-corrective-finalize-dev-v2.yml \
            .github/workflows/r11a-corrective-finalize-dev-v3.yml \
            .github/workflows/r11a-corrective-finalize-dev-v4.yml

      - name: Compile and run focused corrective tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q research/archive_inventory/r11a_corrective governance
          python -m unittest -v \
            tests.test_archive_inventory_r11a_corrective_r3 \
            tests.test_archive_inventory_r11a_corrective_artifacts
          python governance/validate_r11a_corrective_implementation_r5.py --current-inert-stage
          python governance/generate_r11a_corrective_policies.py

      - name: Seal manifest and run complete repository validation
        shell: bash
        run: |
          set -euo pipefail
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          git add -A
          git diff --cached --check

      - name: Commit coherent R6 draft only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Corrective R6 draft already generated and validated'
            exit 0
          fi
          git commit -m 'ci: generate and validate coherent R11A corrective R6 draft'
          git push origin HEAD:research/r11a-corrective-r3
