name: R8A Release Finalizer

on:
  push:
    branches:
      - research/r8a-modern-wallet-index-release

permissions:
  contents: write

concurrency:
  group: r8a-release-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out R8A release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r8a-modern-wallet-index-release
          fetch-depth: 0
          persist-credentials: true
      - name: Make implementation snapshot later-stage-aware, self-delete, regenerate and verify
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r8a-modern-wallet-index-release"
          python - <<'PY'
          from pathlib import Path
          path = Path('governance/validate_r8a_implementation.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert not RELEASE.exists()\n    assert not ACTIVATION.exists()\n    print("R8A_IMPLEMENTATION_VALID")\n'''
          new = '''    if RELEASE.exists():\n        release = load(RELEASE)\n        assert release["release_id"] == "RELEASE_HL_ARCHIVE_MODERN_WALLET_INDEX_BRIDGE_R8A_001"\n        assert release["status"] == "RELEASE_CANDIDATE_AWAITING_CANONICAL_ACTIVATION"\n        assert release["execution_ready"] is False\n        assert release["single_workflow_dispatch_authorized"] is False\n        assert release["rerun_authorized"] is False\n        assert release["canonical_implementation_merge_commit"] == "cb4f0e3272917aa27f53c85432107b21d2d242b9"\n        assert release["s3_requests_executed"] == 0\n        assert release["wallet_addresses_retained"] == 0\n        assert release["empirical_result"] is None\n    assert not ACTIVATION.exists()\n    print("R8A_IMPLEMENTATION_VALID")\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/test_archive_inventory_r8a_implementation.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''        self.assertFalse((R8 / "R8A_EXECUTION_RELEASE.json").exists())\n        self.assertFalse((R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n'''
          new_test = '''        release_path = R8 / "R8A_EXECUTION_RELEASE.json"\n        if release_path.exists():\n            release = self.load(release_path)\n            self.assertEqual(release["status"], "RELEASE_CANDIDATE_AWAITING_CANONICAL_ACTIVATION")\n            self.assertFalse(release["execution_ready"])\n            self.assertFalse(release["single_workflow_dispatch_authorized"])\n            self.assertEqual(release["s3_requests_executed"], 0)\n            self.assertEqual(release["wallet_addresses_retained"], 0)\n            self.assertIsNone(release["empirical_result"])\n        self.assertFalse((R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n'''
          assert tests.count(old_test) == 1
          test_path.write_text(tests.replace(old_test, new_test), encoding='utf-8')
          PY
          git rm .github/workflows/r8a-release-finalizer.yml
          git add governance/validate_r8a_implementation.py tests/test_archive_inventory_r8a_implementation.py
          python governance/regenerate_manifest.py --write
          python -m unittest discover -s tests -v
          python governance/validate_r8_design.py
          python governance/validate_r8a_approval.py
          python governance/validate_r8a_implementation.py
          python governance/validate_r8a_release.py
          python governance/validate_repository.py
          test ! -e .github/workflows/r8a-release-finalizer.yml
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: finalize exact inert R8A release tree'
          git push origin HEAD:research/r8a-modern-wallet-index-release
