name: R8A Approval Finalizer

on:
  push:
    branches:
      - research/r8a-modern-wallet-index-approval

permissions:
  contents: write

concurrency:
  group: r8a-approval-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out R8A approval branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r8a-modern-wallet-index-approval
          fetch-depth: 0
          persist-credentials: true
      - name: Self-delete, regenerate manifest, validate and push
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r8a-modern-wallet-index-approval"
          git rm .github/workflows/r8a-approval-finalizer.yml
          python governance/regenerate_manifest.py --write
          python -m unittest discover -s tests -v
          python governance/validate_r8_design.py
          python governance/validate_r8a_approval.py
          python governance/validate_repository.py
          test ! -e .github/workflows/r8a-approval-finalizer.yml
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'approval: finalize exact inert R8A approval tree'
          git push origin HEAD:research/r8a-modern-wallet-index-approval
