name: Transient R10C Implementation Debug

on:
  push:
    branches:
      - research/r10c-implementation

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10c-implementation
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Print exact R10C parent bindings
        run: |
          python - <<'PY'
          import json
          from research.archive_inventory.r10c_implementation import collector as c
          impl=json.load(open('research/archive_inventory/r10c_implementation/R10C_IMPLEMENTATION_CONTRACT.json'))
          parent=impl['parent_aggregate_preconditions']
          print('PARENT=',repr(parent))
          print('EXPECTED=',repr(c.PARENT_EXPECTED))
          print('EQUAL=',parent==c.PARENT_EXPECTED)
          print('PARENT_KEYS=',sorted(parent))
          print('EXPECTED_KEYS=',sorted(c.PARENT_EXPECTED))
          for key in sorted(set(parent)|set(c.PARENT_EXPECTED)):
              print(key, repr(parent.get(key)), repr(c.PARENT_EXPECTED.get(key)), parent.get(key)==c.PARENT_EXPECTED.get(key))
          c.validate_static_inputs()
          print('STATIC_INPUTS_PASS')
          PY
