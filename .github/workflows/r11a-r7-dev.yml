name: R11A Corrective R7 Development Checks

on:
  pull_request:

permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  r7-targeted:
    if: >-
      github.event.pull_request.number == 148 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11a-corrective-r3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact R7 development head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Compile exact R7 graph
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            research/archive_inventory/r11a_corrective \
            governance/validate_r11a_execution_artifact_r7.py \
            governance/validate_r11a_runtime_binding_r7.py \
            tests/test_archive_inventory_r11a_corrective_r7.py \
            tests/test_archive_inventory_r11a_corrective_r7_precedence.py
      - name: Run focused adversarial R7 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_archive_inventory_r11a_corrective_r7 \
            tests.test_archive_inventory_r11a_corrective_r7_precedence
