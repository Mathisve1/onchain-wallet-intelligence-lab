name: R7 Implementation Finalizer

on:
  push:
    branches:
      - research/r7-wallet-index-implementation

permissions:
  contents: write

concurrency:
  group: r7-implementation-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out R7 implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r7-wallet-index-implementation
          fetch-depth: 0
          persist-credentials: true

      - name: Make historical validators successor-aware, regenerate manifest, validate and self-delete
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r7-wallet-index-implementation"
          python - <<'PY'
          from pathlib import Path

          prereg = Path('governance/validate_r7_preregistration.py')
          text = prereg.read_text(encoding='utf-8')
          old = '''    forbidden_paths = [\n        R7 / "collector.py",\n        R7 / "R7_IMPLEMENTATION_CONTRACT.json",\n        R7 / "R7_EXECUTION_RELEASE.json",\n        ROOT / ".github/workflows/hyperliquid-archive-wallet-index-r7.yml",\n    ]\n    for path in forbidden_paths:\n        assert not path.exists(), path\n\n'''
          new = '''    implementation = R7 / "R7_IMPLEMENTATION_CONTRACT.json"\n    if not implementation.exists():\n        for path in (\n            R7 / "collector.py",\n            ROOT / ".github/workflows/hyperliquid-archive-wallet-index-r7.yml",\n        ):\n            assert not path.exists(), path\n\n'''
          assert text.count(old) == 1
          prereg.write_text(text.replace(old, new), encoding='utf-8')

          impl = Path('governance/validate_r7_implementation.py')
          text = impl.read_text(encoding='utf-8')
          old = '''    assert not RELEASE.exists()\n    assert not ACTIVATION.exists()\n\n'''
          new = '''    if RELEASE.exists():\n        release = load(RELEASE)\n        assert release["release_id"] == "RELEASE_HL_ARCHIVE_WALLET_INDEX_RECONSTRUCTION_R7_001"\n        assert release["status"] == "RELEASE_CANDIDATE_AWAITING_CANONICAL_ACTIVATION"\n        assert release["execution_ready"] is False\n        assert release["single_workflow_dispatch_authorized"] is False\n    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["release_id"] == "RELEASE_HL_ARCHIVE_WALLET_INDEX_RECONSTRUCTION_R7_001"\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R7_RUN"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n\n'''
          assert text.count(old) == 1
          impl.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git rm .github/workflows/r7-implementation-finalizer.yml
          git add governance/validate_r7_preregistration.py governance/validate_r7_implementation.py
          python governance/regenerate_manifest.py --write
          python -m unittest discover -s tests -v
          python governance/validate_r7_preregistration.py
          python governance/validate_r7_approval.py
          python governance/validate_r7_implementation.py
          python governance/validate_repository.py
          test ! -e .github/workflows/r7-implementation-finalizer.yml
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: finalize exact inert R7 implementation tree'
          git push origin HEAD:research/r7-wallet-index-implementation
