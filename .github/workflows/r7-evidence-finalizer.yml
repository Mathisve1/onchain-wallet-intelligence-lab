name: R7 Evidence Finalizer

on:
  push:
    branches:
      - research/r7-wallet-index-evidence

permissions:
  actions: read
  contents: write

concurrency:
  group: r7-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact R7 evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r7-wallet-index-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact R7 artifact, retain approved wallet index, validate and self-delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r7-wallet-index-evidence"

          api="https://api.github.com/repos/${REPOSITORY}/actions/artifacts/9042711108/zip"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" -o /tmp/r7-artifact.zip

          test "$(stat -c '%s' /tmp/r7-artifact.zip)" = "119412"
          printf '%s  %s\n' \
            'fb36478cdff956f83efdd1d7ae8c7bb8b3a82e8226d3868ea877a99ffac46ea7' \
            '/tmp/r7-artifact.zip' | sha256sum --check --status

          rm -rf /tmp/r7-artifact
          mkdir -p /tmp/r7-artifact
          unzip -q /tmp/r7-artifact.zip -d /tmp/r7-artifact
          test "$(find /tmp/r7-artifact -maxdepth 1 -type f | wc -l)" = "5"

          cd /tmp/r7-artifact
          sha256sum --check R7_FILES.sha256
          test "$(sha256sum r7-context.json | cut -d' ' -f1)" = '646f4ca4458bfefee882653f012cc3220aff863f5128bcee6df86a4266f7e1e8'
          test "$(sha256sum r7-result.json | cut -d' ' -f1)" = 'cc84f0942dc9f93296fb532c4c47b3555e241aee63b5cf27d6a1eb3a0f90fbb6'
          test "$(sha256sum r7-wallet-index.ndjson | cut -d' ' -f1)" = '2b8cbf709075aeda25394f22ee04b08656d5d165105976ed5d7e0890479e2d6d'
          test "$(sha256sum r7.rc | cut -d' ' -f1)" = '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa'
          test "$(sha256sum R7_FILES.sha256 | cut -d' ' -f1)" = '1ef362a938fb3e6728c5ae44b2afb7d3d4a951fb1ecfaa126c4009cee836d2b1'
          test "$(stat -c '%s' r7-wallet-index.ndjson)" = "368036"
          test "$(cat r7.rc)" = "0"

          cd "${GITHUB_WORKSPACE}"
          dest='research/archive_inventory/r7/evidence/run-31330248235'
          mkdir -p "${dest}"
          cp /tmp/r7-artifact/r7-context.json "${dest}/"
          cp /tmp/r7-artifact/r7-result.json "${dest}/"
          cp /tmp/r7-artifact/r7-wallet-index.ndjson "${dest}/"
          cp /tmp/r7-artifact/r7.rc "${dest}/"
          cp /tmp/r7-artifact/R7_FILES.sha256 "${dest}/"

          python governance/validate_r7_evidence.py

          git rm .github/workflows/r7-evidence-finalizer.yml
          python governance/regenerate_manifest.py --write
          python -m unittest discover -s tests -v
          python governance/validate_r7_evidence.py
          python governance/validate_repository.py
          test ! -e .github/workflows/r7-evidence-finalizer.yml

          git add governance/REPOSITORY_MANIFEST.sha256 \
            research/archive_inventory/r7/R7_EXECUTION_RELEASE_CONSUMPTION.json \
            research/archive_inventory/r7/evidence \
            governance/validate_r7_evidence.py \
            tests/test_archive_inventory_r7_evidence.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evidence: finalize canonical R7 wallet index'
          git push origin HEAD:research/r7-wallet-index-evidence
