name: R7 Approval Finalizer

on:
  push:
    branches:
      - research/r7-human-approval

permissions:
  contents: write

concurrency:
  group: r7-approval-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out R7 approval branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r7-human-approval
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate exact manifest, validate, self-delete and push
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r7-human-approval"
          git rm .github/workflows/r7-approval-finalizer.yml
          python governance/regenerate_manifest.py --write
          python -m unittest discover -s tests -v
          python governance/validate_r7_preregistration.py
          python governance/validate_r7_approval.py
          python governance/validate_repository.py
          test ! -e .github/workflows/r7-approval-finalizer.yml
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'approval: finalize exact R7 approval tree'
          git push origin HEAD:research/r7-human-approval
