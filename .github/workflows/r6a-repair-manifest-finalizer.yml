name: R6A Repair Manifest Finalizer

on:
  push:
    branches:
      - repair/r6a-preoidc-successor

permissions:
  contents: write

concurrency:
  group: r6a-repair-manifest-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/r6a-preoidc-successor
          fetch-depth: 0
          persist-credentials: true

      - name: Self-delete, regenerate exact manifest, validate and push
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/repair/r6a-preoidc-successor"
          git rm .github/workflows/r6a-repair-manifest-finalizer.yml
          python governance/regenerate_manifest.py --write
          git add governance/REPOSITORY_MANIFEST.sha256
          test ! -e .github/workflows/r6a-repair-manifest-finalizer.yml
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_r6a_preregistration.py
          python governance/validate_r6a_approval.py
          python governance/validate_r6a_implementation.py
          python governance/validate_r6a_successor_release.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'governance: finalize exact R6A successor manifest'
          git push origin HEAD:repair/r6a-preoidc-successor
