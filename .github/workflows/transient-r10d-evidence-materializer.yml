name: Transient R10D Evidence Materializer

on:
  push:
    branches: [release/r10d-canonical-activation]

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/r10d-canonical-activation
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Download exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9075129362/zip" \
            -o /tmp/r10d.zip
          test "$(stat -c %s /tmp/r10d.zip)" = '918968'
          test "$(sha256sum /tmp/r10d.zip | cut -d' ' -f1)" = '4e63afc141f98ee05030ce19effc88f3bbd1eab59796c716a5d3c671eb2476ae'
      - name: Materialize bounded evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, collections, hashlib, json, shutil, zipfile
          from decimal import Decimal
          zpath=Path('/tmp/r10d.zip'); zbytes=zpath.read_bytes()
          ZIP='4e63afc141f98ee05030ce19effc88f3bbd1eab59796c716a5d3c671eb2476ae'
          assert len(zbytes)==918968 and hashlib.sha256(zbytes).hexdigest()==ZIP
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert names==['r10d-context.json','r10d-result.json','r10d-wallet-features.ndjson','r10d.rc','R10D_FILES.sha256']
              data={n:z.read(n) for n in names}
          expected={
            'r10d-context.json':(1243,'19c555e1b3f8bb9efc30e849a077cfd13e3ac0498b8c8776a86fe719bc442300'),
            'r10d-result.json':(8227,'2780a2ccead6f4efa6aa83a50818f506e9728a15f80e68499d81a8032710b9f3'),
            'r10d-wallet-features.ndjson':(6557323,'ea83c15398ed7b3c76d0be52aed0d9472ace3c975ac416fcd4a6d95760c4c991'),
            'r10d.rc':(2,'9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa'),
            'R10D_FILES.sha256':(335,'839ad6490b93ce2299628068d4e12c4636ab1a6977c69f947338358e196aa8e5')}
          for n,(size,sha) in expected.items(): assert len(data[n])==size and hashlib.sha256(data[n]).hexdigest()==sha
          ctx=json.loads(data['r10d-context.json']); res=json.loads(data['r10d-result.json'])
          assert ctx['workflow_run_id']==31420197671 and ctx['dispatch_sha']=='c3e893da2e25d993250258f9b4b81aa5ad332e77'
          assert res['research_conclusion']=='R10D_MULTI_HOUR_FEATURE_PIPELINE_COMPLETE' and res['completed_hour_count']==6
          assert res['successful_request_count']==6 and res['failed_request_count']==0 and res['retries_used']==0
          assert all(h['record_anchored_alignment_violation_count']==0 and h['fill_time_after_path_hour_count']==0 for h in res['per_hour_summaries'])
          rows=[json.loads(x) for x in data['r10d-wallet-features.ndjson'].decode().splitlines() if x]
          addresses=[r['wallet_address'] for r in rows]
          assert len(rows)==16410 and addresses==sorted(addresses) and len(set(addresses))==16410
          assert sum(r['fill_count'] for r in rows)==sum(r['side_a_count']+r['side_b_count'] for r in rows)==1486542
          assert sum(r['duplicate_tid_count'] for r in rows)==0
          active=collections.Counter(r['active_hour_count'] for r in rows)
          assert active==collections.Counter({1:8388,2:3305,3:1508,4:981,5:639,6:1589})
          base=Path('research/archive_inventory/r10d_evidence'); run=base/'run-31420197671'; art=run/'artifact'
          if base.exists(): shutil.rmtree(base)
          art.mkdir(parents=True)
          for n in ('r10d-context.json','r10d-result.json','r10d.rc','R10D_FILES.sha256'): (run/n).write_bytes(data[n])
          enc=base64.b64encode(zbytes).decode(); parts=[]
          for i,start in enumerate(range(0,len(enc),80000)):
              chunk=enc[start:start+80000]; name=f'r10d-record-anchored-wallet-features-31420197671.zip.b64.part{i:02d}'
              (art/name).write_text(chunk); parts.append({'path':'artifact/'+name,'character_count':len(chunk),'sha256':hashlib.sha256(chunk.encode()).hexdigest()})
          entries=[{'name':n,'size_bytes':len(data[n]),'sha256':hashlib.sha256(data[n]).hexdigest()} for n in names]
          rec={'schema_version':'1.0','pilot_id':'HL-ARCHIVE-R10D-RECORD-ANCHORED-MULTI-HOUR-FEATURE-REPAIR-001','workflow_run_id':31420197671,'workflow_run_attempt':1,'workflow_job_id':93558813495,'artifact_id':9075129362,'artifact_name':'r10d-record-anchored-wallet-features-31420197671','artifact_size_bytes':918968,'artifact_zip_sha256':ZIP,'base64_character_count':len(enc),'base64_parts':parts,'zip_entries':entries,'reconstruction_method':'CONCATENATE_BASE64_PARTS_IN_LISTED_ORDER_THEN_STRICT_BASE64_DECODE'}
          (run/'ARTIFACT_RECONSTRUCTION.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          verification={'schema_version':'1.0','pilot_id':rec['pilot_id'],'workflow_run_id':31420197671,'workflow_run_attempt':1,'workflow_job_id':93558813495,'job_conclusion':'success','artifact_id':9075129362,'artifact_name':rec['artifact_name'],'artifact_size_bytes':918968,'provider_digest':'sha256:'+ZIP,'provider_zip_sha256':ZIP,'independently_downloaded_zip_sha256':ZIP,'provider_digest_matches_independent_download':True,'internal_ledger':{n:expected[n][1] for n in ('r10d-context.json','r10d-result.json','r10d-wallet-features.ndjson','r10d.rc')},'internal_ledger_matches_all_retained_files':True,'artifact_reconstructable_from_repository_parts':True,'verification_result':'ALL_RETAINED_R10D_EVIDENCE_CHECKS_PASS_MULTI_HOUR_FEATURE_PIPELINE_COMPLETE'}
          (run/'INDEPENDENT_ARTIFACT_VERIFICATION.json').write_text(json.dumps(verification,indent=2,sort_keys=True)+'\n')
          diag={'schema_version':'1.0','pilot_id':rec['pilot_id'],'diagnostic_role':'AGGREGATE_MECHANICS_EVIDENCE_NOT_WALLET_RANKING','wallet_feature_row_count':16410,'wallet_feature_bytes':6557323,'wallet_feature_sha256':expected['r10d-wallet-features.ndjson'][1],'sum_fill_count':1486542,'sum_side_count':1486542,'active_hour_count_distribution':{str(i):active[i] for i in range(1,7)},'crossed_true_count_total':sum(r['crossed_true_count'] for r in rows),'liquidation_associated_fill_count_total':sum(r['liquidation_associated_fill_count'] for r in rows),'duplicate_tid_count_total':0,'sum_abs_px_times_sz_notional_proxy_total':format(sum(Decimal(r['sum_abs_px_times_sz_notional_proxy']) for r in rows),'f'),'sum_closed_pnl_fill_statistic_total':format(sum(Decimal(r['sum_closed_pnl_fill_statistic']) for r in rows),'f'),'global_first_retained_fill_time_ms':min(r['first_fill_time'] for r in rows),'global_last_retained_fill_time_ms':max(r['last_fill_time'] for r in rows),'interpretation_boundaries':{'six_hour_window_is_sufficient_wallet_performance_history':False,'sum_closed_pnl_fill_statistic_is_exact_account_return':False,'sum_closed_pnl_fill_statistic_is_wallet_ranking_score':False,'sum_abs_px_times_sz_notional_proxy_is_copyable_notional':False,'active_hour_count_is_wallet_quality_score':False,'one_wallet_address_equals_one_human_or_economic_entity':False},'downstream_actions_performed':{'wallet_ranking':False,'candidate_shortlisting':False,'pnl_or_alpha_analysis':False,'copyability_analysis':False,'public_api_enrichment':False,'entity_clustering':False,'market_data_ingestion':False,'strategy_inference':False}}
          assert diag['crossed_true_count_total']==743271 and diag['liquidation_associated_fill_count_total']==1330
          assert diag['sum_abs_px_times_sz_notional_proxy_total']=='3670148918.05560308' and diag['sum_closed_pnl_fill_statistic_total']=='308059.4394867907'
          (base/'R10D_AGGREGATE_DIAGNOSTICS.json').write_text(json.dumps(diag,indent=2,sort_keys=True)+'\n')
          closed_downstream={'historical_window_beyond_six_hours':False,'full_population_historical_ingestion':False,'legacy_modern_merged_history':False,'public_api_enrichment':False,'entity_clustering':False,'wallet_ranking':False,'candidate_shortlisting':False,'pnl_or_alpha_analysis':False,'copyability_analysis':False,'market_data_ingestion':False,'strategy_inference':False}
          trading={'integration':False,'paper':False,'shadow':False,'live':False,'leverage':False,'capital_allocation':False}
          att={'schema_version':'1.0','pilot_id':rec['pilot_id'],'status':'ATTESTED_COMPLETE_R10D_MULTI_HOUR_FEATURE_PIPELINE','execution_release_id':'RELEASE_HL_ARCHIVE_R10D_RECORD_ANCHORED_MULTI_HOUR_FEATURE_001','canonical_dispatch_sha':'c3e893da2e25d993250258f9b4b81aa5ad332e77','workflow_run_id':31420197671,'workflow_run_attempt':1,'workflow_job_id':93558813495,'artifact_id':9075129362,'artifact_name':rec['artifact_name'],'artifact_zip_sha256':ZIP,'terminal_status':res['terminal_status'],'technical_result':res['technical_result'],'research_conclusion':res['research_conclusion'],'record_anchored_rule_id':res['record_anchored_rule_id'],'numeric_tolerance_authorized':False,'exact_execution_summary':{'selected_hour_count':6,'completed_hour_count':6,'request_attempt_count':6,'successful_get_object_requests':6,'failed_get_object_requests':0,'retries_used':0,'http_redirects_followed':False,'total_compressed_bytes':res['total_compressed_bytes'],'total_decompressed_bytes':res['total_decompressed_bytes'],'wallet_feature_row_count':16410,'wallet_feature_bytes':6557323,'wallet_feature_sha256':expected['r10d-wallet-features.ndjson'][1],'sum_fill_count':1486542,'sum_side_count':1486542,'duplicate_wallet_tid_count':0},'per_hour_summaries':res['per_hour_summaries'],'claims_proven':{'all_six_exact_objects_completed_under_single_use_release':True,'every_hour_has_zero_record_anchored_alignment_violations':True,'every_hour_has_zero_after_path_hour_fills':True,'hour9_reproduces_r10c_two_pre_hour_fill_record_anchor':True,'hour14_contains_eight_pre_hour_fills_in_one_previous_block_time_record_with_zero_alignment_violations':True,'wallet_feature_rows_are_sorted_unique_and_hash_bound':True,'fill_and_side_counts_conserve_exactly':True,'duplicate_wallet_tid_count_is_zero':True},'claims_not_proven':{'local_time_defines_s3_path_hour_partition':False,'block_time_defines_s3_path_hour_partition':False,'fill_time_defines_s3_path_hour_partition':False,'numeric_millisecond_tolerance_is_safe':False,'six_hour_window_is_sufficient_wallet_performance_history':False,'sum_closed_pnl_fill_statistic_is_exact_account_return':False,'wallet_quality_or_profitability':False,'copyability':False,'one_wallet_address_equals_one_human_or_economic_entity':False},'release_consumed':True,'rerun_authorized':False,'future_r10d_dispatch_authorized':False,'remaining_get_object_budget_from_consumed_release':0,'new_network_request_requires_new_preregistration_approval_and_release':True,'downstream_authorizations':closed_downstream,'trading_authorizations':trading}
          (base/'HL-ARCHIVE-R10D-RECORD-ANCHORED-MULTI-HOUR-FEATURE-REPAIR-001-ATTESTATION.json').write_text(json.dumps(att,indent=2,sort_keys=True)+'\n')
          consumption={'schema_version':'1.0','execution_release_id':att['execution_release_id'],'pilot_id':rec['pilot_id'],'status':'CONSUMED_SUCCESS_R10D_MULTI_HOUR_FEATURE_PIPELINE_COMPLETE','release_consumed':True,'canonical_dispatch_sha':att['canonical_dispatch_sha'],'workflow_run_id':31420197671,'workflow_run_attempt':1,'workflow_job_id':93558813495,'artifact_id':9075129362,'artifact_name':rec['artifact_name'],'artifact_size_bytes':918968,'artifact_zip_sha256':ZIP,'terminal_status':att['terminal_status'],'technical_result':att['technical_result'],'research_conclusion':att['research_conclusion'],'request_attempt_count':6,'successful_get_object_requests':6,'failed_get_object_requests':0,'retries_used':0,'http_redirects_followed':False,'compressed_bytes_downloaded':res['total_compressed_bytes'],'decompressed_bytes':res['total_decompressed_bytes'],'wallet_feature_row_count':16410,'wallet_feature_bytes':6557323,'wallet_feature_sha256':expected['r10d-wallet-features.ndjson'][1],'future_r10d_dispatch_authorized':False,'rerun_authorized':False,'remaining_get_object_budget_from_consumed_release':0,'new_network_request_requires_new_preregistration_approval_and_release':True,'downstream_authorizations':closed_downstream,'trading_authorizations':trading}
          Path('research/archive_inventory/r10d_runtime/R10D_EXECUTION_RELEASE_CONSUMPTION.json').write_text(json.dumps(consumption,indent=2,sort_keys=True)+'\n')
          (base/'README.md').write_text('# R10D execution evidence\n\nCanonical run `31420197671` completed successfully from `c3e893da2e25d993250258f9b4b81aa5ad332e77`. All six exact hour-9 through hour-14 objects completed with zero retries and zero record-anchored alignment violations. The exact artifact is retained reconstructably as Base64 ZIP parts.\n\nThis is a mechanics result, not a wallet-performance result. Six hours is insufficient for profitability, alpha, copyability, ranking or entity claims. The release is consumed and reruns are forbidden.\n')
          (base/'R10D_RESEARCH_CONCLUSION.md').write_text('# R10D research conclusion\n\n`R10D_MULTI_HOUR_FEATURE_PIPELINE_COMPLETE`. The R10C-derived record-anchored repair generalizes across the exact six-hour mechanics pilot without any numeric millisecond tolerance. This closes the multi-object mechanics gate only; broader historical coverage must be separately preregistered before ranking or alpha research.\n')
          PY
      - name: Seal manifest and commit evidence
        run: |
          set -euo pipefail
          rm .github/workflows/transient-r10d-evidence-materializer.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python governance/validate_repository.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evidence: materialize exact successful R10D run'
          git push origin HEAD:release/r10d-canonical-activation
