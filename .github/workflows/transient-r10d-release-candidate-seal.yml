name: Transient R10D Release Candidate Seal

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  seal:
    if: github.repository == 'Mathisve1/onchain-wallet-intelligence-lab' && github.event.pull_request.head.ref == 'research/r10d-release-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact R10D release-candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10d-release-candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact PR head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" = 'research/r10d-release-candidate'

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Validate exact inert R10D release candidate
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_r10d_record_anchored_boundary_repair_preregistration.py
          python governance/validate_r10d_approval.py
          python governance/validate_r10d_implementation.py
          python governance/validate_r10d_execution_release_candidate.py
          python -m unittest discover -s tests -p 'test_archive_inventory_r10d*.py' -v
          python -m unittest tests.test_archive_inventory_aws_oidc_access -v

      - name: Remove transient workflow and seal repository manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/transient-r10d-release-candidate-seal.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          git add -A
          git diff --cached --check

      - name: Commit and push sealed R10D release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: seal exact R10D release candidate'
          git push origin HEAD:research/r10d-release-candidate
