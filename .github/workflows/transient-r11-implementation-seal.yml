name: Transient R11 Implementation Seal

on:
  push:
    branches:
      - research/r11-implementation

permissions:
  contents: write

jobs:
  seal:
    if: github.repository == 'Mathisve1/onchain-wallet-intelligence-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r11-implementation
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Generate exact policy, remove transient route and validate
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_inventory/r11_implementation/generate_permission_policy.py
          rm -- .github/workflows/transient-r11-implementation-seal.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python governance/validate_r11_approval.py
          python governance/validate_r11_implementation.py
          python -m unittest tests.test_archive_inventory_r11_implementation -v
          python governance/validate_repository.py
          git add -A
          git diff --cached --check
      - name: Commit sealed R11 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: seal exact R11 implementation'
          git push origin HEAD:research/r11-implementation
