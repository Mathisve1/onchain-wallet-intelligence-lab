name: Hyperliquid Archive Hourly Body Schema Pilot R4
run-name: R4 dedicated role STS-only preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-r4-role-sts-preflight
  cancel-in-progress: false

env:
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  EXPECTED_AWS_ACCOUNT_ID: '630956766927'
  R4_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-body-schema-r4
  ROLE_ATTESTATION_MERGE_COMMIT: c45527941dea7d152e332327ebd0593dc2413bea
  OPERATOR_ATTESTATION_TEXT_SHA256: 5af72489211b1ad79e35f0491502e34d518df7c14ae6f2f8d56fbd2c3a5a83c2
  EXPECTED_PREFLIGHT_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_PREFLIGHT_IMPLEMENTATION_MERGE
  PREFLIGHT_RELEASE_PATH: research/archive_inventory/r4/role_attestation/R4_ROLE_STS_PREFLIGHT_RELEASE.json
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  r4-role-sts-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out canonical dispatch SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DISPATCH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical manual main preflight identity
        shell: bash
        run: |
          set -euo pipefail
          observed_head="$(git rev-parse HEAD)"
          if [[ "${EVENT_NAME}" != 'workflow_dispatch' ]]; then
            echo "::error title=R4 preflight identity gate 71::Expected workflow_dispatch"
            exit 71
          fi
          if [[ "${DISPATCH_REF}" != 'refs/heads/main' ]]; then
            echo "::error title=R4 preflight identity gate 72::Expected refs/heads/main"
            exit 72
          fi
          if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=R4 preflight identity gate 73::github.sha is not exact 40-hex"
            exit 73
          fi
          if [[ "${observed_head}" != "${DISPATCH_SHA}" ]]; then
            echo "::error title=R4 preflight identity gate 74::Checked-out HEAD differs from github.sha"
            exit 74
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Prove canonical R4 role attestation and preflight release before OIDC
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep -F 'Python 3.12.13'
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_r4_role_attestation.py
          python governance/validate_r4_role_preflight.py
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path('.')
          base = root / 'research/archive_inventory/r4'
          attestation_text = base / 'role_attestation/R4_DEDICATED_ROLE_OPERATOR_ATTESTATION.txt'
          attestation = json.loads((base / 'role_attestation/R4_DEDICATED_ROLE_OPERATOR_ATTESTATION.json').read_text(encoding='utf-8'))
          contract = json.loads((base / 'role_attestation/R4_ROLE_STS_PREFLIGHT_CONTRACT.json').read_text(encoding='utf-8'))
          expected = os.environ['EXPECTED_PREFLIGHT_IMPLEMENTATION_COMMIT']
          release_path = root / os.environ['PREFLIGHT_RELEASE_PATH']

          assert hashlib.sha256(attestation_text.read_bytes()).hexdigest() == os.environ['OPERATOR_ATTESTATION_TEXT_SHA256']
          assert attestation['recorded_against_main_commit'] == '01521d1cad209263a217dbcca98ecd74ec16857c'
          assert attestation['operator_attested'] is True
          assert attestation['independently_verified'] is False
          assert attestation['sts_only_preflight_required'] is True
          assert attestation['sts_only_preflight_completed'] is False
          assert attestation['preflight_s3_requests_authorized'] is False
          assert attestation['r4_execution_ready'] is False
          assert contract['role_attestation_merge_commit'] == os.environ['ROLE_ATTESTATION_MERGE_COMMIT']
          assert contract['role_arn'] == os.environ['R4_ROLE_ARN']
          assert contract['expected_account_id'] == os.environ['EXPECTED_AWS_ACCOUNT_ID']
          assert contract['inline_session_policy'] == 'DENY_ALL_S3_ON_ALL_RESOURCES'
          assert contract['preflight_s3_requests_authorized'] is False
          assert contract['preflight_get_object_authorized'] is False
          assert contract['preflight_object_body_download_authorized'] is False
          assert contract['r4_body_release_consumed_by_preflight'] is False
          assert contract['r4_body_execution_activation_authorized'] is False

          if expected == 'PENDING_CANONICAL_PREFLIGHT_IMPLEMENTATION_MERGE':
              print('::error title=R4 preflight release gate 75::Preflight implementation is not canonical; no AWS authentication is allowed')
              sys.exit(75)
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          assert release_path.is_file(), 'R4 STS preflight release is absent'
          release = json.loads(release_path.read_text(encoding='utf-8'))
          assert release['preflight_release_id'] == 'RELEASE_HL_ARCHIVE_R4_ROLE_STS_PREFLIGHT_001'
          assert release['status'] == 'RELEASED_FOR_EXACTLY_ONE_CANONICAL_STS_PREFLIGHT'
          assert release['preflight_implementation_commit'] == expected
          assert release['role_attestation_merge_commit'] == os.environ['ROLE_ATTESTATION_MERGE_COMMIT']
          assert release['operator_attestation_text_sha256'] == os.environ['OPERATOR_ATTESTATION_TEXT_SHA256']
          assert release['role_arn'] == os.environ['R4_ROLE_ARN']
          assert release['expected_account_id'] == os.environ['EXPECTED_AWS_ACCOUNT_ID']
          assert release['github_event_required'] == 'workflow_dispatch'
          assert release['canonical_dispatch_ref_required'] == 'refs/heads/main'
          assert release['single_workflow_dispatch_authorized'] is True
          assert release['rerun_authorized'] is False
          assert release['inline_session_policy'] == 'DENY_ALL_S3_ON_ALL_RESOURCES'
          assert release['sts_get_caller_identity_authorized'] is True
          for key in (
              's3_requests_authorized',
              'requester_pays_authorized',
              'get_object_authorized',
              'list_objects_authorized',
              'head_object_authorized',
              'range_get_authorized',
              'object_body_download_authorized',
              'decompression_authorized',
              'body_release_consumed_by_preflight',
              'body_execution_activation_authorized',
          ):
              assert release[key] is False, key
          assert release['s3_requests_executed'] == 0
          assert release['object_bytes_downloaded'] == 0
          assert release['empirical_result'] is None
          PY

      - name: Enforce single-use R4 STS preflight before AWS OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${CURRENT_RUN_ATTEMPT}" != '1' ]]; then
            echo "::error title=R4 preflight single-use gate::Run attempt must be 1; re-runs are forbidden"
            exit 76
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          release = json.loads(Path(os.environ['PREFLIGHT_RELEASE_PATH']).read_text(encoding='utf-8'))
          start = datetime.fromisoformat(release['single_use_window_start_utc'].replace('Z', '+00:00')).astimezone(timezone.utc)
          repo = os.environ['CURRENT_REPOSITORY']
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'hyperliquid-archive-hourly-body-schema-role-preflight-r4.yml/runs'
              '?event=workflow_dispatch&branch=main&per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hl-r4-role-sts-preflight-single-use',
              },
              method='GET',
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              runs = json.load(response).get('workflow_runs')
          assert isinstance(runs, list) and len(runs) < 100
          eligible = [
              row for row in runs
              if datetime.fromisoformat(row['created_at'].replace('Z', '+00:00')).astimezone(timezone.utc) >= start
          ]
          assert len(eligible) == 1, 'R4 role preflight release is not single-use within its window'
          assert int(eligible[0]['id']) == current_run_id, 'a previous preflight dispatch already consumed the release'
          assert eligible[0]['event'] == 'workflow_dispatch'
          assert eligible[0]['head_branch'] == 'main'
          PY

      - name: Freeze pending R4 STS preflight context before AWS authentication
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          release = json.loads(Path(os.environ['PREFLIGHT_RELEASE_PATH']).read_text(encoding='utf-8'))
          context = {
              'schema_version': '1.0',
              'preflight_id': 'HL-ARCHIVE-R4-DEDICATED-ROLE-STS-PREFLIGHT-001',
              'terminal_status': 'PENDING_AWS_OIDC',
              'event_name': os.environ['EVENT_NAME'],
              'dispatch_ref': os.environ['DISPATCH_REF'],
              'dispatch_sha': os.environ['DISPATCH_SHA'],
              'checked_out_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
              'preflight_release_id': release['preflight_release_id'],
              'preflight_implementation_commit': release['preflight_implementation_commit'],
              'role_attestation_merge_commit': os.environ['ROLE_ATTESTATION_MERGE_COMMIT'],
              'operator_attestation_text_sha256': os.environ['OPERATOR_ATTESTATION_TEXT_SHA256'],
              'expected_account_id': os.environ['EXPECTED_AWS_ACCOUNT_ID'],
              'expected_role_arn': os.environ['R4_ROLE_ARN'],
              'session_policy': 'DENY_ALL_S3_ON_ALL_RESOURCES',
              'configure_aws_outcome': None,
              's3_requests_authorized': False,
              's3_http_request_count': 0,
              'requester_pays_authorized': False,
              'object_body_download_authorized': False,
              'decompression_authorized': False,
              'body_release_consumed_by_preflight': False,
              'body_execution_activation_authorized': False,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'r4-role-preflight-context.json').write_text(
              json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Assume dedicated R4 role with all S3 explicitly denied
        id: configure
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-body-schema-r4
          aws-region: ap-northeast-1
          role-duration-seconds: 900
          role-session-name: HLArchiveR4RolePreflight
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"DenyAllS3DuringR4RolePreflight","Effect":"Deny","Action":"s3:*","Resource":"*"}]}

      - name: Execute one explicit STS caller-identity check
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/r4-role-preflight-caller.raw.json"
          set +e
          aws sts get-caller-identity --output json >"${raw}"
          rc=$?
          set -e
          printf '%s\n' "${rc}" >"${RUNNER_TEMP}/r4-role-preflight.rc"
          if [[ "${rc}" != '0' ]]; then
            rm -f "${raw}"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          raw = json.loads((root / 'r4-role-preflight-caller.raw.json').read_text(encoding='utf-8'))
          account = raw.get('Account')
          arn = raw.get('Arn')
          expected_prefix = 'arn:aws:sts::630956766927:assumed-role/onchain-wallet-intelligence-hl-archive-body-schema-r4/'
          assert account == '630956766927'
          assert isinstance(arn, str) and arn.startswith(expected_prefix)
          assert arn.endswith('/HLArchiveR4RolePreflight')
          result = {
              'schema_version': '1.0',
              'preflight_id': 'HL-ARCHIVE-R4-DEDICATED-ROLE-STS-PREFLIGHT-001',
              'terminal_status': 'R4_ROLE_STS_PREFLIGHT_PASS',
              'technical_result': 'DEDICATED_R4_ROLE_ASSUMEABLE_FROM_CANONICAL_MAIN',
              'account_id': account,
              'role_session_arn': arn,
              'session_policy': 'DENY_ALL_S3_ON_ALL_RESOURCES',
              'explicit_sts_caller_identity_calls': 1,
              's3_http_request_count': 0,
              'requester_pays_requested': False,
              'object_body_downloaded': False,
              'object_bytes_downloaded': 0,
              'decompression_performed': False,
              'raw_oidc_token_retained': False,
              'aws_credentials_retained': False,
              'raw_caller_identity_retained': False,
              'body_release_consumed_by_preflight': False,
              'body_execution_activation_authorized': False,
              'empirical_result': None,
          }
          (root / 'r4-role-preflight-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          rm -f "${raw}"

      - name: Record non-execution when AWS role assumption fails
        if: steps.configure.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'NOT_RUN' >"${RUNNER_TEMP}/r4-role-preflight.rc"

      - name: Finalize minimized R4 STS preflight evidence
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          context_path = root / 'r4-role-preflight-context.json'
          result_path = root / 'r4-role-preflight-result.json'
          if context_path.is_file():
              context = json.loads(context_path.read_text(encoding='utf-8'))
              context['configure_aws_outcome'] = os.environ.get('CONFIGURE_OUTCOME')
              context_path.write_text(json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          else:
              context = {
                  'schema_version': '1.0',
                  'preflight_id': 'HL-ARCHIVE-R4-DEDICATED-ROLE-STS-PREFLIGHT-001',
                  'terminal_status': 'R4_ROLE_PREFLIGHT_PRE_OIDC_GATE_FAILED',
                  'event_name': os.environ.get('EVENT_NAME'),
                  'dispatch_ref': os.environ.get('DISPATCH_REF'),
                  'dispatch_sha': os.environ.get('DISPATCH_SHA'),
                  'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
                  'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
                  'expected_account_id': os.environ.get('EXPECTED_AWS_ACCOUNT_ID'),
                  'expected_role_arn': os.environ.get('R4_ROLE_ARN'),
                  'configure_aws_outcome': os.environ.get('CONFIGURE_OUTCOME'),
                  'session_policy': 'DENY_ALL_S3_ON_ALL_RESOURCES',
                  's3_requests_authorized': False,
                  's3_http_request_count': 0,
                  'requester_pays_authorized': False,
                  'object_body_download_authorized': False,
                  'decompression_authorized': False,
                  'body_release_consumed_by_preflight': False,
                  'body_execution_activation_authorized': False,
              }
              context_path.write_text(json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          if not result_path.is_file():
              result = {
                  'schema_version': '1.0',
                  'preflight_id': 'HL-ARCHIVE-R4-DEDICATED-ROLE-STS-PREFLIGHT-001',
                  'terminal_status': 'R4_ROLE_STS_PREFLIGHT_NOT_COMPLETED',
                  'technical_result': 'PRE_OIDC_OR_AWS_AUTHENTICATION_OR_STS_FAILURE',
                  'account_id': None,
                  'role_session_arn': None,
                  'session_policy': 'DENY_ALL_S3_ON_ALL_RESOURCES',
                  'explicit_sts_caller_identity_calls': 0,
                  's3_http_request_count': 0,
                  'requester_pays_requested': False,
                  'object_body_downloaded': False,
                  'object_bytes_downloaded': 0,
                  'decompression_performed': False,
                  'raw_oidc_token_retained': False,
                  'aws_credentials_retained': False,
                  'raw_caller_identity_retained': False,
                  'body_release_consumed_by_preflight': False,
                  'body_execution_activation_authorized': False,
                  'empirical_result': None,
              }
              result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          rc_path = root / 'r4-role-preflight.rc'
          if not rc_path.exists():
              rc_path.write_text('NOT_RUN\n', encoding='utf-8')
          PY
          cd "${RUNNER_TEMP}"
          sha256sum r4-role-preflight-context.json r4-role-preflight-result.json r4-role-preflight.rc >R4_ROLE_PREFLIGHT_FILES.sha256

      - name: Upload minimized R4 STS preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperliquid-r4-role-sts-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r4-role-preflight-context.json
            ${{ runner.temp }}/r4-role-preflight-result.json
            ${{ runner.temp }}/r4-role-preflight.rc
            ${{ runner.temp }}/R4_ROLE_PREFLIGHT_FILES.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false

      - name: Enforce exact successful R4 STS preflight result
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          set -euo pipefail
          test "${CONFIGURE_OUTCOME}" = 'success'
          test "$(cat "${RUNNER_TEMP}/r4-role-preflight.rc")" = '0'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'r4-role-preflight-result.json').read_text(encoding='utf-8'))
          assert result['terminal_status'] == 'R4_ROLE_STS_PREFLIGHT_PASS'
          assert result['technical_result'] == 'DEDICATED_R4_ROLE_ASSUMEABLE_FROM_CANONICAL_MAIN'
          assert result['account_id'] == '630956766927'
          assert result['role_session_arn'].startswith('arn:aws:sts::630956766927:assumed-role/onchain-wallet-intelligence-hl-archive-body-schema-r4/')
          assert result['role_session_arn'].endswith('/HLArchiveR4RolePreflight')
          assert result['session_policy'] == 'DENY_ALL_S3_ON_ALL_RESOURCES'
          assert result['explicit_sts_caller_identity_calls'] == 1
          assert result['s3_http_request_count'] == 0
          assert result['requester_pays_requested'] is False
          assert result['object_body_downloaded'] is False
          assert result['object_bytes_downloaded'] == 0
          assert result['decompression_performed'] is False
          assert result['raw_oidc_token_retained'] is False
          assert result['aws_credentials_retained'] is False
          assert result['raw_caller_identity_retained'] is False
          assert result['body_release_consumed_by_preflight'] is False
          assert result['body_execution_activation_authorized'] is False
          assert result['empirical_result'] is None
          PY
