name: Transient R10D PR Seal

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  seal:
    if: github.repository == 'Mathisve1/onchain-wallet-intelligence-lab' && github.event.pull_request.head.ref == 'research/r10d-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact R10D implementation head with write credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10d-implementation
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact PR head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" = 'research/r10d-implementation'

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Repair immutable role-attestation checks in frozen workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('research/archive_inventory/r10d_implementation/workflows/hyperliquid-archive-r10d-record-anchored-multihour-feature.yml')
          text = path.read_text(encoding='utf-8')
          old = """          assert role['status']=='ATTESTED_EXACT_R10_ROLE'\n          assert role['role_arn']==expected_role\n          assert role['existing_r4_role_modified'] is False"""
          new = """          assert role['attestation_id']=='R10_DEDICATED_ROLE_OPERATOR_ATTESTATION'\n          assert role['role_arn']==expected_role\n          assert role['role_created_and_policies_applied'] is True\n          assert role['installed_trust_policy_matches_canonical'] is True\n          assert role['installed_permission_policy_matches_canonical'] is True\n          assert role['additional_managed_policies_attached'] is False\n          assert role['additional_inline_policies_attached'] is False\n          assert role['existing_r4_role_modified'] is False\n          assert role['operator_attested'] is True"""
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate exact R10D implementation before sealing
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_r10d_record_anchored_boundary_repair_preregistration.py
          python governance/validate_r10d_approval.py
          python governance/validate_r10d_implementation.py
          python -m unittest discover -s tests -p 'test_archive_inventory_r10d*.py' -v

      - name: Remove transient workflows and seal exact repository manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/transient-r10d-pr-seal.yml
          rm -- .github/workflows/transient-r10d-implementation-manifest.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          git add -A
          git diff --cached --check

      - name: Commit and push sealed R10D implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: seal exact R10D implementation'
          git push origin HEAD:research/r10d-implementation
