name: R10A Execution Evidence Finalizer 2

on:
  push:
    branches: [research/r10a-execution-evidence]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10a-execution-evidence
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Remove transient finalizer and trigger
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r10a-execution-evidence-finalizer2.yml
          git rm -f .r10a-execution-evidence-finalizer2-trigger || true
      - name: Regenerate manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate R10A evidence
        run: python governance/validate_r10a_execution_evidence.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: python governance/validate_repository.py
      - name: Commit finalized snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: finalize exact R10A execution evidence"
          git push origin HEAD:research/r10a-execution-evidence
