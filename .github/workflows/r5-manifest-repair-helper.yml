name: R5 Manifest Repair Helper

on:
  push:
    branches:
      - research/r5-legacy-format-implementation
    paths:
      - .github/workflows/r5-manifest-repair-helper.yml

permissions:
  contents: write

jobs:
  repair-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact feature-branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Self-delete helper and regenerate canonical manifest
        shell: bash
        env:
          EXPECTED_REF: refs/heads/research/r5-legacy-format-implementation
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rm .github/workflows/r5-manifest-repair-helper.yml
          python3 governance/regenerate_manifest.py --write
          python3 governance/regenerate_manifest.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code >/dev/null && exit 1 || true
          git commit -m "governance: regenerate exact R5 implementation manifest"
          git push origin HEAD:research/r5-legacy-format-implementation
