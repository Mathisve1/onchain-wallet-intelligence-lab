name: R10A Preregistration Refinalizer

on:
  push:
    branches: [research/r10a-timestamp-partition-prereg]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10a-timestamp-partition-prereg
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Remove transient workflow before manifest generation
        run: git rm .github/workflows/r10a-prereg-refinalizer.yml
      - name: Regenerate canonical repository manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate R10A preregistration
        run: python governance/validate_r10a_timestamp_partition_preregistration.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py
      - name: Commit finalized manifest and self-deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: refreeze exact R10A preregistration"
          git push origin HEAD:research/r10a-timestamp-partition-prereg
