name: Apply verified probe R1 payload

on:
  push:
    branches:
      - research/hyperliquid-public-probe-r1-20260807
    paths:
      - .bootstrap/TRIGGER
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - .bootstrap/**
      - .github/workflows/bootstrap-probe-r1.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-probe-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'bootstrap: apply probe R1 payload'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/hyperliquid-public-probe-r1-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify and reconstruct payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import tarfile

          root = Path('.').resolve()
          manifest = json.loads((root / '.bootstrap/manifest.json').read_text())
          parts = sorted((root / '.bootstrap').glob('part-*'))
          assert len(parts) == manifest['part_count'], (len(parts), manifest['part_count'])
          encoded = b''.join(path.read_bytes() for path in parts)
          assert hashlib.sha256(encoded).hexdigest() == manifest['payload_base64_sha256']
          archive = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive).hexdigest() == manifest['payload_tar_gz_sha256']
          archive_path = Path('/tmp/probe-r1-payload.tar.gz')
          archive_path.write_bytes(archive)

          with tarfile.open(archive_path, 'r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members if member.isfile()]
              assert names == manifest['files'], (names, manifest['files'])
              for member in members:
                  path = Path(member.name)
                  assert not path.is_absolute()
                  assert '..' not in path.parts
                  assert member.isfile()
              handle.extractall(root, filter='data')
          PY

      - name: Run complete local gates on reconstructed tree
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep -F 'Python 3.12.13'
          python -m unittest discover -s tests -v
          python governance/validate_probe_evidence.py
          python governance/validate_repository.py
          python -m py_compile \
            governance/validate_probe_evidence.py \
            governance/validate_repository.py \
            research/wallet_copyability/scripts/probe_public_api.py \
            src/wallet_intelligence/*.py \
            tests/*.py

      - name: Commit exact clean research tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-probe-r1.yml
          git add -A
          actual_tree=$(git write-tree)
          expected_tree=13dd97df4e4f4416ffc68c477dc36cfeaeea49a3
          test "$actual_tree" = "$expected_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: harden Hyperliquid public probe R1'
          git push origin HEAD:research/hyperliquid-public-probe-r1-20260807
