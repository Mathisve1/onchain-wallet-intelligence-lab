name: Research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-r10b-approval:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/r10b-approval'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10b-approval
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Restore canonical read-only Research CI and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .r10b-approval-ci-trigger || true
      - name: Regenerate exact repository manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate R10B preregistration remains inert
        run: python governance/validate_r10b_batch_metadata_lexical_preregistration.py
      - name: Validate R10B approval overlay
        run: python governance/validate_r10b_approval.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py
      - name: Commit finalized snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: freeze exact R10B approval"
          git push origin HEAD:research/r10b-approval
