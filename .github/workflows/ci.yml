name: Research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact CI commit identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXACT_CI_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          observed="$(git rev-parse HEAD)"
          test "${observed}" = "${EXACT_CI_COMMIT}"
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Run unit and mutation tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py

  r11-operator-attestation-seal:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 131 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11-operator-attestation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact R11 attestation head with write credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact transient seal identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'Mathisve1/onchain-wallet-intelligence-lab'
          test "${GITHUB_HEAD_REF}" = 'research/r11-operator-attestation'
          test "$(git rev-parse HEAD)" = "${EXACT_CI_COMMIT}"
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Restore canonical CI and regenerate exact manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/ci.yml <<'YAML'
          name: Research CI

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          env:
            EXACT_CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

          jobs:
            test:
              runs-on: ubuntu-24.04
              timeout-minutes: 10
              steps:
                - name: Check out exact CI commit
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    ref: ${{ env.EXACT_CI_COMMIT }}
                    fetch-depth: 1
                    persist-credentials: false
                - name: Verify exact CI commit identity
                  shell: bash
                  run: |
                    set -euo pipefail
                    [[ "${EXACT_CI_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
                    observed="$(git rev-parse HEAD)"
                    test "${observed}" = "${EXACT_CI_COMMIT}"
                - name: Set up pinned Python
                  uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
                  with:
                    python-version: '3.12.13'
                    check-latest: false
                - name: Run unit and mutation tests
                  run: python -m unittest discover -s tests -v
                - name: Validate repository governance
                  run: python governance/validate_repository.py
          YAML
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python governance/validate_r11_role_attestation.py
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          git add -A
          git diff --cached --check
      - name: Commit sealed attestation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: seal exact R11 operator attestation'
          git push origin HEAD:research/r11-operator-attestation
