name: Research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXACT_CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact CI commit identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXACT_CI_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          observed="$(git rev-parse HEAD)"
          test "${observed}" = "${EXACT_CI_COMMIT}"
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${GITHUB_HEAD_REF}" = "research/r7-wallet-index-implementation"
      - name: Restore canonical CI and regenerate exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python governance/regenerate_manifest.py --write
          test "$(git show origin/main:.github/workflows/ci.yml | sha256sum | cut -d' ' -f1)" = "$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)"
          git add .github/workflows/ci.yml governance/REPOSITORY_MANIFEST.sha256
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Run unit and mutation tests on final tree
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance on final tree
        run: |
          python governance/validate_r7_preregistration.py
          python governance/validate_r7_approval.py
          python governance/validate_r7_implementation.py
          python governance/validate_repository.py
      - name: Commit and push only canonical CI plus exact manifest repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "${changed}"
          test "$(printf '%s\n' "${changed}" | grep -c '^\.github/workflows/ci.yml$')" -eq 1
          test "$(printf '%s\n' "${changed}" | grep -c '^governance/REPOSITORY_MANIFEST.sha256$')" -eq 1
          test "$(printf '%s\n' "${changed}" | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: finalize exact inert R7 implementation manifest'
          git push origin HEAD:research/r7-wallet-index-implementation
