name: Research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact CI commit identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXACT_CI_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          observed="$(git rev-parse HEAD)"
          test "${observed}" = "${EXACT_CI_COMMIT}"
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Run unit and mutation tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py

  r11-attestation-manifest-seal:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 131 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11-operator-attestation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact attestation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Generate manifest against canonical CI bytes only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          dollar = '$'
          canonical = f'''name: Research CI

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          env:
            EXACT_CI_COMMIT: {dollar}{{{{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}}}

          jobs:
            test:
              runs-on: ubuntu-24.04
              timeout-minutes: 10
              steps:
                - name: Check out exact CI commit
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    ref: {dollar}{{{{ env.EXACT_CI_COMMIT }}}}
                    fetch-depth: 1
                    persist-credentials: false
                - name: Verify exact CI commit identity
                  shell: bash
                  run: |
                    set -euo pipefail
                    [[ "{dollar}{{EXACT_CI_COMMIT}}" =~ ^[0-9a-f]{{40}}$ ]]
                    observed="$(git rev-parse HEAD)"
                    test "{dollar}{{observed}}" = "{dollar}{{EXACT_CI_COMMIT}}"
                - name: Set up pinned Python
                  uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
                  with:
                    python-version: '3.12.13'
                    check-latest: false
                - name: Run unit and mutation tests
                  run: python -m unittest discover -s tests -v
                - name: Validate repository governance
                  run: python governance/validate_repository.py
          '''
          canonical = ''.join(line[10:] if line.startswith('          ') else line for line in canonical.splitlines(keepends=True))
          Path('.github/workflows/ci.yml').write_text(canonical, encoding='utf-8')
          PY
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python governance/validate_r11_role_attestation.py
          git checkout -- .github/workflows/ci.yml
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
      - name: Commit manifest-only seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Manifest already sealed'
            exit 0
          fi
          git commit -m 'ci: seal R11 operator attestation manifest'
          git push origin HEAD:research/r11-operator-attestation
