name: Research CI

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_CI_COMMIT: ${{ github.event.pull_request.head.sha }}

jobs:
  test:
    if: github.event.pull_request.head.ref == 'research/r8b-legacy-modern-cutover-forensics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact R8B source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact R8B source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_CI_COMMIT}"
      - name: Restore canonical CI and regenerate exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python governance/regenerate_manifest.py --write
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Validate final R8B static tree
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python governance/validate_r8b_cutover_forensics.py
          python governance/validate_repository.py
      - name: Commit canonical CI plus exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: finalize exact R8B static tree'
          git push origin HEAD:research/r8b-legacy-modern-cutover-forensics
