name: Research CI

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_CI_COMMIT: ${{ github.event.pull_request.head.sha }}

jobs:
  test:
    if: github.event.pull_request.head.ref == 'research/r9-modern-wallet-feature-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact R9 release head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_CI_COMMIT}"
      - name: Make prior R9 snapshots release-aware and restore canonical CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('governance/validate_r9_preregistration.py')
          text = p.read_text(encoding='utf-8')
          old = '''    assert not (R9 / "R9_EXECUTION_RELEASE.json").exists()\n    assert not (R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json").exists()\n'''
          new = '''    release_path = R9 / "R9_EXECUTION_RELEASE.json"\n    if release_path.exists():\n        release = load(release_path)\n        assert release["status"] == "RELEASE_CANDIDATE_AWAITING_CANONICAL_ACTIVATION"\n        assert release["execution_ready"] is False\n        assert release["single_workflow_dispatch_authorized"] is False\n        assert release["rerun_authorized"] is False\n        assert release["s3_requests_executed"] == 0\n        assert release["wallet_feature_rows_created"] == 0\n        assert release["empirical_result"] is None\n    assert not (R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json").exists()\n'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')

          for filename in ('tests/test_archive_inventory_r9_preregistration.py', 'tests/test_archive_inventory_r9_implementation.py'):
              q = Path(filename)
              tests = q.read_text(encoding='utf-8')
              old_test = '''        self.assertFalse((R9 / "R9_EXECUTION_RELEASE.json").exists())\n        self.assertFalse((R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n'''
              new_test = '''        release_path = R9 / "R9_EXECUTION_RELEASE.json"\n        if release_path.exists():\n            release = self.load("R9_EXECUTION_RELEASE.json")\n            self.assertEqual(release["status"], "RELEASE_CANDIDATE_AWAITING_CANONICAL_ACTIVATION")\n            self.assertFalse(release["execution_ready"])\n            self.assertFalse(release["single_workflow_dispatch_authorized"])\n            self.assertFalse(release["rerun_authorized"])\n            self.assertEqual(release["s3_requests_executed"], 0)\n            self.assertEqual(release["wallet_feature_rows_created"], 0)\n            self.assertIsNone(release["empirical_result"])\n        self.assertFalse((R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n'''
              assert tests.count(old_test) == 1, filename
              q.write_text(tests.replace(old_test, new_test), encoding='utf-8')
          PY
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python governance/regenerate_manifest.py --write
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Validate final R9 release tree
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python governance/validate_r9_preregistration.py
          python governance/validate_r9_approval.py
          python governance/validate_r9_implementation.py
          python governance/validate_r9_release.py
          python governance/validate_repository.py
      - name: Commit canonical CI plus exact release tree
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml governance/validate_r9_preregistration.py tests/test_archive_inventory_r9_preregistration.py tests/test_archive_inventory_r9_implementation.py governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: finalize exact inert R9 release tree'
          git push origin HEAD:research/r9-modern-wallet-feature-release
