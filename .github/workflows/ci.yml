name: Research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact CI commit identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXACT_CI_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          observed="$(git rev-parse HEAD)"
          test "${observed}" = "${EXACT_CI_COMMIT}"
      - name: Set up pinned Python
        id: pinned_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Prepare and verify source-built native boundary
        shell: bash
        env:
          R11A_NATIVE_ENV_FILE: ${{ runner.temp }}/r11a-native-boundary.env
          R11A_SETUP_PYTHON_VERSION: ${{ steps.pinned_python.outputs['python-version'] }}
          R11A_SETUP_PYTHON_PATH: ${{ steps.pinned_python.outputs['python-path'] }}
        run: |
          set -euo pipefail
          governance/r11a_native_boundary.sh setup-python prepare "${R11A_NATIVE_ENV_FILE}"
          source "${R11A_NATIVE_ENV_FILE}"
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          while IFS= read -r boundary_variable; do
            printf '%s\n' "${boundary_variable#export }" >> "${GITHUB_ENV}"
          done < "${R11A_NATIVE_ENV_FILE}"
      - name: Run focused normal and optimized import-isolation tests
        shell: bash
        env:
          R11A_NATIVE_ENV_FILE: ${{ runner.temp }}/r11a-native-boundary.env
          R11A_SETUP_PYTHON_VERSION: ${{ steps.pinned_python.outputs['python-version'] }}
          R11A_SETUP_PYTHON_PATH: ${{ steps.pinned_python.outputs['python-path'] }}
        run: |
          set -euo pipefail
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            python -m unittest tests.test_archive_inventory_r11a_g2_owner_approval -v
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            python -O -m unittest tests.test_archive_inventory_r11a_g2_owner_approval -v
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            python -m unittest tests.test_archive_inventory_r11a_post_approval_validator_alignment -v
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            python -O -m unittest tests.test_archive_inventory_r11a_post_approval_validator_alignment -v
      - name: Run complete bytecode-enabled verification
        shell: bash
        env:
          R11A_NATIVE_ENV_FILE: ${{ runner.temp }}/r11a-native-boundary.env
          R11A_SETUP_PYTHON_VERSION: ${{ steps.pinned_python.outputs['python-version'] }}
          R11A_SETUP_PYTHON_PATH: ${{ steps.pinned_python.outputs['python-path'] }}
        run: |
          set -euo pipefail
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            python -m unittest discover -s tests -v
      - name: Run complete bytecode-disabled control
        shell: bash
        env:
          R11A_NATIVE_ENV_FILE: ${{ runner.temp }}/r11a-native-boundary.env
          R11A_SETUP_PYTHON_VERSION: ${{ steps.pinned_python.outputs['python-version'] }}
          R11A_SETUP_PYTHON_PATH: ${{ steps.pinned_python.outputs['python-path'] }}
        run: |
          set -euo pipefail
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            python -B -m unittest discover -s tests -v
      - name: Validate repository governance
        shell: bash
        env:
          R11A_NATIVE_ENV_FILE: ${{ runner.temp }}/r11a-native-boundary.env
          R11A_SETUP_PYTHON_VERSION: ${{ steps.pinned_python.outputs['python-version'] }}
          R11A_SETUP_PYTHON_PATH: ${{ steps.pinned_python.outputs['python-path'] }}
        run: |
          set -euo pipefail
          governance/r11a_native_boundary.sh setup-python verify "${R11A_NATIVE_ENV_FILE}"
          env -u PYTHONDONTWRITEBYTECODE -u PYTHONPYCACHEPREFIX \
            python governance/validate_repository.py
      - name: Verify the R11A implementation seal
        shell: bash
        run: |
          set -euo pipefail
          # The contract hashes every sealed file, including the tests that
          # lock the implementation. A sealed file edited without a re-seal
          # is drift this job must fail on: the seal is only worth having if
          # CI refuses a commit that breaks it.
          python governance/seal_r11a_implementation.py --check
      - name: Clean source-built native boundary
        if: always()
        shell: bash
        env:
          R11A_NATIVE_ENV_FILE: ${{ runner.temp }}/r11a-native-boundary.env
          R11A_SETUP_PYTHON_VERSION: ${{ steps.pinned_python.outputs['python-version'] }}
          R11A_SETUP_PYTHON_PATH: ${{ steps.pinned_python.outputs['python-path'] }}
        run: |
          set -euo pipefail
          if [[ -e "${R11A_NATIVE_ENV_FILE}" || -L "${R11A_NATIVE_ENV_FILE}" ]]; then
            governance/r11a_native_boundary.sh setup-python cleanup "${R11A_NATIVE_ENV_FILE}"
          fi
