name: Research CI

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_CI_COMMIT: ${{ github.event.pull_request.head.sha }}

jobs:
  test:
    if: github.event.pull_request.head.ref == 'research/r9-modern-wallet-feature-activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact R9 activation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_CI_COMMIT}"
      - name: Make prior R9 snapshots activation-aware and restore canonical CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Preregistration validator: later activation may exist, but preregistration remains inert.
          p = Path('governance/validate_r9_preregistration.py')
          text = p.read_text(encoding='utf-8')
          old = '''    assert not (R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json").exists()\n'''
          new = '''    activation_path = R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json"\n    if activation_path.exists():\n        activation = load(activation_path)\n        assert release_path.exists()\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R9_RUN"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["release_consumed"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["wallet_feature_rows_created"] == 0\n        assert activation["empirical_result"] is None\n'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')

          # Implementation validator: immutable implementation may be followed by a separate activation.
          p = Path('governance/validate_r9_implementation.py')
          text = p.read_text(encoding='utf-8')
          old = '''    assert not ACTIVATION.exists()\n'''
          new = '''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert RELEASE.exists()\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R9_RUN"\n        assert activation["canonical_implementation_merge_commit"] == "35afca156a99cc71360b338968cb842f9f31ab3b"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["release_consumed"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["wallet_feature_rows_created"] == 0\n        assert activation["empirical_result"] is None\n'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')

          # Release validator: candidate remains immutable while a separate activation can open one dispatch.
          p = Path('governance/validate_r9_release.py')
          text = p.read_text(encoding='utf-8')
          old = '''    assert not ACTIVATION.exists()\n'''
          new = '''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["release_id"] == release["release_id"]\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R9_RUN"\n        assert activation["candidate_sha256"] == sha(RELEASE)\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["release_consumed"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["wallet_feature_rows_created"] == 0\n        assert activation["empirical_result"] is None\n'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')

          # Prior stage tests become activation-aware without rewriting the immutable stage snapshots.
          for filename in (
              'tests/test_archive_inventory_r9_preregistration.py',
              'tests/test_archive_inventory_r9_implementation.py',
              'tests/test_archive_inventory_r9_release.py',
          ):
              q = Path(filename)
              tests = q.read_text(encoding='utf-8')
              old_test = '''        self.assertFalse((R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n'''
              new_test = '''        activation_path = R9 / "R9_EXECUTION_RELEASE_CANONICALIZATION.json"\n        if activation_path.exists():\n            activation = self.load("R9_EXECUTION_RELEASE_CANONICALIZATION.json")\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R9_RUN")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertFalse(activation["release_consumed"])\n            self.assertEqual(activation["s3_requests_executed"], 0)\n            self.assertEqual(activation["wallet_feature_rows_created"], 0)\n            self.assertIsNone(activation["empirical_result"])\n'''
              assert tests.count(old_test) == 1, filename
              q.write_text(tests.replace(old_test, new_test), encoding='utf-8')
          PY
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python governance/regenerate_manifest.py --write
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Validate final R9 activation tree
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python governance/validate_r9_preregistration.py
          python governance/validate_r9_approval.py
          python governance/validate_r9_implementation.py
          python governance/validate_r9_release.py
          python governance/validate_r9_activation.py
          python governance/validate_repository.py
      - name: Commit canonical CI plus exact activation tree
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml governance/validate_r9_preregistration.py governance/validate_r9_implementation.py governance/validate_r9_release.py tests/test_archive_inventory_r9_preregistration.py tests/test_archive_inventory_r9_implementation.py tests/test_archive_inventory_r9_release.py governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'activation: finalize exact R9 single-use tree'
          git push origin HEAD:research/r9-modern-wallet-feature-activation
