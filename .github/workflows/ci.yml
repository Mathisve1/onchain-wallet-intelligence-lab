name: Research CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-r10b-execution-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/r10b-execution-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10b-execution-evidence
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Restore exact canonical Research CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin de5f6ff5aabcb40650fa8c1f9b94dd305e9ff556
          git show de5f6ff5aabcb40650fa8c1f9b94dd305e9ff556:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Regenerate exact repository manifest
        run: python governance/regenerate_manifest.py --write
      - name: Validate R10B execution evidence
        run: python governance/validate_r10b_execution_evidence.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Validate repository governance
        run: python governance/validate_repository.py
      - name: Commit finalized snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: freeze exact R10B execution evidence"
          git push origin HEAD:research/r10b-execution-evidence
