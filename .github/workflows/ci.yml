name: Research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - run: python -m unittest discover -s tests -v
      - run: python governance/validate_repository.py

  apply-probe-r1-payload:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/hyperliquid-public-probe-r1-20260807'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/hyperliquid-public-probe-r1-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify, extract and test SHA-bound payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import tarfile

          root = Path('.').resolve()
          manifest = json.loads((root / '.bootstrap/manifest.json').read_text())
          parts = sorted((root / '.bootstrap').glob('part-*'))
          assert len(parts) == manifest['part_count'], (len(parts), manifest['part_count'])
          encoded = b''.join(path.read_bytes() for path in parts)
          assert hashlib.sha256(encoded).hexdigest() == manifest['payload_base64_sha256']
          archive = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive).hexdigest() == manifest['payload_tar_gz_sha256']
          archive_path = Path('/tmp/probe-r1-payload.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, 'r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members if member.isfile()]
              assert names == manifest['files'], (names, manifest['files'])
              for member in members:
                  path = Path(member.name)
                  assert not path.is_absolute()
                  assert '..' not in path.parts
                  assert member.isfile()
              handle.extractall(root, filter='data')
          PY
          python -m unittest discover -s tests -v
          python governance/validate_probe_evidence.py
          python governance/validate_repository.py
          python -m py_compile \
            governance/validate_probe_evidence.py \
            governance/validate_repository.py \
            research/wallet_copyability/scripts/probe_public_api.py \
            src/wallet_intelligence/*.py \
            tests/*.py

      - name: Commit exact clean research tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-probe-r1.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add -A
          actual_tree=$(git write-tree)
          expected_tree=13dd97df4e4f4416ffc68c477dc36cfeaeea49a3
          test "$actual_tree" = "$expected_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: harden Hyperliquid public probe R1'
          git push origin HEAD:research/hyperliquid-public-probe-r1-20260807
