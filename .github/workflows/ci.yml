name: Research CI

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_CI_COMMIT: ${{ github.event.pull_request.head.sha }}

jobs:
  test:
    if: github.event.pull_request.head.ref == 'research/r8a-modern-wallet-index-activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact R8A activation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_CI_COMMIT }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_CI_COMMIT}"
      - name: Make prior R8A snapshots activation-aware and restore canonical CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Implementation validator: immutable implementation stays inert while a separate activation may exist.
          path = Path('governance/validate_r8a_implementation.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert not ACTIVATION.exists()\n    print("R8A_IMPLEMENTATION_VALID")\n'''
          new = '''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["release_id"] == "RELEASE_HL_ARCHIVE_MODERN_WALLET_INDEX_BRIDGE_R8A_001"\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R8A_RUN"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["release_consumed"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["wallet_addresses_retained"] == 0\n        assert activation["empirical_result"] is None\n    print("R8A_IMPLEMENTATION_VALID")\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/test_archive_inventory_r8a_implementation.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''        self.assertFalse((R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n\n    def test_future_retention_matches_approved_minimum'''
          new_test = '''        activation_path = R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json"\n        if activation_path.exists():\n            activation = self.load(activation_path)\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R8A_RUN")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertFalse(activation["release_consumed"])\n            self.assertEqual(activation["s3_requests_executed"], 0)\n            self.assertEqual(activation["wallet_addresses_retained"], 0)\n            self.assertIsNone(activation["empirical_result"])\n\n    def test_future_retention_matches_approved_minimum'''
          assert tests.count(old_test) == 1
          test_path.write_text(tests.replace(old_test, new_test), encoding='utf-8')

          # Static R8 design remains non-executing even while a separate R8A activation exists.
          design_path = Path('governance/validate_r8_design.py')
          design = design_path.read_text(encoding='utf-8')
          old_design = '''    assert not (R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json").exists()\n\n    print("R8_STATIC_DESIGN_VALID")\n'''
          new_design = '''    activation_path = R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json"\n    if activation_path.exists():\n        activation = load(activation_path)\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R8A_RUN"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["release_consumed"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["wallet_addresses_retained"] == 0\n        assert activation["empirical_result"] is None\n\n    print("R8_STATIC_DESIGN_VALID")\n'''
          assert design.count(old_design) == 1
          design_path.write_text(design.replace(old_design, new_design), encoding='utf-8')

          r8_tests_path = Path('tests/test_archive_inventory_r8_design.py')
          r8_tests = r8_tests_path.read_text(encoding='utf-8')
          old_r8_test = '''        self.assertFalse((R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n\n    def test_dedicated_r8_validator_passes'''
          new_r8_test = '''        activation_path = R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json"\n        if activation_path.exists():\n            activation = self.load(activation_path)\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R8A_RUN")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertFalse(activation["release_consumed"])\n            self.assertEqual(activation["s3_requests_executed"], 0)\n            self.assertEqual(activation["wallet_addresses_retained"], 0)\n            self.assertIsNone(activation["empirical_result"])\n\n    def test_dedicated_r8_validator_passes'''
          assert r8_tests.count(old_r8_test) == 1
          r8_tests_path.write_text(r8_tests.replace(old_r8_test, new_r8_test), encoding='utf-8')

          # Inert release candidate remains immutable while a separate activation opens one dispatch.
          release_path = Path('governance/validate_r8a_release.py')
          release_text = release_path.read_text(encoding='utf-8')
          old_release = '''    assert not ACTIVATION.exists()\n    print("R8A_RELEASE_CANDIDATE_VALID")\n'''
          new_release = '''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["release_id"] == release["release_id"]\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R8A_RUN"\n        assert activation["candidate_sha256"] == sha(RELEASE)\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["release_consumed"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["wallet_addresses_retained"] == 0\n        assert activation["empirical_result"] is None\n    print("R8A_RELEASE_CANDIDATE_VALID")\n'''
          assert release_text.count(old_release) == 1
          release_path.write_text(release_text.replace(old_release, new_release), encoding='utf-8')

          release_tests_path = Path('tests/test_archive_inventory_r8a_release.py')
          release_tests = release_tests_path.read_text(encoding='utf-8')
          old_release_test = '''        self.assertFalse((R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n        self.assertEqual(release["s3_requests_executed"], 0)\n'''
          new_release_test = '''        activation_path = R8 / "R8A_EXECUTION_RELEASE_CANONICALIZATION.json"\n        if activation_path.exists():\n            activation = self.load(activation_path)\n            self.assertEqual(activation["release_id"], release["release_id"])\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R8A_RUN")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertFalse(activation["release_consumed"])\n        self.assertEqual(release["s3_requests_executed"], 0)\n'''
          assert release_tests.count(old_release_test) == 1
          release_tests_path.write_text(release_tests.replace(old_release_test, new_release_test), encoding='utf-8')
          PY
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python governance/regenerate_manifest.py --write
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Validate final R8A activation tree
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python governance/validate_r8_design.py
          python governance/validate_r8a_approval.py
          python governance/validate_r8a_implementation.py
          python governance/validate_r8a_release.py
          python governance/validate_r8a_activation.py
          python governance/validate_repository.py
      - name: Commit and push canonical CI plus exact activation tree
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml governance/validate_r8_design.py governance/validate_r8a_implementation.py governance/validate_r8a_release.py tests/test_archive_inventory_r8_design.py tests/test_archive_inventory_r8a_implementation.py tests/test_archive_inventory_r8a_release.py governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'activation: finalize exact R8A single-use tree'
          git push origin HEAD:research/r8a-modern-wallet-index-activation
