name: Hyperliquid Archive NodeData Canary R2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-nodedata-canary-r2
  cancel-in-progress: false

env:
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  EXPECTED_AWS_ACCOUNT_ID: '630956766927'
  EXPECTED_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-metadata-canary
  PREREGISTRATION_COMMIT: 39b40cccc7e9a3fdbc439d06fb188e946d9da2aa
  APPROVAL_MERGE_COMMIT: 151e08f54037ca7d3a0a9c17d3bdfb84d707a66e
  APPROVAL_ID: APPROVE_HL_ARCHIVE_NODEDATA_CANARY_R2_001
  APPROVAL_TEXT_SHA256: 728f4e21c045eb10e883bdf0f2e970686f0e6b6cc4dc67a4f214a882cf1831c6
  EXPECTED_IMPLEMENTATION_COMMIT: 142ce50be20507761c4cce37b325ac69d57f8b25
  EXECUTION_RELEASE_PATH: research/archive_inventory/r2/R2_EXECUTION_RELEASE.json
  SUCCESSOR_EXECUTION_RELEASE_PATH: research/archive_inventory/r2/R2_EXECUTION_RELEASE_002.json
  PREDECESSOR_CONSUMPTION_PATH: research/archive_inventory/r2/R2_EXECUTION_RELEASE_001_CONSUMPTION.json
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  nodedata-canary-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out canonical dispatch SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DISPATCH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical manual main dispatch and checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          observed_head="$(git rev-parse HEAD)"
          printf 'EVENT_NAME=%s\n' "${EVENT_NAME}"
          printf 'DISPATCH_REF=%s\n' "${DISPATCH_REF}"
          printf 'DISPATCH_SHA=%s\n' "${DISPATCH_SHA}"
          printf 'CHECKED_OUT_HEAD=%s\n' "${observed_head}"

          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error title=R2 identity gate 41::Expected workflow_dispatch, observed ${EVENT_NAME}"
            exit 41
          fi
          if [[ "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "::error title=R2 identity gate 42::Expected refs/heads/main, observed ${DISPATCH_REF}"
            exit 42
          fi
          if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=R2 identity gate 43::github.sha is not exactly 40 lowercase hexadecimal characters"
            exit 43
          fi
          if [[ "${observed_head}" != "${DISPATCH_SHA}" ]]; then
            echo "::error title=R2 identity gate 44::Checked-out HEAD ${observed_head} differs from github.sha ${DISPATCH_SHA}"
            exit 44
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Prove canonical implementation and single-use release before AWS OIDC
        shell: bash
        run: |
          set -euo pipefail
          python --version | grep -F 'Python 3.12.13'
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_r2_implementation.py
          python governance/validate_r2_successor_release.py
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path('.')
          base = root / 'research/archive_inventory/r2'
          approval_text = base / 'approvals/APPROVE_HL_ARCHIVE_NODEDATA_CANARY_R2_001.txt'
          approval = json.loads((base / 'approvals/APPROVE_HL_ARCHIVE_NODEDATA_CANARY_R2_001.json').read_text(encoding='utf-8'))
          impl = json.loads((base / 'R2_IMPLEMENTATION_CONTRACT.json').read_text(encoding='utf-8'))
          predecessor = json.loads((root / os.environ['EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))
          consumption = json.loads((root / os.environ['PREDECESSOR_CONSUMPTION_PATH']).read_text(encoding='utf-8'))
          release = json.loads((root / os.environ['SUCCESSOR_EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))

          assert hashlib.sha256(approval_text.read_bytes()).hexdigest() == os.environ['APPROVAL_TEXT_SHA256']
          assert approval['approval_id'] == os.environ['APPROVAL_ID']
          assert approval['reviewed_commit'] == os.environ['PREREGISTRATION_COMMIT']
          assert approval['exact_approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert approval['maximum_one_time_budget_eur'] == 0.10
          assert approval['maximum_monthly_budget_eur'] == 0
          assert approval['maximum_list_requests'] == 5
          assert approval['maximum_keys_per_request'] == 25
          assert approval['maximum_total_entries'] == 125
          assert approval['maximum_total_response_bytes'] == 8388608
          assert approval['maximum_runtime_seconds'] == 120
          assert approval['maximum_retries_per_request'] == 0
          assert approval['pagination_authorized'] is False
          assert approval['http_redirect_following_authorized'] is False
          assert approval['requester_pays_scope_approved'] is True
          assert approval['list_objects_v2_scope_approved'] is True
          assert approval['target_bucket'] == 'hl-mainnet-node-data'
          assert approval['signing_region'] == 'ap-northeast-1'

          assert impl['approval_merge_commit'] == os.environ['APPROVAL_MERGE_COMMIT']
          assert impl['human_approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert impl['target_bucket'] == 'hl-mainnet-node-data'
          assert impl['signing_region'] == 'ap-northeast-1'
          assert impl['regional_virtual_hosted_endpoint'] == 'hl-mainnet-node-data.s3.ap-northeast-1.amazonaws.com'
          assert impl['session_s3_policy'] == 'ALLOW_LISTBUCKET_EXACT_FIVE_PREFIXES_MAX25_ONLY'
          assert impl['execution_release_required'] is True
          assert impl['execution_release_present'] is False
          assert impl['execution_authorized'] is False

          expected = os.environ['EXPECTED_IMPLEMENTATION_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          assert expected == '142ce50be20507761c4cce37b325ac69d57f8b25'

          assert predecessor['release_id'] == 'RELEASE_HL_ARCHIVE_NODEDATA_CANARY_R2_001'
          assert predecessor['status'] == 'RELEASED_FOR_EXACTLY_ONE_CANONICAL_R2_RUN'
          assert predecessor['s3_requests_executed'] == 0
          assert predecessor['metadata_entries_observed'] == 0
          assert predecessor['empirical_result'] is None

          assert consumption['predecessor_release_id'] == predecessor['release_id']
          assert consumption['predecessor_release_merge_commit'] == '0dd6f32ab3a202b0c58f37821d1038ac917d84ce'
          assert consumption['status'] == 'CONSUMED_BY_FIRST_DISPATCH_PRE_OIDC_NO_S3_EXECUTION'
          assert consumption['aws_oidc_role_assumption_step_executed'] is False
          assert consumption['collector_step_executed'] is False
          assert consumption['s3_http_requests_executed'] == 0
          assert consumption['list_objects_v2_requests_executed'] == 0
          assert consumption['metadata_entries_observed'] == 0
          assert consumption['rerun_authorized'] is False
          assert consumption['successor_release_required_for_any_new_dispatch'] is True

          assert release['release_id'] == 'RELEASE_HL_ARCHIVE_NODEDATA_CANARY_R2_002'
          assert release['status'] == 'RELEASED_FOR_EXACTLY_ONE_CANONICAL_R2_SUCCESSOR_RUN_AFTER_MERGE'
          assert release['predecessor_release_id'] == predecessor['release_id']
          assert release['predecessor_release_consumed'] is True
          assert release['predecessor_s3_requests_executed'] == 0
          assert release['implementation_commit'] == expected
          assert release['preregistration_commit'] == os.environ['PREREGISTRATION_COMMIT']
          assert release['approval_merge_commit'] == os.environ['APPROVAL_MERGE_COMMIT']
          assert release['approval_text_sha256'] == os.environ['APPROVAL_TEXT_SHA256']
          assert release['github_event_required'] == 'workflow_dispatch'
          assert release['canonical_dispatch_ref_required'] == 'refs/heads/main'
          assert release['canonical_dispatch_sha_source'] == 'github.sha'
          assert release['manual_reviewed_commit_input_required'] is False
          assert release['target_bucket'] == 'hl-mainnet-node-data'
          assert release['signing_region'] == 'ap-northeast-1'
          assert release['maximum_one_time_budget_eur'] == 0.10
          assert release['maximum_monthly_budget_eur'] == 0
          assert release['maximum_list_requests'] == 5
          assert release['maximum_keys_per_request'] == 25
          assert release['maximum_total_entries'] == 125
          assert release['maximum_total_response_bytes'] == 8388608
          assert release['maximum_runtime_seconds'] == 120
          assert release['maximum_retries_per_request'] == 0
          assert release['pagination_authorized'] is False
          assert release['continuation_token_follow_authorized'] is False
          assert release['http_redirect_following_authorized'] is False
          assert release['requester_pays_authorized'] is True
          assert release['list_objects_v2_authorized'] is True
          assert release['single_workflow_dispatch_authorized'] is True
          assert release['rerun_authorized'] is False
          for key in (
              'get_object_authorized', 'head_object_authorized',
              'get_object_attributes_authorized', 'range_get_authorized',
              'list_object_versions_authorized', 'list_all_my_buckets_authorized',
              'object_body_download_authorized', 'decompression_authorized',
              'market_data_ingestion_authorized', 'larger_300_request_inventory_authorized',
          ):
              assert release[key] is False
          assert release['s3_requests_executed'] == 0
          assert release['metadata_entries_observed'] == 0
          assert release['empirical_result'] is None
          assert all(value is False for value in release['trading_authorizations'].values())
          PY

      - name: Enforce successor single-use release before AWS OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${CURRENT_RUN_ATTEMPT}" != '1' ]]; then
            echo "::error title=R2 successor single-use gate::Run attempt must be 1; re-runs are forbidden"
            exit 51
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          release = json.loads(Path(os.environ['SUCCESSOR_EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))
          start = datetime.fromisoformat(release['single_use_window_start_utc'].replace('Z', '+00:00')).astimezone(timezone.utc)
          repo = os.environ['CURRENT_REPOSITORY']
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'hyperliquid-archive-nodedata-canary-r2.yml/runs'
              '?event=workflow_dispatch&branch=main&per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hl-nodedata-canary-r2-successor-single-use-check',
              },
              method='GET',
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              runs = json.load(response).get('workflow_runs')
          assert isinstance(runs, list) and len(runs) < 100
          eligible = [
              row for row in runs
              if datetime.fromisoformat(row['created_at'].replace('Z', '+00:00')).astimezone(timezone.utc) >= start
          ]
          assert len(eligible) == 1, 'R2 successor release is not single-use within its successor window'
          assert int(eligible[0]['id']) == current_run_id, 'a previous dispatch already consumed R2 successor release 002'
          assert eligible[0]['event'] == 'workflow_dispatch'
          assert eligible[0]['head_branch'] == 'main'
          PY

      - name: Freeze pending R2 successor run context before AWS authentication
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          release = json.loads(Path(os.environ['SUCCESSOR_EXECUTION_RELEASE_PATH']).read_text(encoding='utf-8'))
          context = {
              'schema_version': '1.1',
              'canary_id': 'HL-ARCHIVE-NODEDATA-METADATA-CANARY-R2-001',
              'terminal_status': 'PENDING_AWS_OIDC',
              'event_name': os.environ['EVENT_NAME'],
              'dispatch_ref': os.environ['DISPATCH_REF'],
              'dispatch_sha': os.environ['DISPATCH_SHA'],
              'reviewed_commit': os.environ['DISPATCH_SHA'],
              'checked_out_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
              'approval_id': os.environ['APPROVAL_ID'],
              'approval_text_sha256': os.environ['APPROVAL_TEXT_SHA256'],
              'execution_release_id': release['release_id'],
              'predecessor_release_id': release['predecessor_release_id'],
              'implementation_commit': release['implementation_commit'],
              'expected_account_id': os.environ['EXPECTED_AWS_ACCOUNT_ID'],
              'expected_role_arn': os.environ['EXPECTED_ROLE_ARN'],
              'configure_aws_outcome': None,
              'target_bucket': 'hl-mainnet-node-data',
              'signing_region': 'ap-northeast-1',
              'regional_endpoint': 'hl-mainnet-node-data.s3.ap-northeast-1.amazonaws.com',
              'maximum_list_requests': 5,
              'maximum_keys_per_request': 25,
              'maximum_total_entries': 125,
              'maximum_total_response_bytes': 8388608,
              'maximum_runtime_seconds': 120,
              'maximum_retries_per_request': 0,
              'pagination_authorized': False,
              'http_redirect_following_authorized': False,
              'requester_pays_authorized_for_r2': True,
              'list_objects_v2_authorized_for_r2': True,
              'object_body_authorized': False,
              'market_data_ingestion_authorized': False,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'r2-metadata-context.json').write_text(
              json.dumps(context, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Assume exact AWS role with R2-only session permissions
        id: configure
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-metadata-canary
          aws-region: ap-northeast-1
          role-duration-seconds: 900
          role-session-name: HLArchiveNodeDataR2Successor
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"R2NodeDataExactPrefixes","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::hl-mainnet-node-data","Condition":{"StringLike":{"s3:prefix":["node_fills_by_block/*","node_fills/*","node_trades/*","explorer_blocks/*","replica_cmds/*"]},"NumericLessThanEquals":{"s3:max-keys":"25"}}}]}

      - name: Execute bounded five-prefix R2 collector
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/r2-metadata-result.json"
          set +e
          python research/archive_inventory/r2/collector.py "${result}" >/dev/null
          rc=$?
          set -e
          printf '%s\n' "${rc}" >"${RUNNER_TEMP}/r2-metadata.rc"

      - name: Record non-execution when AWS role assumption fails
        if: steps.configure.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'NOT_RUN' >"${RUNNER_TEMP}/r2-metadata.rc"

      - name: Finalize minimized R2 evidence
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          context_path = root / 'r2-metadata-context.json'
          result_path = root / 'r2-metadata-result.json'
          if context_path.is_file():
              context = json.loads(context_path.read_text(encoding='utf-8'))
          else:
              context = {
                  'schema_version': '1.1',
                  'canary_id': 'HL-ARCHIVE-NODEDATA-METADATA-CANARY-R2-001',
                  'terminal_status': 'R2_PRE_OIDC_GATE_FAILED',
                  'event_name': os.environ.get('EVENT_NAME'),
                  'dispatch_ref': os.environ.get('DISPATCH_REF'),
                  'dispatch_sha': os.environ.get('DISPATCH_SHA'),
                  'reviewed_commit': os.environ.get('DISPATCH_SHA'),
                  'checked_out_commit': None,
                  'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
                  'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
                  'approval_id': os.environ.get('APPROVAL_ID'),
                  'approval_text_sha256': os.environ.get('APPROVAL_TEXT_SHA256'),
                  'execution_release_id': None,
                  'implementation_commit': os.environ.get('EXPECTED_IMPLEMENTATION_COMMIT'),
                  'configure_aws_outcome': os.environ.get('CONFIGURE_OUTCOME'),
                  'target_bucket': 'hl-mainnet-node-data',
                  'signing_region': 'ap-northeast-1',
                  'regional_endpoint': 'hl-mainnet-node-data.s3.ap-northeast-1.amazonaws.com',
                  'maximum_list_requests': 5,
                  'maximum_keys_per_request': 25,
                  'maximum_total_entries': 125,
                  'maximum_total_response_bytes': 8388608,
                  'maximum_runtime_seconds': 120,
                  'maximum_retries_per_request': 0,
                  'pagination_authorized': False,
                  'http_redirect_following_authorized': False,
                  'requester_pays_authorized_for_r2': False,
                  'list_objects_v2_authorized_for_r2': False,
                  'object_body_authorized': False,
                  'market_data_ingestion_authorized': False,
              }
              context_path.write_text(json.dumps(context, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          if not result_path.is_file():
              result = {
                  'schema_version': '1.0',
                  'canary_id': 'HL-ARCHIVE-NODEDATA-METADATA-CANARY-R2-001',
                  'terminal_status': 'R2_NOT_EXECUTED',
                  'technical_result': None,
                  'request_attempt_count': 0,
                  's3_http_request_count': 0,
                  'successful_request_count': 0,
                  'failed_request_count': 0,
                  'total_entries': 0,
                  'total_response_bytes': 0,
                  'runtime_seconds': 0.0,
                  'maximum_list_requests': 5,
                  'maximum_keys_per_request': 25,
                  'maximum_total_entries': 125,
                  'maximum_total_response_bytes': 8388608,
                  'maximum_runtime_seconds': 120,
                  'retries_used': 0,
                  'pagination_followed': False,
                  'http_redirects_followed': False,
                  'signing_region': 'ap-northeast-1',
                  'regional_endpoint': 'hl-mainnet-node-data.s3.ap-northeast-1.amazonaws.com',
                  'requester_pays_requested': False,
                  'continuation_token_values_retained': False,
                  'object_body_requested': False,
                  'decompression_used': False,
                  'market_data_ingested': False,
                  'empirical_result': None,
                  'observations': [],
              }
              result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          rc = root / 'r2-metadata.rc'
          if not rc.exists():
              rc.write_text('NOT_RUN\n', encoding='utf-8')
          PY
          cd "${RUNNER_TEMP}"
          sha256sum r2-metadata-context.json r2-metadata-result.json r2-metadata.rc >R2_METADATA_FILES.sha256

      - name: Upload minimized R2 successor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyperliquid-archive-nodedata-r2-successor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2-metadata-context.json
            ${{ runner.temp }}/r2-metadata-result.json
            ${{ runner.temp }}/r2-metadata.rc
            ${{ runner.temp }}/R2_METADATA_FILES.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

      - name: Enforce exact successful R2 result
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          set -euo pipefail
          test "${CONFIGURE_OUTCOME}" = 'success'
          test "$(cat "${RUNNER_TEMP}/r2-metadata.rc")" = '0'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'r2-metadata-result.json').read_text(encoding='utf-8'))
          assert result['terminal_status'] == 'R2_NODEDATA_METADATA_CANARY_PASS'
          assert result['technical_result'] == 'FIVE_PREFIX_METADATA_LISTABLE'
          assert result['request_attempt_count'] == 5
          assert result['s3_http_request_count'] == 5
          assert result['successful_request_count'] == 5
          assert result['failed_request_count'] == 0
          assert result['total_entries'] <= 125
          assert result['total_response_bytes'] <= 8388608
          assert result['runtime_seconds'] <= 120
          assert result['retries_used'] == 0
          assert result['pagination_followed'] is False
          assert result['http_redirects_followed'] is False
          assert result['signing_region'] == 'ap-northeast-1'
          assert result['regional_endpoint'] == 'hl-mainnet-node-data.s3.ap-northeast-1.amazonaws.com'
          assert result['requester_pays_requested'] is True
          assert result['continuation_token_values_retained'] is False
          assert result['object_body_requested'] is False
          assert result['decompression_used'] is False
          assert result['market_data_ingested'] is False
          assert result['empirical_result'] is None
          assert len(result['observations']) == 5
          PY
