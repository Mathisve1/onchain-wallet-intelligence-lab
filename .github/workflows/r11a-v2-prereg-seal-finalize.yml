name: R11A V2 Preregistration Seal Finalize

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/r11a-v2-prereg-seal'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact finalize head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Finalize canonical manifest and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/r11a-v2-preregistration-seal.yml
          python governance/seal_r11a_v2_preregistration.py --check
          python governance/validate_r11a_v2_preregistration.py
          python governance/validate_r11a_v2_bindings.py
          rm .github/workflows/r11a-v2-prereg-seal-finalize.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python -m unittest \
            tests.test_archive_inventory_r11a_v2_preregistration \
            tests.test_archive_inventory_r11a_v2_bindings -v
          python governance/validate_repository.py
          git add -A
          git diff --cached --check
      - name: Commit final canonical preregistration seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: finalize canonical R11A V2 preregistration seal'
          git push origin HEAD:fix/r11a-v2-prereg-seal
