name: R6A Activation Tree Builder

on:
  push:
    branches:
      - research/r6a-lexical-activation

permissions:
  contents: write

concurrency:
  group: r6a-activation-tree-builder
  cancel-in-progress: false

jobs:
  build-activation-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out activation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r6a-lexical-activation
          fetch-depth: 0
          persist-credentials: true

      - name: Build fail-closed activation tree
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/research/r6a-lexical-activation"
          python - <<'PY'
          import json
          from pathlib import Path

          marker = 'CANONICAL_PR_66_BYTE_EXACT_BINDING'
          activation_path = Path('research/archive_inventory/r6a/R6A_EXECUTION_RELEASE_CANONICALIZATION.json')
          activation = json.loads(activation_path.read_text(encoding='utf-8'))
          activation['implementation_commit'] = marker
          activation['single_use_window_start_utc'] = '2026-08-09T16:36:00Z'
          activation_path.write_text(json.dumps(activation, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          workflow_path = Path('.github/workflows/hyperliquid-archive-legacy-user-key-lexical-r6a.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_env = '  EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE\n'
          new_env = f'  EXPECTED_IMPLEMENTATION_COMMIT: {marker}\n'
          assert workflow.count(old_env) == 1
          workflow = workflow.replace(old_env, new_env)
          old_guard = """          if expected == 'PENDING_CANONICAL_IMPLEMENTATION_MERGE':
              print('::error title=R6A release gate 45::Implementation is not yet canonical; no AWS authentication is allowed')
              sys.exit(45)
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
"""
          assert workflow.count(old_guard) == 1
          workflow = workflow.replace(old_guard, '')
          workflow_path.write_text(workflow, encoding='utf-8')

          implementation_test = Path('tests/test_archive_inventory_r6a_implementation.py')
          text = implementation_test.read_text(encoding='utf-8')
          old_line = '        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", text)\n'
          new_line = f'        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: {marker}", text)\n'
          assert text.count(old_line) == 1
          text = text.replace(old_line, new_line)
          old_error = '        self.assertIn("Implementation is not yet canonical; no AWS authentication is allowed", text)\n'
          new_error = '        self.assertNotIn("Implementation is not yet canonical; no AWS authentication is allowed", text)\n'
          assert text.count(old_error) == 1
          text = text.replace(old_error, new_error)
          implementation_test.write_text(text, encoding='utf-8')

          workflow_test = Path('tests/test_archive_inventory_r6a_workflow.py')
          text = workflow_test.read_text(encoding='utf-8')
          old_line = '        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", self.text)\n'
          new_line = f'        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: {marker}", self.text)\n'
          assert text.count(old_line) == 1
          text = text.replace(old_line, new_line)
          workflow_test.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/r6a-activation-tree-builder.yml
          git add \
            .github/workflows/hyperliquid-archive-legacy-user-key-lexical-r6a.yml \
            research/archive_inventory/r6a/R6A_EXECUTION_RELEASE_CANONICALIZATION.json \
            tests/test_archive_inventory_r6a_implementation.py \
            tests/test_archive_inventory_r6a_workflow.py

          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          manifest = Path('governance/REPOSITORY_MANIFEST.sha256')
          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = sorted(
              p.decode('utf-8')
              for p in raw.split(b'\0')
              if p and p.decode('utf-8') != manifest.as_posix()
          )
          lines = []
          for name in paths:
              path = Path(name)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}\n')
          manifest.write_text(''.join(lines), encoding='utf-8')
          PY
          git add governance/REPOSITORY_MANIFEST.sha256

          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          python governance/validate_r6a_preregistration.py
          python governance/validate_r6a_approval.py
          python governance/validate_r6a_implementation.py

          changed="$(git diff --cached --name-only)"
          printf '%s\n' "${changed}"
          test "$(printf '%s\n' "${changed}" | grep -c '^\.github/workflows/r6a-activation-tree-builder.yml$')" -eq 1
          test "$(printf '%s\n' "${changed}" | grep -c '^\.github/workflows/hyperliquid-archive-legacy-user-key-lexical-r6a.yml$')" -eq 1
          test "$(printf '%s\n' "${changed}" | grep -c '^governance/REPOSITORY_MANIFEST.sha256$')" -eq 1
          test "$(printf '%s\n' "${changed}" | grep -c '^research/archive_inventory/r6a/R6A_EXECUTION_RELEASE_CANONICALIZATION.json$')" -eq 1
          test "$(printf '%s\n' "${changed}" | grep -c '^tests/test_archive_inventory_r6a_implementation.py$')" -eq 1
          test "$(printf '%s\n' "${changed}" | grep -c '^tests/test_archive_inventory_r6a_workflow.py$')" -eq 1
          test "$(printf '%s\n' "${changed}" | wc -l)" -eq 6

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: activate exactly one R6A lexical dispatch'
          git push origin HEAD:research/r6a-lexical-activation
