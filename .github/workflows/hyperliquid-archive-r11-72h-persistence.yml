name: Hyperliquid Archive 72H Persistence Scaling R11
run-name: R11 72h persistence scaling

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-r11-72h-persistence
  cancel-in-progress: false

env:
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  EXPECTED_AWS_ACCOUNT_ID: '630956766927'
  R11_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-scaling-r11
  ROLE_ATTESTATION_PATH: research/archive_inventory/r11_role_attestation/R11_DEDICATED_ROLE_OPERATOR_ATTESTATION.json
  STS_EVIDENCE_PATH: research/archive_inventory/r11_role_preflight/HL-ARCHIVE-R11-DEDICATED-ROLE-STS-PREFLIGHT-001-ATTESTATION.json
  EXECUTION_RELEASE_PATH: research/archive_inventory/r11_runtime/R11_EXECUTION_RELEASE.json
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  r11-72h-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out canonical dispatch SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DISPATCH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical manual main identity
        shell: bash
        run: |
          set -euo pipefail
          test "${EVENT_NAME}" = 'workflow_dispatch'
          test "${DISPATCH_REF}" = 'refs/heads/main'
          [[ "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${DISPATCH_SHA}"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Prove exact single-use R11 release before OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python governance/validate_repository.py
          python governance/validate_r11_approval.py
          python governance/validate_r11_implementation.py
          test -f "${ROLE_ATTESTATION_PATH}"
          test -f "${STS_EVIDENCE_PATH}"
          test -f "${EXECUTION_RELEASE_PATH}"
          python - <<'PY'
          import json,os,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          role=json.loads(Path(os.environ['ROLE_ATTESTATION_PATH']).read_text())
          sts=json.loads(Path(os.environ['STS_EVIDENCE_PATH']).read_text())
          release=json.loads(Path(os.environ['EXECUTION_RELEASE_PATH']).read_text())
          assert role['operator_attested'] is True and role['role_arn']==os.environ['R11_ROLE_ARN']
          assert role['persistent_permission_resource_count']==72
          assert sts['terminal_status']=='R11_STS_PREFLIGHT_PASS'
          assert sts['technical_result']=='DEDICATED_R11_ROLE_ASSUMEABLE_FROM_CANONICAL_MAIN'
          assert sts['s3_http_request_count']==0 and sts['object_bytes_downloaded']==0
          assert release['status']=='RELEASED_FOR_EXACTLY_ONE_CANONICAL_R11_RUN'
          assert release['role_arn']==os.environ['R11_ROLE_ARN']
          assert release['single_workflow_dispatch_authorized'] is True
          assert release['rerun_authorized'] is False and release['release_consumed'] is False
          assert release['maximum_get_object_requests']==72 and release['maximum_retries_per_request']==0
          assert release['maximum_total_compressed_bytes']==2107738436
          assert release['record_anchored_rule_id']=='RAW_LOCAL_PREFIX_PLUS_BLOCK_PREFIX_NO_NUMERIC_TOLERANCE_V1'
          assert release['numeric_tolerance_authorized'] is False
          assert all(v is False for v in release['downstream_authorizations'].values())
          assert all(v is False for v in release['trading_authorizations'].values())
          start=datetime.fromisoformat(release['single_use_window_start_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
          repo=os.environ['CURRENT_REPOSITORY']; current=int(os.environ['CURRENT_RUN_ID'])
          url=f'https://api.github.com/repos/{repo}/actions/workflows/hyperliquid-archive-r11-72h-persistence.yml/runs?event=workflow_dispatch&branch=main&per_page=100'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'r11-single-use-check'})
          with urllib.request.urlopen(req,timeout=10) as response: runs=json.load(response).get('workflow_runs')
          assert isinstance(runs,list) and len(runs)<100
          eligible=[row for row in runs if datetime.fromisoformat(row['created_at'].replace('Z','+00:00')).astimezone(timezone.utc)>=start]
          assert len(eligible)==1 and int(eligible[0]['id'])==current
          assert int(os.environ['CURRENT_RUN_ATTEMPT'])==1, 'R11 rerun forbidden'
          PY

      - name: Create minimized pending execution context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          context={'schema_version':'1.0','pilot_id':'HL-ARCHIVE-R11-72H-PERSISTENCE-SCALING-001','terminal_status':'PENDING_AWS_OIDC','event_name':os.environ['EVENT_NAME'],'dispatch_ref':os.environ['DISPATCH_REF'],'dispatch_sha':os.environ['DISPATCH_SHA'],'checked_out_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'workflow_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'expected_account_id':os.environ['EXPECTED_AWS_ACCOUNT_ID'],'expected_role_arn':os.environ['R11_ROLE_ARN'],'configure_aws_outcome':None,'selected_hour_count':72,'maximum_get_object_requests':72,'maximum_total_compressed_bytes':2107738436,'maximum_total_decompressed_bytes':17179869184,'maximum_retries_per_request':0,'record_anchored_rule_id':'RAW_LOCAL_PREFIX_PLUS_BLOCK_PREFIX_NO_NUMERIC_TOLERANCE_V1','numeric_tolerance_authorized':False,'wallet_ranking_authorized':False,'pnl_or_alpha_analysis_authorized':False,'copyability_analysis_authorized':False}
          (Path(os.environ['RUNNER_TEMP'])/'r11-context.json').write_text(json.dumps(context,indent=2,sort_keys=True)+'\n')
          PY

      - name: Assume exact R11 role with approved three-date session intersection
        id: configure
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-scaling-r11
          aws-region: ap-northeast-1
          role-duration-seconds: 7200
          role-session-name: HLArchiveR11Persistence
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"R11ApprovedThreeDateIntersection","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250728/*","arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250729/*","arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250730/*"]}]}

      - name: Execute bounded R11 collector once
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11_implementation.collector \
            --result-output "${RUNNER_TEMP}/r11-result.json" \
            --wallet-feature-output "${RUNNER_TEMP}/r11-wallet-features.ndjson"
          rc=$?
          set -e
          printf '%s\n' "${rc}" > "${RUNNER_TEMP}/r11.rc"

      - name: Finalize bounded artifact ledger
        if: always()
        shell: bash
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP']); context=temp/'r11-context.json'; result=temp/'r11-result.json'; feature=temp/'r11-wallet-features.ndjson'; rc=temp/'r11.rc'
          c=json.loads(context.read_text()); c['configure_aws_outcome']=os.environ.get('CONFIGURE_OUTCOME'); context.write_text(json.dumps(c,indent=2,sort_keys=True)+'\n')
          if not result.exists(): result.write_text(json.dumps({'schema_version':'1.0','pilot_id':'HL-ARCHIVE-R11-72H-PERSISTENCE-SCALING-001','terminal_status':'R11_TRANSPORT_OR_INTEGRITY_FAIL','technical_result':'PRE_COLLECTOR_AWS_FAILURE','research_conclusion':'R11_TRANSPORT_OR_INTEGRITY_FAIL'},indent=2,sort_keys=True)+'\n')
          if not feature.exists(): feature.write_bytes(b'')
          if not rc.exists(): rc.write_text('83\n')
          lines=[]
          for path in (context,result,feature,rc): lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (temp/'R11_FILES.sha256').write_text('\n'.join(lines)+'\n')
          PY

      - name: Upload bounded R11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11-72h-persistence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r11-context.json
            ${{ runner.temp }}/r11-result.json
            ${{ runner.temp }}/r11-wallet-features.ndjson
            ${{ runner.temp }}/r11.rc
            ${{ runner.temp }}/R11_FILES.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce terminal research result and semantic boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP']); result=json.loads((temp/'r11-result.json').read_text()); feature=temp/'r11-wallet-features.ndjson'; rc=int((temp/'r11.rc').read_text().strip())
          if rc!=0 or result.get('terminal_status')=='R11_TRANSPORT_OR_INTEGRITY_FAIL': raise SystemExit(1)
          assert result['terminal_status']=='R11_72H_PERSISTENCE_STUDY_COMPLETE'
          assert result['research_conclusion'] in {'R11_72H_PERSISTENCE_PIPELINE_COMPLETE','R11_72H_PERSISTENCE_PIPELINE_UNRESOLVED'}
          assert result['record_anchored_rule_id']=='RAW_LOCAL_PREFIX_PLUS_BLOCK_PREFIX_NO_NUMERIC_TOLERANCE_V1'
          assert result['numeric_tolerance_authorized'] is False
          assert result['request_attempt_count']<=72 and result['s3_http_request_count']<=72
          assert result['retries_used']==0 and result['http_redirects_followed'] is False
          assert result['total_compressed_bytes']<=2107738436 and result['total_decompressed_bytes']<=17179869184
          for key in ('historical_window_beyond_three_days_performed','full_population_historical_ingestion_performed','legacy_modern_merged_history_performed','public_api_enrichment_performed','entity_clustering_performed','wallet_ranking_performed','candidate_shortlisting_performed','pnl_or_alpha_analysis_performed','copyability_analysis_performed','market_data_ingested','strategy_inference_performed','sum_closed_pnl_interpreted_as_exact_account_return','sum_closed_pnl_used_as_wallet_ranking_score','notional_proxy_interpreted_as_copyable_notional','active_hour_count_interpreted_as_wallet_quality_score','active_day_count_interpreted_as_wallet_quality_score','local_time_interpreted_as_partition_semantics','block_time_interpreted_as_partition_semantics','fill_time_interpreted_as_partition_semantics'):
              assert result[key] is False,key
          if result['research_conclusion']=='R11_72H_PERSISTENCE_PIPELINE_UNRESOLVED':
              assert feature.read_bytes()==b'' and result['wallet_feature_retained'] is False
              raise SystemExit(0)
          assert result['completed_hour_count']==72 and result['completed_day_count']==3
          assert result['successful_request_count']==72 and result['failed_request_count']==0
          assert result['wallet_feature_retained'] is True
          for hour in result['per_hour_summaries']:
              assert hour['record_anchored_alignment_violation_count']==0 and hour['fill_time_after_path_hour_count']==0
          summary=result['aggregate_wallet_feature_summary']; assert summary['sum_fill_count']==summary['sum_side_count']; assert summary['duplicate_wallet_tid_count']==0
          data=feature.read_bytes(); assert 0<len(data)<=134217728; assert hashlib.sha256(data).hexdigest()==summary['wallet_feature_sha256']
          addresses=[]
          for raw in data.splitlines():
              row=json.loads(raw.decode()); assert re.fullmatch(r'^0x[0-9a-f]{40}$',row['wallet_address']); assert 1<=row['active_hour_count']<=72; assert 1<=row['active_day_count']<=3; assert row['side_a_count']+row['side_b_count']==row['fill_count']; assert row['duplicate_tid_count']==0; addresses.append(row['wallet_address'])
          assert addresses==sorted(addresses); assert len(addresses)==len(set(addresses))==summary['wallet_feature_row_count']
          PY
