name: R5 Activation Snapshot Repair Helper

on:
  push:
    branches:
      - research/r5-legacy-format-activation
    paths:
      - .github/workflows/r5-activation-snapshot-repair-helper.yml

permissions:
  contents: write

jobs:
  repair-activation-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact activation-branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Bind workflow, make snapshots activation-aware, self-delete, regenerate manifest
        shell: bash
        env:
          EXPECTED_REF: refs/heads/research/r5-legacy-format-activation
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          IMPL = "40bc4d138c71a4367c9415982f58bcd24c5a57eb"
          RELEASE_MERGE = "0ed4aed8f2361e995122a0fc57c84135952f70d5"
          ANCHOR = "308054c3e69a79a4be2c395e3c47fe725b5abc6c"
          WINDOW = "2026-08-09T14:54:18Z"

          def replace_once(relative: str, old: str, new: str) -> None:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one block in {relative}, observed {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              ".github/workflows/hyperliquid-archive-legacy-format-fingerprint-r5.yml",
              "  EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE\n",
              f"  EXPECTED_IMPLEMENTATION_COMMIT: {IMPL}\n",
          )

          activation_check_prereg = f'''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN"\n        assert activation["implementation_commit"] == "{IMPL}"\n        assert activation["release_candidate_merge_commit"] == "{RELEASE_MERGE}"\n        assert activation["activation_anchor_commit"] == "{ANCHOR}"\n        assert activation["single_use_window_start_utc"] == "{WINDOW}"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["requester_pays_authorized"] is True\n        assert activation["get_object_authorized"] is True\n        assert activation["s3_requests_executed"] == 0\n        assert activation["empirical_result"] is None\n'''
          replace_once(
              "governance/validate_r5_preregistration.py",
              "    assert not ACTIVATION.exists(), ACTIVATION\n",
              activation_check_prereg,
          )

          activation_check_approval = f'''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN"\n        assert activation["implementation_commit"] == "{IMPL}"\n        assert activation["release_candidate_merge_commit"] == "{RELEASE_MERGE}"\n        assert activation["activation_anchor_commit"] == "{ANCHOR}"\n        assert activation["single_use_window_start_utc"] == "{WINDOW}"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["requester_pays_authorized"] is True\n        assert activation["get_object_authorized"] is True\n        assert activation["s3_requests_executed"] == 0\n        assert activation["empirical_result"] is None\n'''
          replace_once(
              "governance/validate_r5_approval.py",
              "    assert not ACTIVATION.exists(), ACTIVATION\n",
              activation_check_approval,
          )

          replace_once(
              "governance/validate_r5_implementation.py",
              '    assert "EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE" in workflow\n',
              f'''    if ACTIVATION.exists():\n        assert "EXPECTED_IMPLEMENTATION_COMMIT: {IMPL}" in workflow\n        assert "EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE" not in workflow\n    else:\n        assert "EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE" in workflow\n''',
          )
          replace_once(
              "governance/validate_r5_implementation.py",
              "    assert not ACTIVATION.exists()\n",
              f'''    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN"\n        assert activation["implementation_commit"] == "{IMPL}"\n        assert activation["release_candidate_merge_commit"] == "{RELEASE_MERGE}"\n        assert activation["activation_anchor_commit"] == "{ANCHOR}"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["empirical_result"] is None\n''',
          )

          replace_once(
              "governance/validate_r5_release.py",
              '''    for relative, expected in EXPECTED_FILE_HASHES.items():\n        assert sha256(ROOT / relative) == expected, relative\n''',
              '''    for relative, expected in EXPECTED_FILE_HASHES.items():\n        # Activation changes only the workflow's canonical implementation binding.\n        if relative == ".github/workflows/hyperliquid-archive-legacy-format-fingerprint-r5.yml" and ACTIVATION.exists():\n            continue\n        assert sha256(ROOT / relative) == expected, relative\n''',
          )
          replace_once(
              "governance/validate_r5_release.py",
              '''    assert not ACTIVATION.exists(), ACTIVATION\n\n    workflow = WORKFLOW.read_text(encoding="utf-8")\n    assert "EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE" in workflow\n''',
              f'''    workflow = WORKFLOW.read_text(encoding="utf-8")\n    if ACTIVATION.exists():\n        activation = load(ACTIVATION)\n        assert activation["status"] == "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN"\n        assert activation["implementation_commit"] == "{IMPL}"\n        assert activation["release_candidate_merge_commit"] == "{RELEASE_MERGE}"\n        assert activation["activation_anchor_commit"] == "{ANCHOR}"\n        assert activation["single_use_window_start_utc"] == "{WINDOW}"\n        assert activation["single_workflow_dispatch_authorized"] is True\n        assert activation["rerun_authorized"] is False\n        assert activation["s3_requests_executed"] == 0\n        assert activation["empirical_result"] is None\n        assert "EXPECTED_IMPLEMENTATION_COMMIT: {IMPL}" in workflow\n        assert "EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE" not in workflow\n    else:\n        assert "EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE" in workflow\n''',
          )

          activation_test_block = f'''        activation_path = R5 / "R5_EXECUTION_RELEASE_CANONICALIZATION.json"\n        if activation_path.exists():\n            activation = load(activation_path)\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN")\n            self.assertEqual(activation["implementation_commit"], "{IMPL}")\n            self.assertEqual(activation["release_candidate_merge_commit"], "{RELEASE_MERGE}")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertEqual(activation["s3_requests_executed"], 0)\n'''
          replace_once(
              "tests/test_archive_inventory_legacy_format_fingerprint_r5.py",
              '        self.assertFalse((R5 / "R5_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n',
              activation_test_block,
          )

          replace_once(
              "tests/test_archive_inventory_legacy_format_fingerprint_r5_approval.py",
              '        self.assertFalse((BASE / "R5_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n',
              f'''        activation_path = BASE / "R5_EXECUTION_RELEASE_CANONICALIZATION.json"\n        if activation_path.exists():\n            activation = json.loads(activation_path.read_text(encoding="utf-8"))\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN")\n            self.assertEqual(activation["implementation_commit"], "{IMPL}")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertEqual(activation["s3_requests_executed"], 0)\n''',
          )

          replace_once(
              "tests/test_archive_inventory_legacy_format_fingerprint_r5_implementation.py",
              '        self.assertFalse((R5 / "R5_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n',
              f'''        activation_path = R5 / "R5_EXECUTION_RELEASE_CANONICALIZATION.json"\n        if activation_path.exists():\n            activation = json.loads(activation_path.read_text(encoding="utf-8"))\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN")\n            self.assertEqual(activation["implementation_commit"], "{IMPL}")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertEqual(activation["s3_requests_executed"], 0)\n''',
          )

          replace_once(
              "tests/test_archive_inventory_legacy_format_fingerprint_r5_release.py",
              '''        self.assertFalse((R5 / "R5_EXECUTION_RELEASE_CANONICALIZATION.json").exists())\n        text = WORKFLOW.read_text(encoding="utf-8")\n        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", text)\n''',
              f'''        activation_path = R5 / "R5_EXECUTION_RELEASE_CANONICALIZATION.json"\n        text = WORKFLOW.read_text(encoding="utf-8")\n        if activation_path.exists():\n            activation = json.loads(activation_path.read_text(encoding="utf-8"))\n            self.assertEqual(activation["status"], "RELEASED_FOR_EXACTLY_ONE_CANONICAL_R5_RUN")\n            self.assertTrue(activation["single_workflow_dispatch_authorized"])\n            self.assertFalse(activation["rerun_authorized"])\n            self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: {IMPL}", text)\n            self.assertNotIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", text)\n        else:\n            self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", text)\n''',
          )

          replace_once(
              "tests/test_archive_inventory_legacy_format_fingerprint_r5_workflow.py",
              '        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", TEXT)\n',
              f'''        self.assertIn("EXPECTED_IMPLEMENTATION_COMMIT: {IMPL}", TEXT)\n        self.assertNotIn("EXPECTED_IMPLEMENTATION_COMMIT: PENDING_CANONICAL_IMPLEMENTATION_MERGE", TEXT)\n''',
          )
          PY
          git rm .github/workflows/r5-activation-snapshot-repair-helper.yml
          python3 governance/regenerate_manifest.py --write
          python3 governance/regenerate_manifest.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code >/dev/null && exit 1 || true
          git commit -m "activation: bind R5 workflow and make snapshots activation-aware"
          git push origin HEAD:research/r5-legacy-format-activation
