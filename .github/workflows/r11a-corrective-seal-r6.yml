name: R11A Corrective R6 Seal

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha }}

concurrency:
  group: r11a-corrective-r6-seal
  cancel-in-progress: false

jobs:
  seal:
    if: >-
      github.event.pull_request.number == 148 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11a-corrective-r3'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact corrective head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Make the sealer tolerant of tests without lifecycle references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('governance/seal_r11a_corrective_r6.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(path))
          target = next(
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == 'patch_runtime_bindings'
          )
          if target.end_lineno is None:
              raise SystemExit('patch_runtime_bindings has no end line')
          replacement = '''def patch_runtime_bindings() -> None:
              replace_required(
                  WORKFLOW,
                  "governance/validate_r11a_corrective_implementation_r5.py --canonical-bytes",
                  "governance/validate_r11a_corrective_implementation_r6.py --canonical-bytes",
              )
              for relative in TEST_FILES:
                  path = ROOT / relative
                  if not path.is_file():
                      continue
                  value = path.read_text(encoding="utf-8")
                  old_name = "validate_r11a_corrective_implementation_r5.py"
                  new_name = "validate_r11a_corrective_implementation_r6.py"
                  if old_name in value:
                      path.write_text(value.replace(old_name, new_name), encoding="utf-8")
              old_validator = ROOT / "governance/validate_r11a_corrective_implementation_r5.py"
              if old_validator.exists():
                  old_validator.unlink()'''
          lines = text.splitlines(keepends=True)
          lines[target.lineno - 1 : target.end_lineno] = [replacement.rstrip() + '\n\n']
          path.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Write and verify the exact sealed-review implementation state
        shell: bash
        run: |
          set -euo pipefail
          python governance/seal_r11a_corrective_r6.py --write
          test ! -e governance/validate_r11a_corrective_implementation_r5.py
          python governance/seal_r11a_corrective_r6.py --check
          python governance/validate_r11a_corrective_implementation_r6.py --sealed-review-stage
          python governance/generate_r11a_corrective_policies.py

      - name: Remove the transient write workflow and restore canonical read-only CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/r11a-corrective-seal-r6.yml

      - name: Compile and run focused adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q research/archive_inventory/r11a_corrective governance
          python -m unittest -v \
            tests.test_archive_inventory_r11a_corrective_r3 \
            tests.test_archive_inventory_r11a_corrective_artifacts \
            tests.test_archive_inventory_r11a_v2_preregistration \
            tests.test_archive_inventory_r11a_v2_bindings
          python governance/seal_r11a_corrective_r6.py --check
          python governance/validate_r11a_corrective_implementation_r6.py --sealed-review-stage

      - name: Regenerate the exact manifest and run the full repository suite
        shell: bash
        run: |
          set -euo pipefail
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          python -m unittest discover -s tests -v
          python governance/validate_repository.py
          git add -A
          git diff --cached --check

      - name: Commit only a fully validated sealed-review tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'R11A corrective R6 implementation is already sealed'
            exit 0
          fi
          git commit -m 'ci: seal R11A corrective R6 for independent review'
          git push origin HEAD:research/r11a-corrective-r3
