name: R9 Evidence Finalizer

on:
  push:
    branches:
      - research/r9-modern-wallet-feature-evidence

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r9-modern-wallet-feature-evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Verify branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/research/r9-modern-wallet-feature-evidence'
      - name: Remove transient finalizer and regenerate exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r9-evidence-finalizer.yml
          python governance/regenerate_manifest.py --write
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Validate final R9 evidence tree
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python governance/validate_r9_evidence.py
          python governance/validate_repository.py
      - name: Commit exact manifest and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/REPOSITORY_MANIFEST.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'evidence: finalize exact R9 evidence tree'
          git push origin HEAD:research/r9-modern-wallet-feature-evidence
