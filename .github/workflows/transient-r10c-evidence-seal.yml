          assert s['fill_counts_by_local_prefix_block_prefix_and_fill_partition'][path+'|BEFORE_PATH_HOUR'] == 0
          assert s['fill_counts_by_local_prefix_block_prefix_and_fill_partition'][path+'|INSIDE_PATH_HOUR'] == 223948

          verification = {
              'schema_version':'1.0',
              'diagnostic_id':'HL-ARCHIVE-R10C-BOUNDARY-RECORD-CORRELATION-001',
              'workflow_run_id':31410638224,
              'workflow_run_attempt':1,
              'workflow_job_id':93527564608,
              'artifact_id':9071422220,
              'artifact_name':'r10c-boundary-record-correlation-31410638224',
              'artifact_size_bytes':2912,
              'provider_digest':'sha256:60602f1e5b4e5456504af9bbd65b64826cdf2b86a47bc1b2e690507dbf0a0f48',
              'provider_zip_sha256':'60602f1e5b4e5456504af9bbd65b64826cdf2b86a47bc1b2e690507dbf0a0f48',
              'independently_downloaded_zip_sha256':'60602f1e5b4e5456504af9bbd65b64826cdf2b86a47bc1b2e690507dbf0a0f48',
              'provider_digest_matches_independent_download':True,
              'job_conclusion':'success',
              'internal_ledger':expected_ledger,
