              'status':'ATTESTED_COMPLETE_EXACT_TWO_PRE_HOUR_FILLS_COLOCATE_WITH_SINGLE_PREVIOUS_BLOCK_TIME_RECORD',
              'execution_release_id':'RELEASE_HL_ARCHIVE_R10C_BOUNDARY_RECORD_CORRELATION_001',
              'canonical_dispatch_sha':'07f988af8db67addf5d551b5b402186c0abafadb',
              'workflow_run_id':31410638224,
              'workflow_run_attempt':1,
              'workflow_job_id':93527564608,
              'artifact_id':9071422220,
              'artifact_name':'r10c-boundary-record-correlation-31410638224',
              'artifact_zip_sha256':'60602f1e5b4e5456504af9bbd65b64826cdf2b86a47bc1b2e690507dbf0a0f48',
              'terminal_status':'R10C_BOUNDARY_RECORD_CORRELATION_COMPLETE',
              'technical_result':'EXACT_TWO_PRE_HOUR_FILLS_COLOCATE_WITH_SINGLE_PREVIOUS_BLOCK_TIME_RECORD',
              'research_conclusion':'EXACT_TWO_PRE_HOUR_FILLS_COLOCATE_WITH_SINGLE_PREVIOUS_BLOCK_TIME_RECORD',
              'exact_network_observation':{
                  'object_key':s['object_key'],
                  'expected_etag':s['expected_etag'],
                  'observed_etag':s['observed_etag'],
                  'compressed_bytes':s['compressed_bytes'],
                  'compressed_sha256':s['compressed_sha256'],
                  'decompressed_bytes':s['decompressed_bytes'],
                  'block_record_count':s['block_record_count'],
                  'event_pair_count':s['event_pair_count'],
                  'fill_time_count':s['fill_time_count'],
                  'fill_time_before_path_hour_count':s['fill_time_before_path_hour_count'],
                  'fill_time_inside_path_hour_count':s['fill_time_inside_path_hour_count'],
                  'fill_time_after_path_hour_count':s['fill_time_after_path_hour_count'],
                  'block_record_count_with_any_before_fill':s['block_record_count_with_any_before_fill'],
                  'local_path_block_path_record_count':s['block_record_counts_by_local_prefix_and_block_prefix'][path],
                  'local_path_block_previous_record_count':s['block_record_counts_by_local_prefix_and_block_prefix'][cross],
                  'before_fills_in_local_path_block_previous_records':s['fill_counts_by_local_prefix_block_prefix_and_fill_partition'][cross+'|BEFORE_PATH_HOUR'],
                  'inside_fills_in_local_path_block_path_records':s['fill_counts_by_local_prefix_block_prefix_and_fill_partition'][path+'|INSIDE_PATH_HOUR'],
              },
              'claims_proven':{
