name: Transient R10C Evidence Seal

on:
  push:
    branches:
      - research/r10c-execution-evidence

permissions:
  actions: read
  contents: write

jobs:
  seal:
    if: github.repository == 'Mathisve1/onchain-wallet-intelligence-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out exact evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10c-execution-evidence
          fetch-depth: 1
          persist-credentials: true

      - name: Verify triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = 'refs/heads/research/r10c-execution-evidence'

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Download and independently verify exact R10C artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r10c-artifact
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9071422220/zip" \
            -o /tmp/r10c-artifact.zip
          test "$(stat -c %s /tmp/r10c-artifact.zip)" = '2912'
          test "$(sha256sum /tmp/r10c-artifact.zip | awk '{print $1}')" = '60602f1e5b4e5456504af9bbd65b64826cdf2b86a47bc1b2e690507dbf0a0f48'
          unzip -q /tmp/r10c-artifact.zip -d /tmp/r10c-artifact
          test "$(find /tmp/r10c-artifact -maxdepth 1 -type f | wc -l)" -eq 4
          test -f /tmp/r10c-artifact/r10c-context.json
          test -f /tmp/r10c-artifact/r10c-result.json
          test -f /tmp/r10c-artifact/r10c.rc
          test -f /tmp/r10c-artifact/R10C_FILES.sha256

      - name: Materialize bounded evidence and consumption record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path

          root = Path('.')
          source = Path('/tmp/r10c-artifact')
          run = root / 'research/archive_inventory/r10c_evidence/run-31410638224'
          run.mkdir(parents=True, exist_ok=True)
          for name in ('r10c-context.json','r10c-result.json','r10c.rc','R10C_FILES.sha256'):
              shutil.copyfile(source / name, run / name)

          expected_ledger = {
              'r10c-context.json':'b4f0b96aedafa92ecd188ec06fc5c93be6006b84b76bd8a893ae4d32e7bedc42',
              'r10c-result.json':'c86f606c18f26274b3fed1ba985c53ce7e88681cabf052c101574f7c776973fe',
              'r10c.rc':'9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa',
          }
          observed = {}
          for line in (run/'R10C_FILES.sha256').read_text().splitlines():
              digest, name = line.split('  ',1)
              observed[name] = digest
          assert observed == expected_ledger
          for name, digest in expected_ledger.items():
              assert hashlib.sha256((run/name).read_bytes()).hexdigest() == digest

          context = json.loads((run/'r10c-context.json').read_text())
          result = json.loads((run/'r10c-result.json').read_text())
          assert (run/'r10c.rc').read_text() == '0\n'
          assert context['workflow_run_id'] == 31410638224
          assert context['workflow_run_attempt'] == 1
          assert context['dispatch_sha'] == '07f988af8db67addf5d551b5b402186c0abafadb'
          assert context['checked_out_commit'] == context['dispatch_sha']
          assert context['configure_aws_outcome'] == 'success'
          assert result['terminal_status'] == 'R10C_BOUNDARY_RECORD_CORRELATION_COMPLETE'
          assert result['technical_result'] == 'EXACT_TWO_PRE_HOUR_FILLS_COLOCATE_WITH_SINGLE_PREVIOUS_BLOCK_TIME_RECORD'
          assert result['research_conclusion'] == result['technical_result']
          s = result['diagnostic_summary']
          assert s['block_record_count'] == 36029
          assert s['event_pair_count'] == 223950
          assert s['fill_time_count'] == 223950
          assert s['fill_time_before_path_hour_count'] == 2
          assert s['fill_time_inside_path_hour_count'] == 223948
          assert s['fill_time_after_path_hour_count'] == 0
          assert s['block_record_count_with_any_before_fill'] == 1
          cross = 'MATCHES_PATH_DATE_HOUR_PREFIX|MATCHES_PREVIOUS_DATE_HOUR_PREFIX'
          path = 'MATCHES_PATH_DATE_HOUR_PREFIX|MATCHES_PATH_DATE_HOUR_PREFIX'
