              'verification_result':'ALL_RETAINED_EVIDENCE_CHECKS_PASS_EXACT_TWO_PRE_HOUR_FILLS_COLOCATE_WITH_SINGLE_PREVIOUS_BLOCK_TIME_RECORD',
          }
          (run/'INDEPENDENT_ARTIFACT_VERIFICATION.json').write_text(json.dumps(verification,indent=2,sort_keys=True)+'\n')

          evidence_dir = root / 'research/archive_inventory/r10c_evidence'
          attestation = {
