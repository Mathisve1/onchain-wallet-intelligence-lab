name: R11A Corrective R7 Exact Autofix

on:
  pull_request:

permissions:
  contents: write

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  patch-and-verify:
    if: >-
      github.event.pull_request.number == 148 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/r11a-corrective-r3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact R7 development head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Apply only the exact Protocol import correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('research/archive_inventory/r11a_corrective/taxonomy.py')
          text=path.read_text(encoding='utf-8')
          old='from collections.abc import Iterator, Mapping, Protocol, Sequence\n'
          new='from collections.abc import Iterator, Mapping, Sequence\nfrom typing import Protocol\n'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('unexpected taxonomy import bytes')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Compile and run focused R7 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            research/archive_inventory/r11a_corrective \
            governance/validate_r11a_execution_artifact_r7.py \
            tests/test_archive_inventory_r11a_corrective_r7.py
          python -m unittest -v tests.test_archive_inventory_r11a_corrective_r7
      - name: Remove transient write workflow and commit only verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r11a-r7-autofix.yml
          rm -f research/archive_inventory/r11a_corrective/R7_DEV_TRIGGER.md
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: correct R11A R7 Protocol import after targeted CI'
          git push origin HEAD:research/r11a-corrective-r3
