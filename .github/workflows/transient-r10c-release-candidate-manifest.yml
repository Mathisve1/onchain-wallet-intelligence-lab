name: Transient R10C Candidate Manifest Seal

on:
  push:
    branches:
      - research/r10c-release-candidate

permissions:
  contents: write

jobs:
  seal:
    if: github.repository == 'Mathisve1/onchain-wallet-intelligence-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/r10c-release-candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Verify triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = 'refs/heads/research/r10c-release-candidate'

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Remove transient workflow and regenerate exact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/transient-r10c-release-candidate-manifest.yml
          python governance/regenerate_manifest.py --write
          python governance/regenerate_manifest.py --check
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          printf 'manifest seal changes: %s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/transient-r10c-release-candidate-manifest.yml'
          test "${changed[1]}" = 'governance/REPOSITORY_MANIFEST.sha256'

      - name: Commit sealed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: seal R10C release-candidate manifest'
          git push origin HEAD:research/r10c-release-candidate
