name: Hyperliquid Archive R11A Identity Boundary Diagnostic
run-name: R11A identity and archive-boundary diagnostic

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-r11a-identity-boundary-diagnostic
  cancel-in-progress: false

env:
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  CURRENT_RUN_ID: ${{ github.run_id }}
  CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
  CURRENT_REPOSITORY: ${{ github.repository }}
  R11A_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-identity-r11a
  R11A_WORKSPACE: ${{ runner.temp }}/r11a-workspace
  R11A_PENDING_CONTEXT: ${{ runner.temp }}/r11a-pending-context.json
  R11A_BOUND_CONTEXT: ${{ runner.temp }}/r11a-bound-context.json
  R11A_PRINCIPAL: ${{ runner.temp }}/r11a-sts-caller-identity.json
  R11A_ARTIFACT: ${{ runner.temp }}/r11a-workspace/r11a-artifact
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  r11a-identity-boundary-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 370
    steps:
      - name: Check out canonical dispatch SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DISPATCH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact manual canonical-main identity and attempt one
        shell: bash
        run: |
          set -euo pipefail
          test "${EVENT_NAME}" = workflow_dispatch
          test "${DISPATCH_REF}" = refs/heads/main
          [[ "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${DISPATCH_SHA}"
          test "${CURRENT_RUN_ATTEMPT}" = 1

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Create minimal pending context without governed overlay reads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          value={
            'event_name':os.environ['EVENT_NAME'],
            'dispatch_ref':os.environ['DISPATCH_REF'],
            'dispatch_sha':os.environ['DISPATCH_SHA'],
            'checked_out_commit':os.environ['DISPATCH_SHA'],
            'workflow_run_id':int(os.environ['CURRENT_RUN_ID']),
            'workflow_run_attempt':int(os.environ['CURRENT_RUN_ATTEMPT']),
            'repository':os.environ['CURRENT_REPOSITORY'],
            'workflow_name':'Hyperliquid Archive R11A Identity Boundary Diagnostic',
          }
          Path(os.environ['R11A_PENDING_CONTEXT']).write_text(
              json.dumps(value,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8'
          )
          PY

      - name: Prove all static lifecycle, pricing, free-space and single-use gates
        id: static
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python governance/validate_r11a_preregistration.py
          python governance/validate_r11a_corrective_implementation_r5.py --canonical-bytes
          python governance/validate_r11a_approval_r4.py
          python governance/validate_r11a_role_attestation_r4.py
          python governance/validate_r11a_role_preflight_evidence_r4.py
          python governance/validate_r11a_workflow_installation_r4.py
          python governance/validate_r11a_execution_release_r4.py
          python governance/validate_r11a_activation_r4.py
          python - <<'PY'
          import json,os,shutil,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path.cwd(); archive=root/'research/archive_inventory'; corrective=archive/'r11a_corrective'
          def load(path): return json.loads(path.read_text())
          def sha(path):
              import hashlib
              return hashlib.sha256(path.read_bytes()).hexdigest()
          activation_path=archive/'r11a_runtime/R11A_CANONICAL_ACTIVATION.json'
          activation=load(activation_path)
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 6442450944:
              raise SystemExit('pre-OIDC free-space threshold not met')
          start=datetime.fromisoformat(activation['single_use_window_start_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
          repo=os.environ['CURRENT_REPOSITORY']; current=int(os.environ['CURRENT_RUN_ID'])
          url=f'https://api.github.com/repos/{repo}/actions/workflows/hyperliquid-archive-r11a-identity-boundary-diagnostic.yml/runs?event=workflow_dispatch&branch=main&per_page=100'
          request=urllib.request.Request(url,headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'r11a-single-use-gate',
          })
          with urllib.request.urlopen(request,timeout=15) as response:
              runs=json.load(response).get('workflow_runs')
          if not isinstance(runs,list) or len(runs)>=100:
              raise SystemExit('single-use run history is unbounded')
          eligible=[row for row in runs if datetime.fromisoformat(row['created_at'].replace('Z','+00:00')).astimezone(timezone.utc)>=start]
          if len(eligible)!=1 or int(eligible[0]['id'])!=current:
              raise SystemExit('single-use activation has zero or multiple eligible runs')
          if int(os.environ['CURRENT_RUN_ATTEMPT'])!=1:
              raise SystemExit('R11A rerun is forbidden')
          approval_path=archive/'r11a_approval/APPROVE_HL_ARCHIVE_R11A_IDENTITY_BOUNDARY_DIAGNOSTIC_001.json'
          release_path=archive/'r11a_runtime/R11A_EXECUTION_RELEASE.json'
          implementation_path=corrective/'R11A_CORRECTIVE_IMPLEMENTATION_CONTRACT.json'
          selection_path=archive/'r11/R11_72H_SELECTION.json'
          pricing_path=corrective/'R11A_PRICING_EUR_SNAPSHOT.json'
          validator_path=root/'governance/validate_r11a_execution_artifact_r4.py'
          workflow_path=root/'.github/workflows/hyperliquid-archive-r11a-identity-boundary-diagnostic.yml'
          a=load(approval_path); r=load(release_path); x=activation; i=load(implementation_path)
          context={
            'event_name':os.environ['EVENT_NAME'],
            'dispatch_ref':os.environ['DISPATCH_REF'],
            'dispatch_sha':os.environ['DISPATCH_SHA'],
            'checked_out_commit':os.environ['DISPATCH_SHA'],
            'workflow_run_id':int(os.environ['CURRENT_RUN_ID']),
            'workflow_run_attempt':int(os.environ['CURRENT_RUN_ATTEMPT']),
            'repository':os.environ['CURRENT_REPOSITORY'],
            'workflow_name':'Hyperliquid Archive R11A Identity Boundary Diagnostic',
            'approval_id':a['approval_id'],
            'approval_text_sha256':a['approval_text_sha256'],
            'execution_release_id':r['execution_release_id'],
            'execution_release_blob_sha256':sha(release_path),
            'activation_id':x['activation_id'],
            'implementation_contract_sha256':sha(implementation_path),
            'workflow_sha256':sha(workflow_path),
            'collector_sha256':i['implementation_file_hashes']['research/archive_inventory/r11a_corrective/runner_r4.py'],
            'validator_sha256':sha(validator_path),
            'selection_sha256':sha(selection_path),
            'pricing_snapshot_sha256':sha(pricing_path),
          }
          Path(os.environ['R11A_BOUND_CONTEXT']).write_text(
              json.dumps(context,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8'
          )
          PY

      - name: Produce deterministic pre-OIDC failure artifact
        if: steps.static.outcome != 'success'
        id: pre_oidc_failure
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11a_corrective.entrypoint_r5 \
            --mode pre-oidc-failure \
            --workspace "${R11A_WORKSPACE}" \
            --workflow-context "${R11A_PENDING_CONTEXT}" \
            --run-id "${CURRENT_RUN_ID}" \
            --run-attempt "${CURRENT_RUN_ATTEMPT}" \
            --failure-code PRE_OIDC_STATIC_GATE_FAILURE
          rc=$?
          set -e
          test "${rc}" = 21
          python governance/validate_r11a_execution_artifact_r4.py \
            --artifact-dir "${R11A_ARTIFACT}" \
            --expected-run-id "${CURRENT_RUN_ID}"

      - name: Upload only the validated pre-OIDC failure artifact
        if: steps.static.outcome != 'success' && steps.pre_oidc_failure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11a-pre-oidc-failure-${{ github.run_id }}
          path: ${{ env.R11A_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Stop after retained pre-OIDC failure
        if: steps.static.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Assume exact successor role under approved three-date intersection
        if: steps.static.outcome == 'success'
        id: configure
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-identity-r11a
          aws-region: ap-northeast-1
          role-duration-seconds: 21600
          role-session-name: HLArchiveR11AIdentityBoundary
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"R11AApprovedThreeDateIntersection","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250728/*","arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250729/*","arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250730/*"]}]}

      - name: Retain and validate minimized exact post-OIDC principal evidence
        if: steps.static.outcome == 'success' && steps.configure.outcome == 'success'
        id: principal
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json > "${R11A_PRINCIPAL}"
          python - <<'PY'
          import os
          from pathlib import Path
          from research.archive_inventory.r11a_corrective.context import PrincipalEvidence
          PrincipalEvidence.from_bytes(Path(os.environ['R11A_PRINCIPAL']).read_bytes())
          PY

      - name: Produce deterministic precollector failure artifact
        if: >-
          steps.static.outcome == 'success' &&
          (steps.configure.outcome != 'success' || steps.principal.outcome != 'success')
        id: precollector_failure
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11a_corrective.entrypoint_r5 \
            --mode pre-oidc-failure \
            --workspace "${R11A_WORKSPACE}" \
            --workflow-context "${R11A_BOUND_CONTEXT}" \
            --run-id "${CURRENT_RUN_ID}" \
            --run-attempt "${CURRENT_RUN_ATTEMPT}" \
            --failure-code OIDC_OR_PRINCIPAL_ATTESTATION_FAILURE
          rc=$?
          set -e
          test "${rc}" = 21
          python governance/validate_r11a_execution_artifact_r4.py \
            --artifact-dir "${R11A_ARTIFACT}" \
            --expected-run-id "${CURRENT_RUN_ID}"

      - name: Upload only the validated precollector failure artifact
        if: steps.precollector_failure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11a-precollector-failure-${{ github.run_id }}
          path: ${{ env.R11A_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Stop after retained precollector failure
        if: >-
          steps.static.outcome == 'success' &&
          (steps.configure.outcome != 'success' || steps.principal.outcome != 'success')
        shell: bash
        run: exit 1

      - name: Execute bounded corrective R11A diagnostic
        if: >-
          steps.static.outcome == 'success' &&
          steps.configure.outcome == 'success' &&
          steps.principal.outcome == 'success'
        id: execute
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11a_corrective.entrypoint_r5 \
            --mode execute \
            --workspace "${R11A_WORKSPACE}" \
            --workflow-context "${R11A_BOUND_CONTEXT}" \
            --principal-evidence "${R11A_PRINCIPAL}"
          rc=$?
          set -e
          test "${rc}" = 0 -o "${rc}" = 20 -o "${rc}" = 21

      - name: Validate complete artifact before any upload
        if: steps.execute.outcome == 'success'
        id: artifact_validate
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_r11a_execution_artifact_r4.py \
            --artifact-dir "${R11A_ARTIFACT}" \
            --expected-run-id "${CURRENT_RUN_ID}"

      - name: Upload only the already validated R11A artifact
        if: steps.artifact_validate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11a-identity-boundary-${{ github.run_id }}
          path: ${{ env.R11A_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce retained validated terminal artifact
        if: >-
          steps.static.outcome == 'success' &&
          steps.configure.outcome == 'success' &&
          steps.principal.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.artifact_validate.outcome }}" = success
          test -f "${R11A_ARTIFACT}/r11a-result.json"
          test -f "${R11A_ARTIFACT}/R11A_FILES.sha256"
          test -f "${R11A_ARTIFACT}/R11A_PACKAGE_BOUNDARY.bin"
