name: Hyperliquid Archive R11A Identity Boundary Diagnostic
run-name: R11A R7 identity and archive-boundary diagnostic

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-archive-r11a-identity-boundary-diagnostic
  cancel-in-progress: false

env:
  EVENT_NAME: ${{ github.event_name }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  CURRENT_RUN_ID: ${{ github.run_id }}
  CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
  CURRENT_REPOSITORY: ${{ github.repository }}
  R11A_WORKFLOW_FILE: hyperliquid-archive-r11a-identity-boundary-diagnostic.yml
  R11A_ROLE_ARN: arn:aws:iam::630956766927:role/onchain-wallet-intelligence-hl-archive-identity-r11a
  R11A_WORKSPACE: ${{ runner.temp }}/r11a-r7-workspace
  R11A_PENDING_CONTEXT: ${{ runner.temp }}/r11a-r7-pending-context.json
  R11A_BOUND_CONTEXT: ${{ runner.temp }}/r11a-r7-bound-context.json
  R11A_PRINCIPAL: ${{ runner.temp }}/r11a-r7-sts-caller-identity.json
  R11A_ARTIFACT: ${{ runner.temp }}/r11a-r7-workspace/r11a-v2-artifact
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''

jobs:
  r11a-r7-identity-boundary-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 370
    steps:
      - name: Check out exact canonical dispatch SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DISPATCH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact manual canonical-main identity and attempt one
        shell: bash
        run: |
          set -euo pipefail
          test "${EVENT_NAME}" = workflow_dispatch
          test "${DISPATCH_REF}" = refs/heads/main
          [[ "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${DISPATCH_SHA}"
          test "${CURRENT_REPOSITORY}" = Mathisve1/onchain-wallet-intelligence-lab
          test "${CURRENT_RUN_ATTEMPT}" = 1

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Create minimal pending context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              "event_name": os.environ["EVENT_NAME"],
              "dispatch_ref": os.environ["DISPATCH_REF"],
              "dispatch_sha": os.environ["DISPATCH_SHA"],
              "checked_out_commit": os.environ["DISPATCH_SHA"],
              "workflow_run_id": int(os.environ["CURRENT_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["CURRENT_RUN_ATTEMPT"]),
              "repository": os.environ["CURRENT_REPOSITORY"],
              "workflow_name": "Hyperliquid Archive R11A Identity Boundary Diagnostic",
          }
          Path(os.environ["R11A_PENDING_CONTEXT"]).write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prove exact post-approval runtime binding and bounded single-use history
        id: static
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python governance/validate_r11a_preregistration.py
          python governance/validate_r11a_runtime_binding_r7.py \
            --expected-commit "${DISPATCH_SHA}" \
            --run-attempt "${CURRENT_RUN_ATTEMPT}"
          window_start="$(python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('research/archive_inventory/r11a_runtime/R11A_RUNTIME_BINDING_R7.json').read_text(encoding='utf-8'))
          print(value['single_use_window_start_utc'])
          PY
          )"
          python -m research.archive_inventory.r11a_corrective.network verify-history \
            --repository "${CURRENT_REPOSITORY}" \
            --workflow-file "${R11A_WORKFLOW_FILE}" \
            --current-run-id "${CURRENT_RUN_ID}" \
            --current-run-attempt "${CURRENT_RUN_ATTEMPT}" \
            --window-start "${window_start}"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root=Path.cwd()
          archive=root/'research/archive_inventory'
          corrective=archive/'r11a_corrective'
          runtime=archive/'r11a_runtime'
          approval_path=archive/'r11a_approval/APPROVE_HL_ARCHIVE_R11A_IDENTITY_BOUNDARY_DIAGNOSTIC_001.json'
          approval_text=archive/'r11a_approval/APPROVE_HL_ARCHIVE_R11A_IDENTITY_BOUNDARY_DIAGNOSTIC_001.txt'
          release_path=runtime/'R11A_EXECUTION_RELEASE.json'
          activation_path=runtime/'R11A_CANONICAL_ACTIVATION.json'
          implementation_path=corrective/'R11A_CORRECTIVE_IMPLEMENTATION_CONTRACT_R7.json'
          workflow_path=root/'.github/workflows/hyperliquid-archive-r11a-identity-boundary-diagnostic.yml'
          collector_path=corrective/'runner.py'
          validator_path=root/'governance/validate_r11a_execution_artifact_r7.py'
          selection_path=archive/'r11/R11_72H_SELECTION.json'
          pricing_path=corrective/'R11A_PRICING_EUR_SNAPSHOT.json'
          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          approval=load(approval_path)
          release=load(release_path)
          activation=load(activation_path)
          context={
              'event_name':os.environ['EVENT_NAME'],
              'dispatch_ref':os.environ['DISPATCH_REF'],
              'dispatch_sha':os.environ['DISPATCH_SHA'],
              'checked_out_commit':os.environ['DISPATCH_SHA'],
              'workflow_run_id':int(os.environ['CURRENT_RUN_ID']),
              'workflow_run_attempt':int(os.environ['CURRENT_RUN_ATTEMPT']),
              'repository':os.environ['CURRENT_REPOSITORY'],
              'workflow_name':'Hyperliquid Archive R11A Identity Boundary Diagnostic',
              'approval_id':approval['approval_id'],
              'approval_text_sha256':sha(approval_text),
              'execution_release_id':release['execution_release_id'],
              'execution_release_blob_sha256':sha(release_path),
              'activation_id':activation['activation_id'],
              'implementation_contract_sha256':sha(implementation_path),
              'workflow_sha256':sha(workflow_path),
              'collector_sha256':sha(collector_path),
              'validator_sha256':sha(validator_path),
              'selection_sha256':sha(selection_path),
              'pricing_snapshot_sha256':sha(pricing_path),
              'single_use_window_start_utc':activation['single_use_window_start_utc'],
          }
          Path(os.environ['R11A_BOUND_CONTEXT']).write_text(
              json.dumps(context,sort_keys=True,separators=(',',':'))+'\n',
              encoding='utf-8',
          )
          PY

      - name: Produce and validate phase-truthful pre-OIDC failure artifact
        if: steps.static.outcome != 'success'
        id: pre_oidc_failure
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11a_corrective.entrypoint \
            --mode failure \
            --workspace "${R11A_WORKSPACE}" \
            --workflow-context "${R11A_PENDING_CONTEXT}" \
            --failure-phase PRE_OIDC_STATIC_GATE \
            --failure-code PRE_OIDC_STATIC_GATE_FAILURE
          rc=$?
          set -e
          test "${rc}" = 21
          python governance/validate_r11a_execution_artifact_r7.py "${R11A_ARTIFACT}"

      - name: Upload only validated pre-OIDC failure evidence
        if: steps.static.outcome != 'success' && steps.pre_oidc_failure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11a-r7-pre-oidc-failure-${{ github.run_id }}
          path: ${{ env.R11A_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Stop after retained pre-OIDC failure
        if: steps.static.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Assume exact successor role under approved three-date intersection
        if: steps.static.outcome == 'success'
        id: configure
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.R11A_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-duration-seconds: 21600
          role-session-name: HLArchiveR11AIdentityBoundary
          allowed-account-ids: '630956766927'
          unset-current-credentials: true
          retry-max-attempts: 1
          action-timeout-s: 60
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"R11AApprovedThreeDateIntersection","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250728/*","arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250729/*","arn:aws:s3:::hl-mainnet-node-data/node_fills_by_block/hourly/20250730/*"]}]}

      - name: Produce and validate OIDC role-assumption failure artifact
        if: steps.static.outcome == 'success' && steps.configure.outcome != 'success'
        id: oidc_failure
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11a_corrective.entrypoint \
            --mode failure \
            --workspace "${R11A_WORKSPACE}" \
            --workflow-context "${R11A_BOUND_CONTEXT}" \
            --failure-phase OIDC_ROLE_ASSUMPTION \
            --failure-code OIDC_ROLE_ASSUMPTION_FAILURE
          rc=$?
          set -e
          test "${rc}" = 21
          python governance/validate_r11a_execution_artifact_r7.py "${R11A_ARTIFACT}"

      - name: Upload only validated OIDC failure evidence
        if: steps.oidc_failure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11a-r7-oidc-failure-${{ github.run_id }}
          path: ${{ env.R11A_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Stop after retained OIDC failure
        if: steps.static.outcome == 'success' && steps.configure.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Retain and validate minimized exact STS principal evidence
        if: steps.static.outcome == 'success' && steps.configure.outcome == 'success'
        id: principal
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json > "${R11A_PRINCIPAL}"
          python - <<'PY'
          import os
          from pathlib import Path
          from research.archive_inventory.r11a_corrective.context import PrincipalEvidence
          PrincipalEvidence.from_bytes(Path(os.environ['R11A_PRINCIPAL']).read_bytes())
          PY

      - name: Produce and validate STS principal failure artifact
        if: >-
          steps.static.outcome == 'success' &&
          steps.configure.outcome == 'success' &&
          steps.principal.outcome != 'success'
        id: sts_failure
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11a_corrective.entrypoint \
            --mode failure \
            --workspace "${R11A_WORKSPACE}" \
            --workflow-context "${R11A_BOUND_CONTEXT}" \
            --failure-phase STS_PRINCIPAL_VALIDATION \
            --failure-code STS_PRINCIPAL_VALIDATION_FAILURE
          rc=$?
          set -e
          test "${rc}" = 21
          python governance/validate_r11a_execution_artifact_r7.py "${R11A_ARTIFACT}"

      - name: Upload only validated STS failure evidence
        if: steps.sts_failure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11a-r7-sts-failure-${{ github.run_id }}
          path: ${{ env.R11A_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Stop after retained STS principal failure
        if: >-
          steps.static.outcome == 'success' &&
          steps.configure.outcome == 'success' &&
          steps.principal.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Execute bounded corrective R11A R7 diagnostic
        if: >-
          steps.static.outcome == 'success' &&
          steps.configure.outcome == 'success' &&
          steps.principal.outcome == 'success'
        id: execute
        shell: bash
        run: |
          set +e
          python -m research.archive_inventory.r11a_corrective.entrypoint \
            --mode execute \
            --workspace "${R11A_WORKSPACE}" \
            --workflow-context "${R11A_BOUND_CONTEXT}" \
            --principal-evidence "${R11A_PRINCIPAL}"
          rc=$?
          set -e
          test "${rc}" = 0 -o "${rc}" = 20 -o "${rc}" = 21

      - name: Independently validate complete artifact before any upload
        if: steps.execute.outcome == 'success'
        id: artifact_validate
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_r11a_execution_artifact_r7.py "${R11A_ARTIFACT}"

      - name: Upload only the already validated R11A R7 artifact
        if: steps.artifact_validate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r11a-r7-identity-boundary-${{ github.run_id }}
          path: ${{ env.R11A_ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce retained validated terminal artifact
        if: >-
          steps.static.outcome == 'success' &&
          steps.configure.outcome == 'success' &&
          steps.principal.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.artifact_validate.outcome }}" = success
          test -f "${R11A_ARTIFACT}/r11a-v2-result.json"
          test -f "${R11A_ARTIFACT}/R11A_V2_FILES.sha256"
          test -f "${R11A_ARTIFACT}/r11a-v2-package-boundary.txt"
